<meta charset="UTF-8">
<title>Internal CyberSec Practice </title>
<style>
  /* Palette v4: lightened again per direct feedback that v3 (bg #0f172a,
     panel #1e293b, panel-alt #334155, border #475569) still felt too heavy.
     Every neutral tier — panel-soft, bg, panel, panel-alt/border-soft,
     border — was blended toward white by the same ~12% factor, which
     preserves both the relative ordering and the ratio of gaps between
     tiers (monotonic transform), so nothing needed re-deriving by hand.
     Cards (panel, #26334a) still sit a shade darker than their surrounding
     column (panel-alt, #3d4c66) on purpose, like an inlaid tile — a
     deliberate look, not an elevation mistake.
     Also supports a real light theme: the app defaults to dark (:root),
     and toggling calls document.documentElement.setAttribute('data-theme',
     'light'|'dark') to swap every token below via the two data-theme
     blocks further down. Structural chrome (backgrounds/borders/text/
     buttons) is 100% token-driven so it flips cleanly; the SLA priority
     badges (Critical/High/Medium/Low) are colored from ticket data
     (DEFAULT_SLA_CONFIG), not these tokens, and were left untouched per
     the "don't touch existing logic" rule — their self-blended
     background+text formula already reads fine on both light and dark
     grounds, so no change was needed there either. */
  :root {
    --bg: #16203a;
    --panel: #26334a;
    --panel-soft: #111a2c;
    --panel-alt: #3d4c66;
    --border: #56677f;
    --border-soft: #3d4c66;
    --text: #f8fafc;
    --text-dim: #cbd5e1;
    --text-dimmer: #94a3b8;
    --text-faint: #7b8ca6;
    --accent: #22d3ee;
    --accent-strong: #06b6d4;
    --accent-soft: rgba(34, 211, 238, 0.18);
    --accent-glow: rgba(34, 211, 238, 0.25);
    --purple: #a78bfa;
    --purple-soft: rgba(167, 139, 250, 0.16);
    --danger: #f87171;
    --danger-soft: rgba(248, 113, 113, 0.16);
    --success: #34d399;
    --success-soft: rgba(52, 211, 153, 0.16);
    --warning: #fbbf24;
    --warning-soft: rgba(251, 191, 36, 0.16);
    --overlay-scrim: rgba(4, 7, 16, 0.72);
    --glass: rgba(15, 23, 42, 0.78);
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }

  /* Light theme — a considered, non-inverted palette (not just "flip the
     dark one"): warm-neutral slate paper tones, and every accent darkened
     a step from its dark-mode value (e.g. cyan-400→cyan-700) since a hue
     tuned to pop on near-black reads as washed-out on a light ground. */
  :root[data-theme="light"] {
    --bg: #eef2f7;
    --panel: #ffffff;
    --panel-soft: #f8fafc;
    --panel-alt: #e2e8f0;
    --border: #cbd5e1;
    --border-soft: #e2e8f0;
    --text: #0f172a;
    --text-dim: #475569;
    --text-dimmer: #64748b;
    --text-faint: #94a3b8;
    --accent: #0e7490;
    --accent-strong: #155e75;
    --accent-soft: rgba(14, 116, 144, 0.12);
    --accent-glow: rgba(14, 116, 144, 0.18);
    --purple: #7c3aed;
    --purple-soft: rgba(124, 58, 237, 0.12);
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
    --success: #059669;
    --success-soft: rgba(5, 150, 105, 0.1);
    --warning: #b45309;
    --warning-soft: rgba(180, 83, 9, 0.1);
    --overlay-scrim: rgba(15, 23, 42, 0.4);
    --glass: rgba(255, 255, 255, 0.82);
  }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  #app {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    width: 100%;
    font-size: 14px;
    line-height: 1.45;
  }
  #app :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #app * { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
  #app *::-webkit-scrollbar { width: 10px; height: 10px; }
  #app *::-webkit-scrollbar-track { background: transparent; }
  #app *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  #app *::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
  /* color:inherit is intentionally NOT here for button: an #app+type
     selector like "#app button" (specificity 1,0,1, an ID beats any number
     of classes) silently outranks every bare ".btn-primary/.icon-btn/
     .tab-btn/etc { color: ... }" rule in this file, which is exactly the
     bug the #app .btn-pause / #app .btn-resume comment below documents and
     works around — the difference is those two rules got the same
     specificity bump to win the fight, but nothing else did, so every
     other button's intended text color was silently discarded in favor of
     the inherited (near-white) --text color. select/input/textarea keep
     color:inherit — they aren't affected the same way since .field-input's
     own color already happens to equal the inherited --text. */
  #app select, #app input, #app textarea { font: inherit; color: inherit; }
  #app button { font: inherit; }
  #app button { cursor: pointer; }
  #app button:disabled { cursor: not-allowed; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  .topbar {
    border-bottom: 1px solid var(--border);
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 24px;
  }
  .topbar-row { display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    height: 32px; width: 32px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft); background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); transition: color .15s, border-color .15s; flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .icon-btn.active { background: var(--accent-soft); border-color: rgba(34,211,238,0.4); color: var(--accent-strong); }
  .brand-badge {
    height: 32px; width: 32px; border-radius: var(--radius-sm);
    background: var(--accent-soft); border: 1px solid rgba(34,211,238,0.3);
    display: flex; align-items: center; justify-content: center; color: var(--accent);
  }
  .brand-text { min-width: 0; }
  .brand-title { font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--text); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 11px; color: var(--text-dimmer); margin: 1px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .live-clock { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dimmer); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(34,211,238,.6); animation: pulse-dot 1.6s infinite; }
  @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(34,211,238,.55);} 70% { box-shadow: 0 0 0 7px rgba(34,211,238,0);} 100% { box-shadow: 0 0 0 0 rgba(34,211,238,0);} }
  .user-select-wrap { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-soft); background: var(--panel); border-radius: var(--radius-sm); padding: 6px 6px 6px 8px; }
  .current-user-name { font-size: 12px; color: var(--text); }
  .role-pill { font-size: 10px; font-family: var(--font-mono); padding: 2px 6px; border-radius: 4px; background: var(--panel-alt); color: var(--text-dim); }

  /* ---------- team tabs ---------- */
  .tabs-row { padding: 18px 24px 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tab-btn {
    display: flex; align-items: center; padding: 8px 16px; border-radius: 10px 10px 0 0;
    font-size: 13px; font-weight: 600; background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-dimmer); transition: color .15s;
  }
  .tab-btn:hover { color: var(--text-dim); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(148, 163, 184, 0.06); text-shadow: 0 0 18px rgba(34,211,238,0.35); }
  .tab-count { margin-left: 8px; font-size: 11px; font-family: var(--font-mono); color: var(--text-dimmer); }
  .tab-overdue { margin-left: 6px; display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; background: var(--danger-soft); border: 1px solid rgba(239,68,68,0.5); padding: 2px 6px; font-size: 10px; font-weight: 700; color: var(--danger); animation: pulse-soft 1.8s infinite; }
  @keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .tabs-actions { margin-left: auto; margin-bottom: 4px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .overdue-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none; }
  .overdue-toggle input { accent-color: var(--accent); cursor: pointer; }
  .btn-primary {
    border-radius: var(--radius-sm); background: var(--accent); color: #04222b; border: none;
    font-size: 13px; font-weight: 700; padding: 8px 16px; transition: background .15s;
  }
  .btn-primary:hover { background: #5eead4; }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { border-radius: var(--radius-sm); background: transparent; border: none; font-size: 13px; font-weight: 600; color: var(--text-dim); padding: 8px 16px; }
  .btn-ghost:hover { color: var(--text); }
  .btn-secondary { border-radius: var(--radius-sm); background: var(--panel-alt); border: 1px solid var(--border-soft); color: var(--text); font-size: 12px; font-weight: 600; padding: 6px 12px; }
  .btn-secondary:hover { border-color: var(--text-faint); }
  .btn-secondary.active { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
  .btn-danger { border-radius: var(--radius-sm); background: var(--danger); color: #fff; border: none; font-size: 12px; font-weight: 700; padding: 6px 12px; transition: filter .15s; }
  .btn-danger:hover { filter: brightness(1.1); }

  /* ---------- layout: sidebar + board ---------- */
  .layout-row { position: relative; display: flex; align-items: flex-start; }
  .sidebar { flex-shrink: 0; overflow: hidden; transition: width .28s ease; border-right: 1px solid var(--border); background: var(--panel-alt); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: 224px; }
  .sidebar.closed { width: 0; border-right-color: transparent; }
  .sidebar-inner { width: 224px; padding: 16px 12px; }
  .sidebar-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dimmer); font-weight: 700; padding: 0 8px; margin: 0 0 8px; }
  .sidebar-list { display: flex; flex-direction: column; gap: 4px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; color: var(--text-dim); border: 1px solid transparent; background: transparent; text-align: left; width: 100%;
  }
  .sidebar-item:hover { background: rgba(255,255,255,0.04); }
  .sidebar-item.active { background: var(--accent-soft); border-color: rgba(34,211,238,0.4); color: var(--accent-strong); box-shadow: 0 0 0 1px rgba(34,211,238,0.12), 0 4px 14px -4px var(--accent-glow); }
  .sidebar-item .lbl { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-count { font-family: var(--font-mono); font-size: 10px; border-radius: 999px; padding: 2px 6px; background: var(--panel-alt); color: var(--text-dimmer); }
  .sidebar-item.active .sidebar-count { background: rgba(34,211,238,0.2); color: var(--accent-strong); }

  .board-area { flex: 1; min-width: 0; padding: 20px 24px 32px; overflow-x: auto; }
  .board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .column {
    border-radius: var(--radius-lg); background: var(--panel-alt); border: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 200px;
  }
  .column-head { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); color: var(--text-dimmer); }
  .column-head .title { font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .column-head .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .column-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .column-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px 12px; color: var(--text-faint); }
  .column-empty svg { opacity: .5; }
  .column-empty span { font-size: 11px; }

  /* ---------- ticket card ---------- */
  .ticket-card {
    position: relative; width: 100%; text-align: left; border-radius: var(--radius-md);
    background: var(--panel); border: 1px solid var(--border); overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    transition: background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  .ticket-card:hover {
    background: var(--panel); border-color: rgba(34,211,238,0.5);
    box-shadow: 0 0 0 1px rgba(34,211,238,0.1), 0 10px 24px -12px rgba(0,0,0,0.45);
    transform: translateY(-1px);
  }
  .ticket-card.overdue { border-color: rgba(248,113,113,0.55); }
  .ticket-card.overdue:hover { border-color: var(--danger); box-shadow: 0 0 0 1px rgba(248,113,113,0.12), 0 10px 24px -12px rgba(0,0,0,0.5); }
  .ticket-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(34,211,238,0.35); }
  .ticket-card.selectable .ticket-body { padding-left: 34px; }
  .ticket-select-checkbox { position: absolute; top: 12px; left: 12px; z-index: 2; width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .ticket-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .ticket-body { padding: 12px 12px 12px 14px; }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 6px; }
  .ticket-id { font-family: var(--font-mono); font-size: 11px; color: var(--text-dimmer); letter-spacing: .02em; }
  .ticket-title { font-size: 13.5px; color: var(--text); font-weight: 600; line-height: 1.35; margin: 0 0 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ticket-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .ticket-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* ---------- badges ---------- */
  .badge-priority { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .badge-priority .dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-category { display: inline-flex; align-items: center; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-soft); padding: 2px 8px; font-size: 10px; font-weight: 500; color: var(--text-dim); }
  .badge-overdue { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--danger-soft); border: 1px solid rgba(239,68,68,0.6); color: var(--danger); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px; font-size: 10px; animation: pulse-soft 1.8s infinite; }
  .badge-frozen { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--panel-alt); border: 1px solid var(--border-soft); color: var(--text-dim); font-weight: 600; padding: 2px 8px; font-size: 10px; }

  /* ---------- assignee ---------- */
  /* min-width:0 lets this shrink in the .ticket-footer flex row instead of
     forcing .timer-line (flex-shrink:0, must always stay fully visible) past
     the card's edge, where .ticket-card's overflow:hidden would clip it —
     e.g. "05:23:11" rendering as just "05:". */
  .assignee { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .avatar { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid var(--border-soft); font-family: var(--font-mono); font-weight: 700; color: var(--text); flex-shrink: 0; }
  .avatar.sm { width: 24px; height: 24px; font-size: 10px; }
  .avatar.md { width: 36px; height: 36px; font-size: 12px; }
  .avatar-unassigned { display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(239,68,68,0.6); background: var(--danger-soft); color: var(--danger); font-weight: 700; flex-shrink: 0; }
  .assignee-name { font-size: 11px; color: var(--text-dim); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .assignee-name.md { font-size: 13px; max-width: none; }
  .unassigned-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--danger); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .timer-line { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; flex-shrink: 0; white-space: nowrap; }
  .timer-line svg { flex-shrink: 0; }

  /* ---------- modals ---------- */
  /* align-items:flex-start (never "center") anchors the panel's TOP edge at
     a fixed offset from the viewport top — the overlay's own 16px padding —
     that never recomputes based on the panel's height. align-items:center
     would keep re-centering as content grows, dragging the top edge upward;
     flex-start + no auto margin on the panel means the top is simply fixed,
     full stop, regardless of viewport height or how much content grows. */
  .modal-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 16px; background: var(--overlay-scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; }
  /* Belt-and-suspenders structural fix on top of the fixed top anchor above:
     the panel is a flex column with a hard max-height and overflow:hidden.
     The header is flex-shrink:0 (never compresses, is never part of any
     scroll region) and .modal-body is the ONLY flex:1 + overflow-y:auto
     child — so growing content (e.g. expanding history) can only ever add
     scroll height inside modal-body. The panel's own box never resizes past
     its cap, so there's nothing for the header's position to react to. */
  .modal-panel { width: 100%; max-width: 640px; max-height: 88vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--border-soft); box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(148,163,184,0.06); }
  .modal-panel.narrow { max-width: 520px; }
  .modal-head { flex-shrink: 0; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 18px 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .modal-head-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--text); margin: 0; line-height: 1.35; }
  .modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 22px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dimmer); font-weight: 700; margin: 0 0 8px; }
  .section-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

  .sla-panel { border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--panel-soft); padding: 18px; }
  .sla-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .sla-panel-head .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dimmer); font-weight: 700; }
  .sla-panel-head .due { font-size: 11px; color: var(--text-dimmer); font-family: var(--font-mono); }
  .sla-timer { font-family: var(--font-mono); font-size: 34px; font-weight: 800; }
  .sla-track { margin-top: 12px; height: 6px; width: 100%; border-radius: 999px; background: var(--border); overflow: hidden; }
  .sla-track-fill { height: 100%; border-radius: 999px; transition: width .5s; }
  .sla-meta-row { margin-top: 14px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-dimmer); }
  .sla-actions { margin-top: 14px; display: flex; gap: 8px; }
  /* #app .btn-pause / #app .btn-resume still carries the #app prefix from
     when the old global "#app button { color: inherit }" reset (an ID+type
     selector) silently outranked every bare ".btn-x { color: ... }" rule in
     this file — that reset has since been narrowed to no longer touch
     button color at all (see the comment above "#app button { font: inherit; }"
     near the top of this stylesheet), so a plain ".btn-pause"/".btn-resume"
     would work fine today too. Left as-is since it's still correct either
     way and every other button class was the one that needed fixing. */
  .btn-pause, .btn-resume { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; padding: 8px 16px; transition: background .15s, border-color .15s; }
  #app .btn-pause { background: rgba(245, 158, 11, 0.16); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.5); }
  #app .btn-pause:hover { background: rgba(245, 158, 11, 0.28); border-color: rgba(245, 158, 11, 0.7); }
  #app .btn-resume { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.5); }
  #app .btn-resume:hover { background: rgba(16, 185, 129, 0.28); border-color: rgba(16, 185, 129, 0.7); }

  .status-panel { border-radius: var(--radius-md); border: 1px solid; padding: 18px; display: flex; align-items: center; gap: 12px; }
  .status-panel .emoji { font-size: 30px; line-height: 1; }
  .status-panel h4 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .02em; }

      '<div class="history-dot-col"><div class="history-dot">' + historyIcon(entry.action) + '</div><div class="history-line"></div></div>' +
      '<div class="history-content">' +
      '<div class="history-head"><span class="history-action">' + escapeHtml(entry.action) + '</span><span class="history-time mono">' + formatClock(entry.time) + "</span>" +
      (canDelete ? '<button type="button" class="history-delete" data-action="delete-pause-log" data-id="' + ticketId + '" data-entry="' + entry.id + '" title="Delete this pause log — recalculates paused minutes and restores the SLA date">' + I("trash", 12) + "</button>" : "") +
      "</div>" +
      (entry.note ? '<p class="history-note">' + escapeHtml(entry.note) + "</p>" : "") +
      "</div></div>";
  }

  // =====================================================================
  // RENDER — TOP LEVEL SECTIONS
  // =====================================================================
  function renderTopBar() {
    var u = state.currentUserId;
    return '<div class="topbar"><div class="topbar-row">' +
      '<button type="button" class="icon-btn' + (state.sidebarOpen ? " active" : "") + '" data-action="toggle-sidebar" title="' + (state.sidebarOpen ? "Hide status filters" : "Show status filters") + '">' + I("sidebarToggle", 16) + "</button>" +
      '<div class="brand-badge">' + I("shield", 16) + "</div>" +
      '<div class="brand-text"><p class="brand-title">Internal CyberSec Practice</p><p class="brand-sub">SOC &amp; Threat Hunt</p></div>' +
      '<div class="topbar-right">' +
      '<div class="live-clock"><span class="live-dot"></span><span data-role="header-clock">live · ' + new Date(state.now).toLocaleTimeString() + "</span></div>" +
      '<button type="button" class="icon-btn" data-action="toggle-theme" title="' + (state.theme === "dark" ? "Switch to light theme" : "Switch to dark theme") + '">' + I(state.theme === "dark" ? "sun" : "moon", 16) + "</button>" +
      // Fixed identity until real auth (Google SSO) lands — no switcher UI,
      // just a static readout of the one hardcoded user (see state.currentUserId).
      '<div class="user-select-wrap">' + avatarHtml(userName(u)) +
      '<span class="current-user-name">' + escapeHtml(userName(u)) + "</span>" +
      '<span class="role-pill">' + escapeHtml(userRole(u) || "") + "</span>" +
      "</div></div></div></div>";
  }

  function renderTeamTabs() {
    // Both objects derived from TEAMS (was a hardcoded {SOC,TI} literal
    // each) so a new team's tab renders with real counts instead of never
    // appearing in the tab row at all.
    var counts = {};
    Object.keys(TEAMS).forEach(function (key) {
      counts[key] = state.tickets.filter(function (t) { return t.team === key; }).length;
    });
    var overdueCounts = {};
    Object.keys(TEAMS).forEach(function (key) { overdueCounts[key] = 0; });
    state.tickets.forEach(function (t) { if (isOverdue(t, state.now)) overdueCounts[t.team] += 1; });

    var tabs = Object.keys(TEAMS).map(function (key) {
      var active = state.view === "board" && state.team === key;
      var od = overdueCounts[key];
      return '<button type="button" class="tab-btn' + (active ? " active" : "") + '" data-action="select-team" data-team="' + key + '">' +
        I("layoutGrid", 13) + '<span style="margin-left:6px">' + escapeHtml(TEAMS[key]) + "</span>" +
        '<span class="tab-count mono">' + counts[key] + "</span>" +
        (od > 0 ? '<span class="tab-overdue">🔴 ' + od + "</span>" : "") +
        "</button>";
    }).join("");

    var analyticsTab = '<button type="button" class="tab-btn' + (state.view === "analytics" ? " active" : "") + '" data-action="open-analytics" title="SOC Analytics &amp; Metrics">' +
      '<span style="margin-right:6px">📊</span>Dashboard / Analytics</button>';

    var adminTab = "";
    if (canAccessAdminSettings(state.currentUserId)) {
      var activeSettings = state.view === "settings";
      adminTab = '<button type="button" class="tab-btn' + (activeSettings ? " active" : "") + '" data-action="open-settings" title="Admin / SLA Settings">' +
        I("settings", 14) + '<span style="margin-left:6px">Admin / SLA Settings</span></button>';
    }

    var actions = "";
    if (state.view === "board") {
      var odTeam = overdueCounts[state.team];
      var myTicketCount = state.tickets.filter(function (t) { return t.team === state.team && t.assignee === state.currentUserId; }).length;
      // "Only My Tickets" and the Assignee dropdown share one underlying
      // filter (effectively assigneeFilter) so they can never disagree —
      // checking the box is equivalent to picking the current user in the
      // dropdown (and the dropdown reflects that, just disabled); picking
      // a different analyst in the dropdown clears the checkbox.
      var effectiveAssigneeValue = state.onlyMyTickets ? state.currentUserId : state.assigneeFilter;
      var assigneeFilterOptions = '<option value=""' + (effectiveAssigneeValue === "" ? " selected" : "") + ">All Assignees</option>" +
        '<option value="unassigned"' + (effectiveAssigneeValue === "unassigned" ? " selected" : "") + ">Unassigned</option>" +
        usersForTeam(state.team).map(function (u) {
          return '<option value="' + u.id + '"' + (effectiveAssigneeValue === u.id ? " selected" : "") + ">" + escapeHtml(u.name) + "</option>";
        }).join("");
      actions = '<div class="tabs-actions">' +
        '<select class="field-input" style="width:auto;padding:6px 10px;font-size:12px" data-action="filter-assignee" title="Filter board by assignee"' + (state.onlyMyTickets ? " disabled" : "") + ">" + assigneeFilterOptions + "</select>" +
        '<label class="overdue-toggle"><input type="checkbox" data-action="toggle-my-tickets"' + (state.onlyMyTickets ? " checked" : "") + "> Only My Tickets" +
        (state.onlyMyTickets && myTicketCount > 0 ? '<span class="mono" style="color:var(--accent)">(' + myTicketCount + ")</span>" : "") +
        "</label>" +
        '<label class="overdue-toggle"><input type="checkbox" data-action="toggle-overdue-only"' + (state.showOverdueOnly ? " checked" : "") + "> Show Overdue Only" +
        (state.showOverdueOnly && odTeam > 0 ? '<span class="mono" style="color:var(--danger)">(' + odTeam + ")</span>" : "") +
        "</label>" +
        '<button type="button" class="btn-secondary' + (state.selectMode ? " active" : "") + '" data-action="toggle-select-mode">' + (state.selectMode ? "Cancel Select" : "Select") + "</button>" +
        (state.selectMode && state.selectedTicketIds.length > 0
          ? '<button type="button" class="btn-danger" data-action="delete-selected-tickets">Delete Selected (' + state.selectedTicketIds.length + ")</button>"
          : "") +
        '<button type="button" class="btn-primary" data-action="open-create">+ New Ticket</button>' +
        "</div>";
    }

    return '<div class="tabs-row">' + tabs + analyticsTab + adminTab + actions + "</div>";
  }

  function renderSidebar() {
    var counts = { All: 0 };
    STATUSES.forEach(function (s) { counts[s] = 0; });
    state.tickets.filter(function (t) { return t.team === state.team; }).forEach(function (t) {
      counts.All += 1;
      counts[t.status] = (counts[t.status] || 0) + 1;
    });
    var items = [{ key: "All", label: "All Tickets", icon: "listChecks" }].concat(
      STATUSES.map(function (s) { return { key: s, label: s, icon: STATUS_ICON[s] }; })
    );
    var rows = items.map(function (it) {
      var active = state.statusFilter === it.key;
      return '<button type="button" class="sidebar-item' + (active ? " active" : "") + '" data-action="select-status" data-status="' + it.key + '">' +
        I(it.icon, 13) + '<span class="lbl">' + escapeHtml(it.label) + "</span>" +
        '<span class="sidebar-count mono">' + (counts[it.key] || 0) + "</span></button>";
    }).join("");
    return '<div class="sidebar' + (state.sidebarOpen ? "" : " closed") + '"><div class="sidebar-inner">' +
      '<p class="sidebar-label">Status Filters</p><div class="sidebar-list">' + rows + "</div>" +
      "</div></div>";
  }

  function renderBoard() {
    var visibleColumns = state.statusFilter === "All" ? STATUSES : [state.statusFilter];
    var visibleTickets = state.tickets.filter(function (t) { return t.team === state.team; });
    if (state.statusFilter !== "All") visibleTickets = visibleTickets.filter(function (t) { return t.status === state.statusFilter; });
    if (state.showOverdueOnly) visibleTickets = visibleTickets.filter(function (t) { return isOverdue(t, state.now); });
    if (state.onlyMyTickets) {
      visibleTickets = visibleTickets.filter(function (t) { return t.assignee === state.currentUserId; });
    } else if (state.assigneeFilter === "unassigned") {
      visibleTickets = visibleTickets.filter(function (t) { return !t.assignee || t.assignee === UNASSIGNED; });
    } else if (state.assigneeFilter) {
      visibleTickets = visibleTickets.filter(function (t) { return t.assignee === state.assigneeFilter; });
    }

    var grouped = {};
    visibleColumns.forEach(function (c) { grouped[c] = []; });
    visibleTickets.forEach(function (t) {
      // Normalize defensively at render time too — guarantees a ticket is
      // always placed in a real column instead of silently disappearing
      // (which is what a corrupted/unexpected status string would cause).
      var bucketStatus = normalizeStatus(t.status);
      var bucket = grouped[bucketStatus] || grouped[STATUSES[0]];
      if (bucket) bucket.push(t);
    });

    var cols = visibleColumns.map(function (col) {
      var list = grouped[col];
      var cards = list.length === 0
        ? '<div class="column-empty">' + I(STATUS_ICON[col], 22) + "<span>Empty</span></div>"
        : list.map(ticketCardHtml).join("");
      return '<div class="column"><div class="column-head">' + I(STATUS_ICON[col], 13) +
        '<span class="title">' + escapeHtml(col) + "</span><span class=\"count mono\">" + list.length + "</span></div>" +
        '<div class="column-body">' + cards + "</div></div>";
    }).join("");

    return '<div class="layout-row">' + renderSidebar() +
      '<div class="board-area"><div class="board-grid">' + cols + "</div></div></div>";
  }

  // =====================================================================
  // RENDER — ANALYTICS DASHBOARD
  // =====================================================================
  // accentVar/glowVar are theme-aware CSS var() references (e.g. "var(--accent)" /
  // "var(--accent-soft)") — never a raw hex/rgba — so the accent bar and the
  // ambient glow both automatically re-tint correctly when light/dark theme
  // is toggled, the same way every other color in this app is theme-driven.
  function kpiCardHtml(icon, label, value, sub, accentVar, glowVar, badgeHtml, extraHtml) {
    return '<div class="kpi-card" style="box-shadow:0 0 32px -18px ' + glowVar + ', 0 10px 24px -18px rgba(0,0,0,0.4);">' +
      '<div class="kpi-accent-bar" style="background:' + accentVar + ';"></div>' +
      '<p class="kpi-label">' + I(icon, 13) + " " + escapeHtml(label) + (badgeHtml || "") + "</p>" +
      '<p class="kpi-value">' + escapeHtml(value) + "</p>" +
      (extraHtml || "") +
      '<p class="kpi-sub">' + escapeHtml(sub) + "</p>" +
    "</div>";
  }

  function kpiChipHtml(color, label, count) {
    return '<span class="kpi-chip"><span class="dot" style="background:' + color + ';"></span>' + escapeHtml(label) + ' <span class="mono">' + count + "</span></span>";
  }

  // 90%+ is the generally-accepted "healthy" SOC SLA compliance bar; below
  // that but still majority-compliant is a soft warning, and under 70% is a
  // real problem worth calling out in red — matches the thresholds the user
  // asked for (emerald / amber / red).
  function complianceTier(rate) {
    if (rate >= 90) return { cls: "good", label: "On Target", accentVar: "var(--success)", glowVar: "var(--success-soft)" };
    if (rate >= 70) return { cls: "warn", label: "Needs Attention", accentVar: "var(--warning)", glowVar: "var(--warning-soft)" };
    return { cls: "bad", label: "At Risk", accentVar: "var(--danger)", glowVar: "var(--danger-soft)" };
  }

  // Every category (across both teams) gets one fixed color from this
  // palette, assigned by its index in CATEGORY_COLOR_ORDER — not by sort
  // rank within a render — so a category's color never shifts between
  // renders just because its relative count changed. Reuses the app's own
  // accent tokens first (cyan/violet/emerald/amber/red) and extends with a
  // few more distinct hues for teams whose category list runs longer.
  var CATEGORY_COLOR_ORDER = CATEGORIES.SOC.concat(CATEGORIES.TI.filter(function (c) { return CATEGORIES.SOC.indexOf(c) === -1; }));
  var CATEGORY_COLOR_PALETTE = [
    "linear-gradient(90deg, var(--accent), var(--accent-strong))",
    "linear-gradient(90deg, var(--purple), #6d28d9)",
    "linear-gradient(90deg, var(--success), #059669)",
    "linear-gradient(90deg, var(--warning), #d97706)",
    "linear-gradient(90deg, var(--danger), #b91c1c)",
    "linear-gradient(90deg, #38bdf8, #0369a1)",
    "linear-gradient(90deg, #f472b6, #be185d)",
    "linear-gradient(90deg, #a3e635, #4d7c0f)"
  ];
  function categoryColor(category) {
    var idx = CATEGORY_COLOR_ORDER.indexOf(category);
    return CATEGORY_COLOR_PALETTE[(idx === -1 ? 0 : idx) % CATEGORY_COLOR_PALETTE.length];
  }

  function barRowHtml(label, count, max, color) {
    // Width is always relative to the max count within THIS group (workload
    // or category), never a fixed/global scale — so the busiest entry in a
    // small group still reads as "the most", not as an absolute overflow.
    // (This means the single largest bar in a group legitimately renders at
    // 100% even when its raw count is small, e.g. 2 — that's correct
    // relative scaling, not a bug: with only 1-2 tickets in the group there
    // is nothing bigger to compare against.) A floor of 8% keeps a nonzero
    // bar visibly present even for small counts against a much larger max —
    // 0% would render as an unreadable sliver indistinguishable from "no
    // data" for the shortest bar in the list.
    var pct = count === 0 ? 0 : Math.max(8, Math.round((count / max) * 100));
    return '<div class="bar-row"><span class="bar-row-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%;background:' + color + ';"></span></span>' +
      '<span class="bar-row-count mono">' + count + "</span></div>";
  }

  // A ring gauge built from three stacked SVG arcs (stroke-dasharray +
  // stroke-dashoffset driven) rather than a canvas/chart library — the
  // Artifact CSP blocks CDN scripts, so every visual in this dashboard is
  // hand-rolled SVG/CSS. The three counts are mutually exclusive buckets
  // (isOverdue() already excludes paused tickets, so "paused" and "breached"
  // never double up) and always sum to `total`, so the three arc lengths
  // always tile the full circle with no gap or overlap.
  function slaGaugeHtml(total, onTimeCount, breachedCount, pausedCount) {
    var r = 46, circumference = 2 * Math.PI * r;
    var onTimeLen = total > 0 ? (onTimeCount / total) * circumference : 0;
    var breachedLen = total > 0 ? (breachedCount / total) * circumference : 0;
    var pausedLen = total > 0 ? (pausedCount / total) * circumference : 0;
    var onTimePct = total > 0 ? Math.round((onTimeCount / total) * 100) : 0;
    return '<div class="gauge-wrap">' +
      '<div class="gauge-svg-wrap"><svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg)">' +
        '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--border-soft)" stroke-width="12"/>' +
        (onTimeLen > 0
          ? '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--success)" stroke-width="12" stroke-dasharray="' + onTimeLen + " " + circumference + '" stroke-dashoffset="0"/>'
          : "") +
        (breachedLen > 0
          ? '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--danger)" stroke-width="12" stroke-dasharray="' + breachedLen + " " + circumference + '" stroke-dashoffset="-' + onTimeLen + '"/>'
          : "") +
        (pausedLen > 0
          ? '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--warning)" stroke-width="12" stroke-dasharray="' + pausedLen + " " + circumference + '" stroke-dashoffset="-' + (onTimeLen + breachedLen) + '"/>'
          : "") +
      "</svg>" +
      '<div class="gauge-center-text"><p class="gauge-center-value">' + (total > 0 ? onTimePct + "%" : "—") + '</p><p class="gauge-center-label">On-Time</p></div>' +
      "</div>" +
      '<div class="gauge-legend">' +
        '<div class="gauge-legend-item"><span class="gauge-dot" style="background:var(--success)"></span>On-Time<span class="mono">' + onTimeCount + "</span></div>" +
        '<div class="gauge-legend-item"><span class="gauge-dot" style="background:var(--danger)"></span>Breached<span class="mono">' + breachedCount + "</span></div>" +
        '<div class="gauge-legend-item"><span class="gauge-dot" style="background:var(--warning)"></span>Paused<span class="mono">' + pausedCount + "</span></div>" +
      "</div>" +
    "</div>";
  }

  function formatResolutionTime(ms) {
    if (ms <= 0) return "—";
    var totalMin = Math.round(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    if (h === 0) return m + "m";
    return h + "h " + m + "m";
  }

  // Snapshot of the last-computed dashboard numbers, refreshed on every
  // renderAnalytics() call — "Export Summary" reads this rather than
  // recomputing the filters/aggregates itself, so the exported JSON is
  // always exactly what's on screen at the moment of the click.
  var lastAnalyticsSnapshot = null;

  function renderAnalytics() {
    var now = state.now;
    var teamFilter = state.analyticsTeamFilter; // "All" | "SOC" | "TI"
    var dateFilter = state.analyticsDateFilter; // "Today" | "This Week" | "All Time"

    function inDateRange(t) {
      if (dateFilter === "All Time") return true;
      if (dateFilter === "Today") {
        var d = new Date(t.createdAt), today = new Date(now);
        return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
      }
      return now - t.createdAt <= 7 * 24 * 3600 * 1000; // "This Week" = trailing 7 days
    }

    var tickets = state.tickets.filter(function (t) {
      if (teamFilter !== "All" && t.team !== teamFilter) return false;
      return inDateRange(t);
    });

    var total = tickets.length;
    var active = tickets.filter(function (t) { return TERMINAL_STATUSES.indexOf(t.status) === -1; });
    var overdueOpen = active.filter(function (t) { return isOverdue(t, now); });
    var breachedResolved = tickets.filter(function (t) { return t.dateTimeResolved != null && t.dateTimeResolved > t.slaDate; });
    var breachedTotal = overdueOpen.length + breachedResolved.length;
    // isOverdue() already treats a paused ticket as never-overdue (its clock
    // is frozen), so overdueOpen and pausedCount are mutually exclusive —
    // these three buckets always sum to `total` with no double-count.
    var pausedCount = active.filter(function (t) { return t.isPaused; }).length;
    var onTimeCount = Math.max(0, total - breachedTotal - pausedCount);
    // Compliance Rate and the SLA Performance gauge's "On-Time %" must be the
    // exact same number wherever they're both shown — both are onTimeCount /
    // total, full stop. (An earlier version counted a paused ticket as
    // "compliant" here while the gauge broke it out as its own slice, which
    // made the KPI and the gauge silently disagree — same input, different
    // formula. Never let two displays of "the same metric" diverge like that.)
    var complianceRate = total > 0 ? Math.round((onTimeCount / total) * 100) : 100;
    var tier = complianceTier(complianceRate);

    var newCount = tickets.filter(function (t) { return t.status === "New"; }).length;
    var inProgressCount = tickets.filter(function (t) { return t.status === "In Progress"; }).length;
    var resolvedCount = tickets.filter(function (t) { return t.status === "Resolved"; }).length;

    var resolvedWithTimes = tickets.filter(function (t) { return t.status === "Resolved" && t.dateTimeResolved != null; });
    var avgResolutionMs = resolvedWithTimes.length > 0
      ? resolvedWithTimes.reduce(function (sum, t) { return sum + (t.dateTimeResolved - t.createdAt); }, 0) / resolvedWithTimes.length
      : 0;

    var activeBreakdownHtml = '<div class="kpi-breakdown">' +
      kpiChipHtml("var(--accent)", "New", newCount) +
      kpiChipHtml("var(--warning)", "In Progress", inProgressCount) +
      kpiChipHtml("var(--success)", "Resolved", resolvedCount) +
    "</div>";
    var complianceBadgeHtml = '<span class="compliance-badge compliance-badge--' + tier.cls + '">' + escapeHtml(tier.label) + "</span>";

    var kpiHtml = '<div class="kpi-grid">' +
      kpiCardHtml("listChecks", "Total Active Tickets", String(active.length), active.length + " of " + total + " ticket" + (total === 1 ? "" : "s") + " in range", "var(--accent)", "var(--accent-soft)", "", activeBreakdownHtml) +
      kpiCardHtml("checkCircle", "SLA Compliance Rate", complianceRate + "%", breachedTotal + " breached · " + pausedCount + " paused of " + total, tier.accentVar, tier.glowVar, complianceBadgeHtml) +
      kpiCardHtml("alertTriangle", "Overdue / Breached", String(breachedTotal), overdueOpen.length + " open overdue · " + breachedResolved.length + " resolved late", "var(--danger)", "var(--danger-soft)") +
      kpiCardHtml("clock", "Avg. Resolution Time", formatResolutionTime(avgResolutionMs), resolvedWithTimes.length + " resolved ticket" + (resolvedWithTimes.length === 1 ? "" : "s") + " in range", "var(--purple)", "var(--purple-soft)") +
      "</div>";

    var gaugeHtml = slaGaugeHtml(total, onTimeCount, breachedTotal, pausedCount);

    // Workload: active (non-terminal) tickets only — "currently handling",
    // not lifetime ticket volume, which is what the category chart is for.
    var workloadMap = {};
    active.forEach(function (t) {
      var key = t.assignee && t.assignee !== UNASSIGNED ? t.assignee : "unassigned";
      workloadMap[key] = (workloadMap[key] || 0) + 1;
    });
    var workloadEntries = Object.keys(workloadMap).map(function (key) {
      return { label: key === "unassigned" ? "Unassigned" : userName(key), count: workloadMap[key], unassigned: key === "unassigned" };
    }).sort(function (a, b) { return b.count - a.count; });
    var maxWorkload = workloadEntries.reduce(function (m, e) { return Math.max(m, e.count); }, 0) || 1;
    var workloadHtml = workloadEntries.length === 0
      ? '<p class="footnote">No active tickets in range.</p>'
      : '<div class="bar-list">' + workloadEntries.map(function (e) {
          // Unassigned gets a neutral slate tone, distinct from the cyan/blue
          // used for every analyst who actually owns their tickets — but not
          // red, since an unassigned ticket isn't itself an error/breach
          // state (that's what the overdue badge/SLA gauge are for).
          var grad = e.unassigned ? "linear-gradient(90deg, #64748B, #94A3B8)" : "linear-gradient(90deg, var(--accent), var(--accent-strong))";
          return barRowHtml(e.label, e.count, maxWorkload, grad);
        }).join("") + "</div>";

    // Category: every ticket in range (not just active) — a volume-of-work
    // view, so resolved/closed tickets still count toward their category.
    var categoryMap = {};
    tickets.forEach(function (t) { categoryMap[t.category] = (categoryMap[t.category] || 0) + 1; });
    var categoryEntries = Object.keys(categoryMap).map(function (key) {
      return { label: key, count: categoryMap[key] };
    }).sort(function (a, b) { return b.count - a.count; });
    var maxCategory = categoryEntries.reduce(function (m, e) { return Math.max(m, e.count); }, 0) || 1;
    var categoryHtml = categoryEntries.length === 0
      ? '<p class="footnote">No tickets in range.</p>'
      : '<div class="bar-list">' + categoryEntries.map(function (e) {
          return barRowHtml(e.label, e.count, maxCategory, categoryColor(e.label));
        }).join("") + "</div>";

    var teamOptions = ["All"].concat(Object.keys(TEAMS)).map(function (key) {
      var label = key === "All" ? "All Teams" : TEAMS[key];
      return '<button type="button" class="analytics-segment-btn' + (teamFilter === key ? " active" : "") + '" data-action="analytics-team-filter" data-team="' + key + '">' + escapeHtml(label) + "</button>";
    }).join("");
    var rangeOptions = ["Today", "This Week", "All Time"].map(function (key) {
      return '<button type="button" class="analytics-segment-btn' + (dateFilter === key ? " active" : "") + '" data-action="analytics-date-filter" data-range="' + key + '">' + key + "</button>";
    }).join("");

    lastAnalyticsSnapshot = {
      generatedAt: now,
      filters: { team: teamFilter === "All" ? "All Teams" : TEAMS[teamFilter], dateRange: dateFilter },
      totals: { ticketsInRange: total, activeTickets: active.length, newTickets: newCount, inProgressTickets: inProgressCount, resolvedTickets: resolvedCount },
