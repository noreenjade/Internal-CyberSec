  }

  function showBackupToast(message) {
    state.toast = message;
    render();
    setTimeout(function () { state.toast = null; render(); }, 3200);
  }

  function exportBackup() {
    // Re-checked here, not just hidden in the UI — same defense-in-depth
    // pattern as comment edit/delete elsewhere in this app.
    if (!isSuperAdmin(state.currentUserId)) {
      showBackupToast("🔒 Superadmin Restricted: Only primary system administrators can export or restore database snapshots.");
      return;
    }
    try {
      var backup = {
        format: "cyberops-task-tracker-backup",
        version: 1,
        exportedAt: Date.now(),
        tickets: state.tickets,
        slaConfig: state.slaConfig,
        categories: { SOC: CATEGORIES.SOC, TI: CATEGORIES.TI },
        agencies: { NSOC: AGENCIES.NSOC },
        users: { SOC: USERS.SOC, TI: USERS.TI, NSOC: USERS.NSOC, LEADERSHIP: LEADERSHIP }
      };
      var blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var stamp = new Date(backup.exportedAt).toISOString().slice(0, 10);
      var a = document.createElement("a");
      a.href = url;
      a.download = "cyberops-backup-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showBackupToast("Backup downloaded — cyberops-backup-" + stamp + ".json");
    } catch (err) {
      console.error("Export failed:", err);
      showBackupToast("Export failed — see console for details.");
    }
  }

  function restoreBackupFromFile(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var parsed = JSON.parse(ev.target.result);
        var validShape = parsed && Array.isArray(parsed.tickets) && parsed.slaConfig && parsed.users &&
          Array.isArray(parsed.users.SOC) && Array.isArray(parsed.users.TI) && Array.isArray(parsed.users.LEADERSHIP);
        if (!validShape) {
          showBackupToast("That file doesn't look like a CyberOps backup — restore canceled.");
          return;
        }
        // categories/NSOC roster/agencies are all optional so a backup
        // exported before NSOC/category export/restore existed can still
        // restore cleanly — each just leaves its own current value alone
        // instead of failing the whole restore over a field that didn't
        // exist yet when the file was made.
        var hasCategories = parsed.categories && Array.isArray(parsed.categories.SOC) && Array.isArray(parsed.categories.TI);
        var hasNsocRoster = parsed.users && Array.isArray(parsed.users.NSOC);
        var hasAgencies = parsed.agencies && Array.isArray(parsed.agencies.NSOC);
        var ticketCount = parsed.tickets.length;
        var userCount = parsed.users.SOC.length + parsed.users.TI.length + parsed.users.LEADERSHIP.length;
        var confirmed = window.confirm(
          "Restore this backup?\n\n" + ticketCount + " tickets and " + userCount + " roster members will REPLACE everything currently in the app — tickets, SLA config, and roster. This can't be undone.\n\nContinue?"
        );
        if (!confirmed) return;

        state.tickets = parsed.tickets;
        state.slaConfig = parsed.slaConfig;
        state.slaDraft = null; // stale draft would otherwise fight the just-restored config
        USERS.SOC = parsed.users.SOC;
        USERS.TI = parsed.users.TI;
        LEADERSHIP = parsed.users.LEADERSHIP;
        if (hasNsocRoster) USERS.NSOC = parsed.users.NSOC;
        if (hasCategories) {
          CATEGORIES.SOC = parsed.categories.SOC;
          CATEGORIES.TI = parsed.categories.TI;
        }
        if (hasAgencies) AGENCIES.NSOC = parsed.agencies.NSOC;

        // Clear any UI state that might reference a ticket/user/comment that
        // no longer exists after the swap.
        state.selectedId = null;
        state.createOpen = false;
        editingUserId = null; editingUserDraft = null;
        addingUser = false; addUserDraft = null;
        editingCommentId = null; editingCommentDraft = null;
        if (!getAllUsers().some(function (u) { return u.id === state.currentUserId; })) {
          var fallback = getAllUsers();
          state.currentUserId = fallback.length ? fallback[0].id : "";
        }

        persistTickets();
        persistSlaConfig(state.slaConfig);
        persistRoster();
        if (hasCategories) persistCategories();
        if (hasAgencies) persistAgencies();
        showBackupToast(
          "Backup restored — " + ticketCount + " tickets and " + userCount + " roster members loaded" +
          (hasCategories ? "" : " (categories unchanged — this backup predates category export)") +
          (hasNsocRoster || hasAgencies ? "" : " (NSOC roster/agencies unchanged — this backup predates NSOC)") +
          "."
        );
      } catch (err) {
        console.error("Restore failed:", err);
        showBackupToast("Restore failed — the file may be corrupted. See console for details.");
      }
    };
    reader.onerror = function () {
      console.error("Restore failed: could not read the file.");
      showBackupToast("Restore failed — could not read the file.");
    };
    reader.readAsText(file);
  }

  // =====================================================================
  // MASTER RENDER
  // =====================================================================
  function render() {
    // render() replaces #app's entire innerHTML on every action, which
    // destroys and recreates the modal's scrollable elements from scratch —
    // and a freshly created scrollable element always starts at scrollTop 0.
    // Without this, expanding history (or any other in-modal action, like
    // Save Changes or Pause) while scrolled down would silently snap the
    // view back to the top of the modal on every single re-render, which
    // looks exactly like "the modal jumped" even though its outer position
    // never actually moves. Snapshot each scrollable container's position
    // before the DOM is torn down, then restore it on the new element.
    // Only one modal (ticket or create) is ever open at a time in this app,
    // so a plain index-based snapshot is enough — no need to distinguish
    // which modal a given .modal-body belongs to.
    var scrollSnapshots = Array.prototype.map.call(document.querySelectorAll(".modal-body"), function (el) {
      return el.scrollTop;
    });
    // A render-time exception must never leave the screen silently frozen —
    // surface it and recover to a safe board view instead of a blank #app.
    try {
      var html = renderTopBar() + renderTeamTabs();
      if (state.view === "board") html += renderBoard();
      else if (state.view === "analytics") html += renderAnalytics();
      else html += settingsHtml();
      html += ticketModalHtml();
      html += createModalHtml();
      // Was previously appended only inside settingsHtml(), so
      // showBackupToast() (called from delete-ticket, post-comment,
      // bulk-delete, export-analytics-summary, submitCreateTicket, and
      // more — none of which are Admin/SLA Settings actions) silently
      // rendered nothing at all unless state.view already happened to be
      // "settings" when the toast fired. Appending it here, unconditional
      // on view, is what actually makes every one of those call sites work.
      html += (state.toast ? '<div class="toast">' + I("checkCircle", 16) + escapeHtml(state.toast) + "</div>" : "");
      document.getElementById("app").innerHTML = html;
      shieldTextInputsFromOutsideKeyHandlers();
      var newModalBodies = document.querySelectorAll(".modal-body");
      for (var i = 0; i < newModalBodies.length && i < scrollSnapshots.length; i++) {
        newModalBodies[i].scrollTop = scrollSnapshots[i];
      }
      // Every action in this app funnels through render() — persisting here,
      // rather than in each individual action handler, guarantees tickets,
      // roster, category, and agency edits are saved to localStorage without
      // relying on remembering to add a persist call at every call site.
      persistTickets();
      persistRoster();
      persistCategories();
      persistAgencies();
    } catch (err) {
      console.error("Render failed:", err);
      document.getElementById("app").innerHTML =
        '<div style="padding:40px;color:var(--danger);font-family:' + "ui-monospace,monospace" + '">' +
        "Something went wrong rendering the dashboard (see console). Recovering…</div>";
      state.selectedId = null;
      state.createOpen = false;
      state.view = "board";
    }
  }

  // Stops every keyboard event on text inputs/textareas from bubbling past
  // the field itself. This is defensive against anything OUTSIDE this
  // script — a host page's own keyboard-shortcut listener, or a browser
  // extension (Vimium-style keyboard nav is a common culprit) — reacting to
  // a keystroke that was meant to go into a text field and closing/dismissing
  // something as a side effect. It does NOT touch the 'input' event our own
  // state logic listens for, so normal typing/state updates are unaffected.
  function shieldTextInputsFromOutsideKeyHandlers() {
    var fields = document.querySelectorAll("#app input[type=text], #app textarea");
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (el.__keyShieldAttached) continue;
      el.__keyShieldAttached = true;
      ["keydown", "keyup", "keypress"].forEach(function (evt) {
        el.addEventListener(evt, function (e) { e.stopPropagation(); });
      });
    }
  }

  // =====================================================================
  // EVENT HANDLING
  // =====================================================================
  function onClick(e) {
    var stopBoundary = e.target.closest("[data-stop-close]");
    var el = e.target.closest("[data-action]");
    // A click on a plain element inside the modal panel (the Title input, a
    // label, empty padding...) has no data-action of its own, so closest()
    // would otherwise keep walking UP PAST the panel and land on the outer
    // overlay's data-action="overlay-close-*" — closing the modal on any
    // click inside it that isn't itself a button. The panel boundary must
    // win: only accept a found data-action element if it's inside (or is)
    // the stop-close boundary, not an ancestor of it.
    if (stopBoundary && el && !stopBoundary.contains(el)) el = null;
    if (!el) {
      if (stopBoundary) return;
      if (e.target.closest(".modal-overlay")) {
        var overlay = e.target.closest(".modal-overlay");
        if (overlay.getAttribute("data-action") === "overlay-close-ticket") { state.selectedId = null; render(); }
        else if (overlay.getAttribute("data-action") === "overlay-close-create") { state.createOpen = false; render(); }
      }
      return;
    }
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if (action === "toggle-sidebar") { state.sidebarOpen = !state.sidebarOpen; render(); return; }
    if (action === "toggle-theme") { state.theme = state.theme === "dark" ? "light" : "dark"; applyTheme(state.theme); persistTheme(state.theme); render(); return; }
    if (action === "select-team") { state.team = el.getAttribute("data-team"); state.view = "board"; state.statusFilter = "All"; state.assigneeFilter = ""; render(); return; }
    if (action === "open-settings") { state.view = "settings"; render(); return; }
    if (action === "open-analytics") { state.view = "analytics"; render(); return; }
    if (action === "analytics-team-filter") { state.analyticsTeamFilter = el.getAttribute("data-team"); render(); return; }
    if (action === "analytics-date-filter") { state.analyticsDateFilter = el.getAttribute("data-range"); render(); return; }
    if (action === "export-analytics-summary") {
      if (!lastAnalyticsSnapshot) return;
      // Mirrors exportBackup()'s try/catch + toast pattern below — a silent
      // download with no on-screen confirmation reads as "the button did
      // nothing" even when the file landed fine, and any Blob/anchor failure
      // here would otherwise fail silently with no visible error.
      try {
        var stamp = new Date(lastAnalyticsSnapshot.generatedAt).toISOString().slice(0, 10);
        var snapshotJson = JSON.stringify(lastAnalyticsSnapshot, null, 2);
        var blob = new Blob([snapshotJson], { type: "application/json" });
        var blobUrl = URL.createObjectURL(blob);
        var downloadLink = document.createElement("a");
        downloadLink.href = blobUrl;
        downloadLink.download = "cyberops-analytics-summary-" + stamp + ".json";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobUrl);
        showBackupToast("Analytics summary downloaded — cyberops-analytics-summary-" + stamp + ".json");
      } catch (err) {
        console.error("Analytics export failed:", err);
        showBackupToast("Export failed — see console for details.");
      }
      return;
    }
    if (action === "settings-nav") { state.settingsPanel = el.getAttribute("data-panel"); render(); return; }
    if (action === "toggle-overdue-only") { return; } // handled in change listener
    if (action === "open-create") { createForm = freshCreateForm(state.team); state.createOpen = true; render(); return; }
    if (action === "toggle-select-mode") {
      state.selectMode = !state.selectMode;
      if (!state.selectMode) state.selectedTicketIds = []; // leaving select mode always clears selections
      render(); return;
    }
    if (action === "delete-selected-tickets") {
      var idsToDelete = state.selectedTicketIds.slice();
      if (!idsToDelete.length) return;
      var confirmedBulkDelete = window.confirm(
        "Delete " + idsToDelete.length + " selected ticket" + (idsToDelete.length === 1 ? "" : "s") + "? This cannot be undone."
      );
      if (!confirmedBulkDelete) return;

      Promise.all(idsToDelete.map(function (ticketId) {
        return fetch(API_BASE_URL + "/tickets/" + encodeURIComponent(ticketId), { method: "DELETE" })
          .then(function (res) { return { id: ticketId, ok: res.ok }; })
          .catch(function () { return { id: ticketId, ok: false }; });
      })).then(function (results) {
        var deletedIds = results.filter(function (r) { return r.ok; }).map(function (r) { return r.id; });
        var failedIds = results.filter(function (r) { return !r.ok; }).map(function (r) { return r.id; });
        state.tickets = state.tickets.filter(function (t) { return deletedIds.indexOf(t.id) === -1; });
        deletedIds.forEach(function (deletedId) { delete lastSyncedTicketsById[deletedId]; });
        // Failures stay selected so the user can see what's left and retry —
        // a silent partial failure would otherwise look like "it all worked."
        state.selectedTicketIds = failedIds;
        if (failedIds.length) {
          console.error("Bulk delete failed for:", failedIds);
          showBackupToast("Deleted " + deletedIds.length + " ticket(s) — " + failedIds.length + " failed, see console.");
        }
        render();
      });
      return;
    }
    if (action === "open-ticket") { state.selectedId = id; state.historyExpanded = false; draftDetailsCache = {}; draftAssigneeCache = {}; draftCategoryCache = {}; commentDraftCache = { ticketId: null, text: "" }; editingCommentId = null; editingCommentDraft = null; render(); return; }
    if (action === "toggle-history") { state.historyExpanded = !state.historyExpanded; render(); return; }
    if (action === "close-ticket" || action === "overlay-close-ticket") { state.selectedId = null; render(); return; }

    if (action === "delete-ticket") {
      var ticketToDelete = findTicket(id);
      if (!ticketToDelete) return;
      var confirmedDelete = window.confirm(
        "Are you sure you want to delete this ticket?\n\n" + id + " — " + ticketToDelete.title + "\n\nThis can't be undone."
      );
      if (!confirmedDelete) return;

      fetch(API_BASE_URL + "/tickets/" + encodeURIComponent(id), { method: "DELETE" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          state.tickets = state.tickets.filter(function (t) { return t.id !== id; });
          delete lastSyncedTicketsById[id];
          state.selectedId = null;
          render();
        })
        .catch(function (err) {
          console.error("Could not delete ticket:", err);
          showBackupToast("Could not delete " + id + " — see console for details.");
        });
      return;
    }
    if (action === "close-create" || action === "overlay-close-create") { state.createOpen = false; createForm = null; render(); return; }
    if (action === "select-status") { state.statusFilter = el.getAttribute("data-status"); render(); return; }

    if (action === "pause-ticket") {
      var t1 = findTicket(id);
      if (t1 && !t1.isPaused) {
        var pausedAt = Date.now();
        var h1 = t1.history.concat([{ id: uid(), action: "Paused", time: pausedAt, note: "Paused by analyst" }]);
        updateTicket(id, { isPaused: true, pausedAt: pausedAt, history: h1 });
      }
      render(); return;
    }
    if (action === "resume-ticket") {
      var t2 = findTicket(id);
      if (t2 && t2.isPaused) {
        var resumedAt = Date.now();
        var pausedDuration = resumedAt - t2.pausedAt;
        var h2 = t2.history.concat([{ id: uid(), action: "Resumed", time: resumedAt, durationMs: pausedDuration, note: "SLA extended by " + Math.max(1, Math.round(pausedDuration / 60000)) + " min" }]);
        updateTicket(id, { isPaused: false, pausedAt: null, slaDate: t2.slaDate + pausedDuration, totalPausedMs: t2.totalPausedMs + pausedDuration, history: h2 });
      }
      render(); return;
    }
    if (action === "delete-pause-log") {
      deletePauseLog(id, el.getAttribute("data-entry"));
      render(); return;
    }
    if (action === "save-changes") {
      // One Save Changes button commits all three drafts together: Details/
      // Hunt Notes (read live from the textarea), and Assignee + Category
      // (from their draft caches, since a <select> doesn't need per-
      // keystroke draft tracking).
      var t = findTicket(id);
      if (!t) return;
      var ta = document.querySelector('[data-role="details-input"][data-id="' + id + '"]');
      var newDetails = ta ? ta.value.trim() : t.details;
      if (!newDetails) return; // Details/Hunt Notes can't be saved blank — the button is already disabled for this, this is the same defense-in-depth re-check other handlers in this file use
      var patch = {};
      patch.details = newDetails;
      patch.assignee = draftAssigneeCache[id] != null ? draftAssigneeCache[id] : (t.assignee || "");
      patch.category = draftCategoryCache[id] != null ? draftCategoryCache[id] : t.category;
      updateTicket(id, patch);
      delete draftDetailsCache[id];
      delete draftAssigneeCache[id];
      delete draftCategoryCache[id];
      render(); return;
    }
    if (action === "trigger-file") {
      var input = document.getElementById("file-input-" + id);
      if (input) input.click();
      return;
    }
    if (action === "delete-attachment") {
      var attId = el.getAttribute("data-attachment");
      var tAtt = findTicket(id);
      if (!tAtt) return;
      // Commits immediately (same as adding an attachment already does) —
      // no separate Save Changes step for attachments, so delete matches
      // that existing behavior rather than introducing a second, different
      // save flow just for removal. render() persists it to localStorage
      // automatically, same as every other ticket update.
      updateTicket(id, { attachments: (tAtt.attachments || []).filter(function (a) { return a.id !== attId; }) });
      render(); return;
    }
    if (action === "post-comment") {
      var ca = document.querySelector('[data-role="comment-input"][data-id="' + id + '"]');
      var text = ca ? ca.value.trim() : "";
      if (!text) return;
      commentDraftCache = { ticketId: id, text: "" };
      state.mentionQuery = null;
      render();

      // Posted through the dedicated comments endpoint (not the local-state +
      // full-array PUT every other ticket edit uses) so the server can run
      // @mention detection and fire the mention notification at creation
      // time — persistTickets()'s bulk PUT has no "this just happened" event
      // to hook a one-time side effect like that onto.
      fetch(API_BASE_URL + "/tickets/" + encodeURIComponent(id) + "/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ authorId: state.currentUserId, text: text })
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function (newComment) {
        var t3 = findTicket(id);
        if (!t3) return;
        updateTicket(id, { comments: (t3.comments || []).concat([newComment]) });
        // This ticket (comment included) is already exactly what the server
        // has — seed the persistTickets() diff baseline so the next
        // render-triggered PUT doesn't treat it as a pending change.
        var updated = findTicket(id);
        if (updated) lastSyncedTicketsById[id] = JSON.stringify(updated);
        render();
      }).catch(function (err) {
        console.error("Could not post comment:", err);
        showBackupToast("Could not post comment — see console for details.");
      });
      return;
    }
    if (action === "edit-comment-start") {
      var commentId = el.getAttribute("data-comment");
      var ticketForEdit = findTicket(id);
      var canEditCheck = ticketForEdit && (ticketForEdit.comments || []).some(function (c) {
        return c.id === commentId && (c.authorId === state.currentUserId || isSuperAdmin(state.currentUserId));
      });
      if (!canEditCheck) return; // not the author and not a superadmin — no-op
      editingCommentId = commentId;
      editingCommentDraft = null;
      render(); return;
    }
    if (action === "edit-comment-cancel") {
      editingCommentId = null;
      editingCommentDraft = null;
      render(); return;
    }
    if (action === "edit-comment-save") {
      var commentIdSave = el.getAttribute("data-comment");
      var ta2 = document.querySelector('[data-role="edit-comment-input"][data-id="' + id + '"][data-comment="' + commentIdSave + '"]');
      var newText = ta2 ? ta2.value.trim() : "";
      if (!newText) return; // don't allow saving a comment down to empty — use Delete instead
      var tSave = findTicket(id);
      if (!tSave) return;
      var comments2 = (tSave.comments || []).map(function (c) {
        if (c.id !== commentIdSave) return c;
        // Author or superadmin already gated this action from even being
        // clickable, but re-check here too since state could theoretically
        // change between render and click.
        var allowed = c.authorId === state.currentUserId || isSuperAdmin(state.currentUserId);
        if (!allowed) return c;
        var changed = newText !== c.text;
        var next = {};
        for (var k in c) next[k] = c[k];
        next.text = newText;
        if (changed) { next.edited = true; next.editedAt = Date.now(); }
        return next;
      });
      updateTicket(id, { comments: comments2 });
      editingCommentId = null;
      editingCommentDraft = null;
      render(); return;
    }
    if (action === "delete-comment") {
      var commentIdDelete = el.getAttribute("data-comment");
      var tDelete = findTicket(id);
      if (!tDelete) return;
      var target = (tDelete.comments || []).filter(function (c) { return c.id === commentIdDelete; })[0];
      if (!target) return;
      var canDelete = target.authorId === state.currentUserId || isSuperAdmin(state.currentUserId);
      if (!canDelete) return;
      updateTicket(id, { comments: (tDelete.comments || []).filter(function (c) { return c.id !== commentIdDelete; }) });
      if (editingCommentId === commentIdDelete) { editingCommentId = null; editingCommentDraft = null; }
      render(); return;
    }
    if (action === "export-backup") { exportBackup(); return; }
    if (action === "trigger-restore-file") {
      if (!isSuperAdmin(state.currentUserId)) { showBackupToast("🔒 Superadmin Restricted: Only primary system administrators can export or restore database snapshots."); return; }
      var restoreInput = document.getElementById("restore-file-input");
      if (restoreInput) restoreInput.click();
      return;
    }
    if (action === "roster-add-start") {
      addingUser = true;
      addUserDraft = { name: "", groupKey: "SOC", role: "L1", isAdmin: false };
      render(); return;
    }
    if (action === "roster-add-cancel") { addingUser = false; addUserDraft = null; render(); return; }
    if (action === "roster-add-save") {
      var nameEl = document.querySelector('[data-role="roster-add-name"]');
      var roleEl = document.querySelector('[data-role="roster-add-role"]');
      var newName = nameEl ? nameEl.value.trim() : "";
      if (!newName) return; // name is required — silently no-op, matching other forms in this app
      var newRole = (roleEl ? roleEl.value.trim() : "") || "L1";
      var slug = newName.toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/(^\.|\.$)/g, "");
      var newUser = { id: nextUserId(), name: newName, role: newRole, isAdmin: !!addUserDraft.isAdmin, email: slug + "@company.com" };
      groupArrayFor(addUserDraft.groupKey).push(newUser);
      addingUser = false;
      addUserDraft = null;
      render(); return;
    }
    if (action === "roster-edit-start") {
      var editId = el.getAttribute("data-user");
      var loc = findUserLocation(editId);
      if (!loc) return;
      editingUserId = editId;
      editingUserDraft = { name: loc.user.name, groupKey: loc.groupKey, role: loc.user.role, isAdmin: loc.user.isAdmin };
      render(); return;
    }
    if (action === "roster-cancel") { editingUserId = null; editingUserDraft = null; render(); return; }
    if (action === "roster-save") {
      var saveId = el.getAttribute("data-user");
      var saveLoc = findUserLocation(saveId);
      if (!saveLoc || !editingUserDraft) return;
      var nameEl2 = document.querySelector('[data-role="roster-edit-name"]');
      var roleEl2 = document.querySelector('[data-role="roster-edit-role"]');
      var editedName = (nameEl2 ? nameEl2.value.trim() : "") || saveLoc.user.name;
      var editedRole = (roleEl2 ? roleEl2.value.trim() : "") || saveLoc.user.role;
      var updatedUser = { id: saveId, name: editedName, role: editedRole, isAdmin: !!editingUserDraft.isAdmin, email: saveLoc.user.email };
      groupArrayFor(saveLoc.groupKey).splice(saveLoc.index, 1); // remove from wherever they currently live...
      groupArrayFor(editingUserDraft.groupKey).push(updatedUser); // ...and re-add wherever the draft says they now belong (same array if Team wasn't changed)
      editingUserId = null;
      editingUserDraft = null;
      render(); return;
    }
    if (action === "roster-delete") {
      var delId = el.getAttribute("data-user");
      var delLoc = findUserLocation(delId);
      if (!delLoc) return;
      groupArrayFor(delLoc.groupKey).splice(delLoc.index, 1);
      if (editingUserId === delId) { editingUserId = null; editingUserDraft = null; }
      // The active session can't be left pointing at a person who no longer
      // exists — fall back to whoever is now first in the roster.
      if (state.currentUserId === delId) {
        var remaining = getAllUsers();
        state.currentUserId = remaining.length ? remaining[0].id : "";
      }
      render(); return;
    }
    if (action === "category-add-start") { addingCategoryTeam = el.getAttribute("data-team"); render(); return; }
    if (action === "category-add-cancel") { addingCategoryTeam = null; render(); return; }
    if (action === "category-add-save") {
      var catAddTeam = el.getAttribute("data-team");
      var catAddEl = document.querySelector('[data-role="category-add-name"]');
      var catAddName = catAddEl ? catAddEl.value.trim() : "";
      if (!catAddName) return; // required — silently no-op, matching roster-add-save
      var dup = CATEGORIES[catAddTeam].some(function (c) { return c.toLowerCase() === catAddName.toLowerCase(); });
      if (!dup) CATEGORIES[catAddTeam].push(catAddName);
      addingCategoryTeam = null;
      render(); return;
    }
    if (action === "category-edit-start") {
      editingCategory = { team: el.getAttribute("data-team"), index: Number(el.getAttribute("data-index")) };
      render(); return;
    }
    if (action === "category-edit-cancel") { editingCategory = null; render(); return; }
    if (action === "category-edit-save") {
      var catEditTeam = el.getAttribute("data-team");
      var catEditIndex = Number(el.getAttribute("data-index"));
      var catEditEl = document.querySelector('[data-role="category-edit-name"]');
      var catRenamed = catEditEl ? catEditEl.value.trim() : "";
      // Renaming only ever changes the picklist entry itself — tickets store
      // their category as a plain string snapshot (same "frozen at creation"
      // philosophy as priorityConfig), so nothing already-saved is rewritten.
      if (catRenamed && CATEGORIES[catEditTeam][catEditIndex] != null) CATEGORIES[catEditTeam][catEditIndex] = catRenamed;
      editingCategory = null;
      render(); return;
    }
    if (action === "category-delete") {
      var catDelTeam = el.getAttribute("data-team");
      var catDelIndex = Number(el.getAttribute("data-index"));
      CATEGORIES[catDelTeam].splice(catDelIndex, 1);
      // editingCategory is index-based, and every index after the deleted
      // one just shifted down by one — without this, deleting an earlier
      // category while a later one is being edited leaves editingCategory
      // pointing at the WRONG (now-shifted) entry, so the edit box quietly
      // shows and would save over the wrong category.
      if (editingCategory && editingCategory.team === catDelTeam) {
        if (editingCategory.index === catDelIndex) editingCategory = null;
        else if (editingCategory.index > catDelIndex) editingCategory.index -= 1;
      }
      render(); return;
    }
    if (action === "create-set-team") { createForm.team = el.getAttribute("data-team"); createForm.category = CATEGORIES[createForm.team][0] || ""; createForm.assignee = ""; render(); return; }
    if (action === "submit-create") { submitCreateTicket(); return; }
    if (action === "settings-select-team") { state.slaActiveTeam = el.getAttribute("data-team"); render(); return; }
    if (action === "save-sla") {
      state.slaConfig = JSON.parse(JSON.stringify(state.slaDraft));
      var persisted = persistSlaConfig(state.slaConfig);
      // Existing tickets keep whatever SLA hours were frozen into them at
      // creation (ticket.priorityConfig) — this only affects new tickets
      // going forward, and only the display copy communicates that.
      state.toast = persisted
        ? "SLA configurations saved — " + TEAMS[state.slaActiveTeam] + " and all other teams updated. Existing tickets keep their original SLA."
        : "SLA configurations saved for this session only — browser storage is unavailable, so it won't survive a refresh.";
      render();
      setTimeout(function () { state.toast = null; render(); }, 3200);
      return;
    }
  }

  function deletePauseLog(ticketId, entryId) {
    var t = findTicket(ticketId);
    if (!t) return;
    var entry = t.history.filter(function (h) { return h.id === entryId; })[0];
    if (!entry) return;

    if (entry.action === "Resumed") {
      var duration = entry.durationMs || 0;
      var pairedPause = t.history.filter(function (h) { return h.action === "Paused" && h.time <= entry.time; }).sort(function (a, b) { return b.time - a.time; })[0];
      updateTicket(ticketId, {
        totalPausedMs: Math.max(0, t.totalPausedMs - duration),
        slaDate: t.slaDate - duration,
        history: t.history.filter(function (h) { return h.id !== entry.id && (!pairedPause || h.id !== pairedPause.id); })
      });
      return;
    }
    if (entry.action === "Paused") {
      var pairedResume = t.history.filter(function (h) { return h.action === "Resumed" && h.durationMs != null && h.time >= entry.time; }).sort(function (a, b) { return a.time - b.time; })[0];
      if (pairedResume) {
        var duration2 = pairedResume.durationMs || 0;
        updateTicket(ticketId, {
          totalPausedMs: Math.max(0, t.totalPausedMs - duration2),
          slaDate: t.slaDate - duration2,
          history: t.history.filter(function (h) { return h.id !== entry.id && h.id !== pairedResume.id; })
        });
        return;
      }
      if (t.isPaused && t.pausedAt === entry.time) {
        // This is the log entry for the CURRENTLY open, unresolved pause.
        // Deleting a log entry must only ever touch history (and, for a
        // completed pause/resume pair, the paused-time math) — it must
        // NEVER mutate the ticket's live state. So isPaused/pausedAt stay
        // exactly as they are; the ticket remains paused until the user
        // explicitly clicks Resume. There's no completed duration to
        // subtract yet either, since that's only computed on Resume.
        updateTicket(ticketId, { history: t.history.filter(function (h) { return h.id !== entry.id; }) });
      }
    }
  }

  function submitCreateTicket() {
    // Defensive end-to-end: a bad SLA lookup, a missing DOM node, or an
    // unassigned ("") assignee must never leave the modal stuck open with
    // no feedback — either the ticket is created, or we log why and still
    // recover the UI cleanly, exactly like the rest of the app's fallbacks.
    try {
      var titleEl = document.querySelector('[data-role="create-title"]');
      var detailsEl = document.querySelector('[data-role="create-details"]');
      var requestedByEl = document.querySelector('[data-role="create-requestedby"]');
      var title = titleEl ? titleEl.value.trim() : "";
      var details = detailsEl ? detailsEl.value.trim() : "";
      if (!title || !details) return;
      var f = createForm;
      if (!f) return;
      // Was `(f.team === "SOC" || f.team === "TI") ? f.team : "SOC"` — a
      // hardcoded two-team allowlist that coerced any 3rd team's value
      // (including a legitimately-selected "NSOC") down to "SOC" before the
      // ticket was ever created. TEAMS[f.team] membership check generalizes
      // this to whatever teams actually exist.
      var team = TEAMS[f.team] ? f.team : "SOC";

      // "" / null / undefined all mean Unassigned — normalized to "" so
      // every downstream check (`!assignee`) behaves identically.
      var assignee = f.assignee || "";

      // The ticket ID is assigned by the server (POST /tickets → nextTicketId()
      // against the live DB), never computed here from state.tickets. This
      // list can be stale relative to what other tabs/sessions have already
      // created, so a client-computed "next number" can collide with a real
      // existing ticket — and persistTickets()'s full-array PUT would then
      // silently delete-and-replace that ticket. See SOC-1002 incident.
      state.createOpen = false;
      createForm = null;
      render();

      fetch(API_BASE_URL + "/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          team: team,
          title: title,
          details: details,
          priority: f.priority,
          category: f.category,
          requestedBy: (requestedByEl ? requestedByEl.value.trim() : "") || "Unspecified",
          assignee: assignee
        })
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function (newTicket) {
        state.tickets = state.tickets.concat([newTicket]);
        state.team = newTicket.team;
        // This ticket is already exactly what the server has — seed the
        // persistTickets() diff baseline so the next render-triggered PUT
        // doesn't treat it as a pending change.
        lastSyncedTicketsById[newTicket.id] = JSON.stringify(newTicket);
        render();
      }).catch(function (err) {
        console.error("Could not create ticket on server:", err);
        // The modal already closed optimistically before this POST was even
        // sent — without this, a failed create leaves the analyst with zero
        // indication the ticket doesn't actually exist anywhere, unlike
        // every other failure path in this file (delete, comment, etc.),
        // which all surface a toast.
        showBackupToast("Could not create the ticket — see console for details.");
        render();
      });
    } catch (err) {
      console.error("handleCreateTicket failed:", err);
      // Still close the modal so a thrown error can never look like a frozen UI.
      state.createOpen = false;
      createForm = null;
      render();
    }
  }

  function onChange(e) {
    var el = e.target;
    var action = el.getAttribute("data-action");
    if (!action) return;
    if (action === "toggle-overdue-only") { state.showOverdueOnly = el.checked; render(); return; }
    if (action === "toggle-ticket-select") {
      var ticketId = el.getAttribute("data-id");
      var idx = state.selectedTicketIds.indexOf(ticketId);
      if (el.checked && idx === -1) state.selectedTicketIds.push(ticketId);
      else if (!el.checked && idx !== -1) state.selectedTicketIds.splice(idx, 1);
      render(); return;
    }
    if (action === "toggle-notif-pref") {
      var prefKey = el.getAttribute("data-pref");
      state.notificationPrefs[prefKey] = el.checked;
      persistSetting(prefKey, el.checked);
      render(); return;
    }
    if (action === "update-status-notify-mode") { state.statusChangeNotifyMode = el.value; persistSetting("statusChangeNotifyMode", el.value); render(); return; }
    if (action === "roster-add-team") { addUserDraft.groupKey = el.value; render(); return; }
    if (action === "roster-add-admin") { addUserDraft.isAdmin = el.checked; render(); return; }
    if (action === "roster-edit-team") { editingUserDraft.groupKey = el.value; render(); return; }
    if (action === "roster-edit-admin") { editingUserDraft.isAdmin = el.checked; render(); return; }
    if (action === "toggle-my-tickets") {
      state.onlyMyTickets = el.checked;
      if (el.checked) state.assigneeFilter = ""; // the checkbox is the single source of truth while it's on
      render(); return;
    }
    if (action === "filter-assignee") {
      // Picking a specific analyst always means "show that person's board,"
      // even if "Only My Tickets" was on — so it takes over the filter.
      state.assigneeFilter = el.value;
      state.onlyMyTickets = false;
      render(); return;
    }
    if (action === "assignee-select") {
      // A <select> change is a discrete action (not per-keystroke typing),
      // so a full render is safe here — it just re-shows the chosen value
      // via draftAssigneeCache and updates the Save Changes button/flag.
      draftAssigneeCache[el.getAttribute("data-id")] = el.value;
      render(); return;
    }
    if (action === "category-select") {
      // Same discrete-<select> pattern as assignee-select above.
      draftCategoryCache[el.getAttribute("data-id")] = el.value;
      render(); return;
    }
    if (action === "change-status") { changeStatus(el.getAttribute("data-id"), el.value); render(); return; }
    if (action === "create-set-priority") { createForm.priority = el.value; render(); return; }
    if (action === "create-set-category") { createForm.category = el.value; render(); return; }
    if (action === "create-set-assignee") { createForm.assignee = el.value; render(); return; }
    if (action === "update-hours") {
      var parsed = Math.max(0.25, Number(el.value) || 0);
      var team = el.getAttribute("data-team"), pr = el.getAttribute("data-priority");
      state.slaDraft[team][pr] = { hours: parsed, color: state.slaDraft[team][pr].color, label: state.slaDraft[team][pr].label };
      render(); return;
    }
    if (action === "file-selected") {
      var id = el.getAttribute("data-id");
      var files = Array.prototype.slice.call(el.files || []);
      if (files.length) {
        var t = findTicket(id);
        var atts = (t.attachments || []).concat(files.map(function (f) { return { id: uid(), name: f.name, size: f.size, addedAt: Date.now() }; }));
        updateTicket(id, { attachments: atts });
      }
      render(); return;
    }
    if (action === "restore-file-selected") {
      var restoreFile = el.files && el.files[0];
      el.value = ""; // allow re-selecting the same file again later
      if (!isSuperAdmin(state.currentUserId)) { showBackupToast("🔒 Superadmin Restricted: Only primary system administrators can export or restore database snapshots."); return; }
      if (restoreFile) restoreBackupFromFile(restoreFile);
      return;
    }
  }

  function changeStatus(ticketId, newStatus) {
    var t = findTicket(ticketId);
    if (!t) return;
    newStatus = normalizeStatus(newStatus);
    if (t.status === newStatus) return;
    var changedAt = Date.now();
    var resolved = newStatus === "Resolved";
    var isTerminal = TERMINAL_STATUSES.indexOf(newStatus) !== -1;
    var history = t.history.slice();
    var patch = { status: newStatus, dateTimeResolved: resolved ? changedAt : null };

    // The Status dropdown is reachable even on a paused ticket (only the
    // Pause/Resume buttons themselves are hidden once terminal) — closing a
    // still-paused ticket this way, bypassing Resume, must finalize the
    // pause exactly like clicking Resume would. Otherwise isPaused/pausedAt
    // are left stale, and reopening the ticket later (also allowed by this
    // same dropdown) computes the "frozen" countdown against a pausedAt from
    // whenever it happened to be force-closed, corrupting the SLA math.
    if (isTerminal && t.isPaused && t.pausedAt) {
      var pausedDuration = changedAt - t.pausedAt;
      history.push({
        id: uid(),
        action: "Resumed",
        time: changedAt,
        durationMs: pausedDuration,
        note: "Auto-resumed — SLA extended by " + Math.max(1, Math.round(pausedDuration / 60000)) + " min (ticket closed while paused)"
      });
      patch.isPaused = false;
      patch.pausedAt = null;
      patch.slaDate = t.slaDate + pausedDuration;
      patch.totalPausedMs = t.totalPausedMs + pausedDuration;
    }

    history.push({
      id: uid(),
      action: resolved ? "Resolved" : "Status Changed",
      time: changedAt,
      note: resolved ? "Marked Resolved (was " + t.status + ")" : (t.status + " → " + newStatus)
    });
    patch.history = history;
    updateTicket(ticketId, patch);
  }

  // ---------- lightweight input handlers (no full re-render, preserves focus) ----------
  function onInput(e) {
    var el = e.target;
    var role = el.getAttribute("data-role");
    if (role === "details-input") {
      var id = el.getAttribute("data-id");
      draftDetailsCache[id] = el.value;
      var t = findTicket(id);
      var saveBtn = document.querySelector('[data-action="save-changes"][data-id="' + id + '"]');
      var assigneeDraftNow = draftAssigneeCache[id] != null ? draftAssigneeCache[id] : (t.assignee || "");
      var categoryDraftNow = draftCategoryCache[id] != null ? draftCategoryCache[id] : t.category;
      var dirty = (el.value !== t.details) || (assigneeDraftNow !== (t.assignee || "")) || (categoryDraftNow !== t.category);
      var detailsValid = el.value.trim().length > 0;
      if (saveBtn) saveBtn.disabled = !(dirty && detailsValid);
      var row = el.previousElementSibling;
      if (row && row.classList.contains("section-label-row")) {
        var existingFlag = row.querySelector("span:not(.section-label)");
        if (dirty && !existingFlag) {
          var span = document.createElement("span");
          span.style.fontSize = "10px"; span.style.color = "var(--warning)"; span.textContent = "Unsaved changes";
          row.appendChild(span);
        } else if (!dirty && existingFlag) {
          existingFlag.remove();
        }
      }
      return;
    }
    if (role === "comment-input") {
      var ticketId = el.getAttribute("data-id");
      commentDraftCache = { ticketId: ticketId, text: el.value };
      var postBtn = document.querySelector('[data-action="post-comment"][data-id="' + ticketId + '"]');
      if (postBtn) postBtn.disabled = !el.value.trim();

      var cursorPos = el.selectionStart;
      var upToCursor = el.value.slice(0, cursorPos);
      var match = upToCursor.match(/@([A-Za-z]*)$/);
      var dropdown = el.parentElement.querySelector('[data-role="mention-dropdown"]');
      if (match && dropdown) {
        var q = match[1].toLowerCase();
        var suggestions = getAllUsers().filter(function (u) { return u.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
        if (suggestions.length) {
          dropdown.className = "mention-dropdown";
          dropdown.innerHTML = suggestions.map(function (u) {
            return '<button type="button" class="mention-option" data-mention-user="' + u.id + '" data-ticket="' + ticketId + '">' + avatarHtml(u.name) + escapeHtml(u.name) + "</button>";
          }).join("");
        } else { dropdown.className = ""; dropdown.innerHTML = ""; }
      } else if (dropdown) { dropdown.className = ""; dropdown.innerHTML = ""; }
      return;
    }
    if (role === "edit-comment-input") { editingCommentDraft = el.value; return; }
    if (role === "roster-edit-name") { if (editingUserDraft) editingUserDraft.name = el.value; return; }
    if (role === "roster-edit-role") { if (editingUserDraft) editingUserDraft.role = el.value; return; }
    if (role === "roster-add-name") { if (addUserDraft) addUserDraft.name = el.value; return; }
    if (role === "roster-add-role") { if (addUserDraft) addUserDraft.role = el.value; return; }
    if (role === "create-title") { createForm.title = el.value; syncCreateSubmitState(); return; }
    if (role === "create-details") { createForm.details = el.value; syncCreateSubmitState(); return; }
    if (role === "create-requestedby") { createForm.requestedBy = el.value; return; }
  }
  function syncCreateSubmitState() {
    var btn = document.querySelector('[data-action="submit-create"]');
    if (btn) btn.disabled = !(createForm.title.trim() && createForm.details.trim());
  }

  document.addEventListener("click", function (e) {
    var mentionBtn = e.target.closest("[data-mention-user]");
    if (mentionBtn) {
      var user = getAllUsers().filter(function (u) { return u.id === mentionBtn.getAttribute("data-mention-user"); })[0];
      var ticketId = mentionBtn.getAttribute("data-ticket");
      var ta = document.querySelector('[data-role="comment-input"][data-id="' + ticketId + '"]');
      if (ta && user) {
        var cursorPos = ta.selectionStart;
        var before = ta.value.slice(0, cursorPos).replace(/@([A-Za-z]*)$/, "@" + user.name + " ");
        var after = ta.value.slice(cursorPos);
        ta.value = before + after;
        commentDraftCache = { ticketId: ticketId, text: ta.value };
        var dropdown = ta.parentElement.querySelector('[data-role="mention-dropdown"]');
        if (dropdown) { dropdown.className = ""; dropdown.innerHTML = ""; }
        var postBtn = document.querySelector('[data-action="post-comment"][data-id="' + ticketId + '"]');
        if (postBtn) postBtn.disabled = !ta.value.trim();
        ta.focus();
      }
      return;
    }
    onClick(e);
  });
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);

  // =====================================================================
  // LIVE TICKER — updates timers/clock every second WITHOUT a full render,
  // so an open textarea (details/comment) never loses focus or cursor.
  // =====================================================================
  setInterval(function () {
    state.now = Date.now();
    var clockEl = document.querySelector('[data-role="header-clock"]');
    if (clockEl) clockEl.textContent = "live · " + new Date(state.now).toLocaleTimeString();

    document.querySelectorAll('[data-role="card-timer"]').forEach(function (elx) {
      var t = findTicket(elx.getAttribute("data-ticket"));
      if (!t) return;
      var rem = remainingMs(t, state.now);
      var overdue = isOverdue(t, state.now);
      var textPart = elx.querySelector('[data-part="text"]');
      if (textPart) textPart.textContent = t.isPaused ? "frozen" : overdue ? "Overdue by " + formatOverdueBy(rem) : formatDuration(rem);
    });

    var modalTimer = document.querySelector('[data-role="modal-timer"]');
    if (modalTimer) {
      var t2 = findTicket(modalTimer.getAttribute("data-ticket"));
      if (t2) {
        var rem2 = remainingMs(t2, state.now);
        var overdue2 = isOverdue(t2, state.now);
        modalTimer.textContent = overdue2 ? formatDuration(Math.abs(rem2)) : formatDuration(rem2);
        var note = document.querySelector('[data-role="modal-overdue-note"]');
        if (note && overdue2) note.textContent = "Overdue by " + formatOverdueBy(rem2) + " past the SLA window";
        var track = document.querySelector('[data-role="modal-track"]');
        if (track) {
          // Same fix as ticketModalHtml()'s totalSlaMs — no "+ t2.totalPausedMs",
          // slaDate already has every past pause baked in.
          var totalSlaMs = t2.slaDate - t2.createdAt;
          var pct = Math.max(0, Math.min(100, (rem2 / totalSlaMs) * 100));
          track.style.width = Math.max(pct, 2) + "%";
        }
      }
    }
  }, 1000);

  // =====================================================================
  // BOOTSTRAP
  // =====================================================================
  render();
})();
</script>
