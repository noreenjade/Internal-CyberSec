  function deletePauseLog(ticketId, entryId) {
    var t = findTicket(ticketId);
    if (!t) return;
    var entry = t.history.filter(function (h) { return h.id === entryId; })[0];
    if (!entry) return;

    if (entry.action === "Resumed") {
      var duration = entry.durationMs || 0;
      var pairedPause = t.history.filter(function (h) { return h.action === "Paused" && h.time <= entry.time; }).sort(function (a, b) { return b.time - a.time; })[0];
      updateTicket(ticketId, {
        totalPausedMs: Math.max(0, t.totalPausedMs - duration),
        slaDate: t.slaDate - duration,
        history: t.history.filter(function (h) { return h.id !== entry.id && (!pairedPause || h.id !== pairedPause.id); })
      });
      return;
    }
    if (entry.action === "Paused") {
      var pairedResume = t.history.filter(function (h) { return h.action === "Resumed" && h.durationMs != null && h.time >= entry.time; }).sort(function (a, b) { return a.time - b.time; })[0];
      if (pairedResume) {
        var duration2 = pairedResume.durationMs || 0;
        updateTicket(ticketId, {
          totalPausedMs: Math.max(0, t.totalPausedMs - duration2),
          slaDate: t.slaDate - duration2,
          history: t.history.filter(function (h) { return h.id !== entry.id && h.id !== pairedResume.id; })
        });
        return;
      }
      if (t.isPaused && t.pausedAt === entry.time) {
        // This is the log entry for the CURRENTLY open, unresolved pause.
        // Deleting a log entry must only ever touch history (and, for a
        // completed pause/resume pair, the paused-time math) — it must
        // NEVER mutate the ticket's live state. So isPaused/pausedAt stay
        // exactly as they are; the ticket remains paused until the user
        // explicitly clicks Resume. There's no completed duration to
        // subtract yet either, since that's only computed on Resume.
        updateTicket(ticketId, { history: t.history.filter(function (h) { return h.id !== entry.id; }) });
      }
    }
  }

  function submitCreateTicket() {
    // Defensive end-to-end: a bad SLA lookup, a missing DOM node, or an
    // unassigned ("") assignee must never leave the modal stuck open with
    // no feedback — either the ticket is created, or we log why and still
    // recover the UI cleanly, exactly like the rest of the app's fallbacks.
    try {
      var titleEl = document.querySelector('[data-role="create-title"]');
      var detailsEl = document.querySelector('[data-role="create-details"]');
      var requestedByEl = document.querySelector('[data-role="create-requestedby"]');
      var title = titleEl ? titleEl.value.trim() : "";
      var details = detailsEl ? detailsEl.value.trim() : "";
      if (!title || !details) return;
      var f = createForm;
      if (!f) return;
      // Was `(f.team === "SOC" || f.team === "TI") ? f.team : "SOC"` — a
      // hardcoded two-team allowlist that coerced any 3rd team's value
      // (including a legitimately-selected "NSOC") down to "SOC" before the
      // ticket was ever created. TEAMS[f.team] membership check generalizes
      // this to whatever teams actually exist.
      var team = TEAMS[f.team] ? f.team : "SOC";

      // "" / null / undefined all mean Unassigned — normalized to "" so
      // every downstream check (`!assignee`) behaves identically.
      var assignee = f.assignee || "";

      // The ticket ID is assigned by the server (POST /tickets → nextTicketId()
      // against the live DB), never computed here from state.tickets. This
      // list can be stale relative to what other tabs/sessions have already
      // created, so a client-computed "next number" can collide with a real
      // existing ticket — and persistTickets()'s full-array PUT would then
      // silently delete-and-replace that ticket. See SOC-1002 incident.
      state.createOpen = false;
      createForm = null;
      render();

      fetch(API_BASE_URL + "/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          team: team,
          title: title,
          details: details,
          priority: f.priority,
          category: f.category,
          requestedBy: (requestedByEl ? requestedByEl.value.trim() : "") || "Unspecified",
          assignee: assignee,
          client: f.client || DEFAULT_CLIENT,
          agency: f.client === "NSOC" ? (f.agency || "") : ""
        })
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      }).then(function (newTicket) {
        state.tickets = state.tickets.concat([newTicket]);
        state.team = newTicket.team;
        // This ticket is already exactly what the server has — seed the
        // persistTickets() diff baseline so the next render-triggered PUT
        // doesn't treat it as a pending change.
        lastSyncedTicketsById[newTicket.id] = JSON.stringify(newTicket);
        render();
      }).catch(function (err) {
        console.error("Could not create ticket on server:", err);
        // The modal already closed optimistically before this POST was even
        // sent — without this, a failed create leaves the analyst with zero
        // indication the ticket doesn't actually exist anywhere, unlike
        // every other failure path in this file (delete, comment, etc.),
        // which all surface a toast.
        showBackupToast("Could not create the ticket — see console for details.");
        render();
      });
    } catch (err) {
      console.error("handleCreateTicket failed:", err);
      // Still close the modal so a thrown error can never look like a frozen UI.
      state.createOpen = false;
      createForm = null;
      render();
    }
  }

  function onChange(e) {
    var el = e.target;
    var action = el.getAttribute("data-action");
    if (!action) return;
    if (action === "toggle-overdue-only") { state.showOverdueOnly = el.checked; render(); return; }
    if (action === "toggle-ticket-select") {
      var ticketId = el.getAttribute("data-id");
      var idx = state.selectedTicketIds.indexOf(ticketId);
      if (el.checked && idx === -1) state.selectedTicketIds.push(ticketId);
      else if (!el.checked && idx !== -1) state.selectedTicketIds.splice(idx, 1);
      render(); return;
    }
    if (action === "toggle-select-all") {
      // Gated the same as the rest of bulk-select — see toggle-select-mode.
      // Selects/deselects every ticket CURRENTLY VISIBLE on the board (same
      // filteredTeamTickets() + status-filter set the board itself renders),
      // not every ticket globally, so "Select All" always matches what's on
      // screen rather than silently reaching into other filtered-out teams/statuses.
      if (!hasDeleteAccess(state.currentUserId)) { render(); return; }
      var visibleForSelectAll = filteredTeamTickets();
      if (state.statusFilter !== "All") visibleForSelectAll = visibleForSelectAll.filter(function (t) { return t.status === state.statusFilter; });
      if (el.checked) {
        visibleForSelectAll.forEach(function (t) {
          if (state.selectedTicketIds.indexOf(t.id) === -1) state.selectedTicketIds.push(t.id);
        });
      } else {
        var visibleIds = visibleForSelectAll.map(function (t) { return t.id; });
        state.selectedTicketIds = state.selectedTicketIds.filter(function (id2) { return visibleIds.indexOf(id2) === -1; });
      }
      render(); return;
    }
    if (action === "toggle-notif-pref") {
      var prefKey = el.getAttribute("data-pref");
      state.notificationPrefs[prefKey] = el.checked;
      persistSetting(prefKey, el.checked);
      render(); return;
    }
    if (action === "update-status-notify-mode") { state.statusChangeNotifyMode = el.value; persistSetting("statusChangeNotifyMode", el.value); render(); return; }
    if (action === "roster-add-team") { addUserDraft.groupKey = el.value; render(); return; }
    if (action === "roster-add-admin") { addUserDraft.isAdmin = el.checked; render(); return; }
    if (action === "roster-add-can-delete") { addUserDraft.canDeleteTickets = el.checked; render(); return; }
    if (action === "roster-edit-team") { editingUserDraft.groupKey = el.value; render(); return; }
    if (action === "roster-edit-admin") { editingUserDraft.isAdmin = el.checked; render(); return; }
    if (action === "roster-edit-can-delete") { editingUserDraft.canDeleteTickets = el.checked; render(); return; }
    if (action === "toggle-my-tickets") {
      state.onlyMyTickets = el.checked;
      if (el.checked) state.assigneeFilter = ""; // the checkbox is the single source of truth while it's on
      render(); return;
    }
    if (action === "filter-assignee") {
      // Picking a specific analyst always means "show that person's board,"
      // even if "Only My Tickets" was on — so it takes over the filter.
      state.assigneeFilter = el.value;
      state.onlyMyTickets = false;
      render(); return;
    }
    if (action === "filter-client") {
      state.clientFilter = el.value;
      if (el.value !== "NSOC") { state.agencyFilter = ""; state.agencyFilterQuery = ""; }
      render(); return;
    }
    if (action === "sort-order") { state.sortOrder = el.value; render(); return; }
    if (action === "agency-page-size") {
      agencyPageSize = Number(el.value) || 10;
      // Rows-per-page is shared across every client's agency list, so
      // resetting all pages to 0 avoids a stale page index leaving one
      // client's list stranded past its new (shorter) page count.
      agencyPage = {};
      render(); return;
    }
    if (action === "filter-specific-date") { state.specificDateFilter = el.value; render(); return; }
    if (action === "assignee-select") {
      // A <select> change is a discrete action (not per-keystroke typing),
      // so a full render is safe here — it just re-shows the chosen value
      // via draftAssigneeCache and updates the Save Changes button/flag.
      draftAssigneeCache[el.getAttribute("data-id")] = el.value;
      render(); return;
    }
    if (action === "category-select") {
      // Same discrete-<select> pattern as assignee-select above.
      draftCategoryCache[el.getAttribute("data-id")] = el.value;
      render(); return;
    }
    if (action === "client-select") {
      var clientSelectId = el.getAttribute("data-id");
      draftClientCache[clientSelectId] = el.value;
      if (el.value !== "NSOC") { delete draftAgencyCache[clientSelectId]; delete draftAgencyQueryCache[clientSelectId]; }
      render(); return;
    }
    if (action === "change-status") {
      var newStatusVal = el.value;
      var statusSelectId = el.getAttribute("data-id");
      if (newStatusVal === "Rejected" || newStatusVal === "Canceled" || newStatusVal === "Resolved") {
        // Opens the in-theme reject/cancel-reason modal instead of changing
        // status right away — changeStatus() only runs once the modal's
        // action button is actually clicked (see submit-reject below). The
        // <select> itself isn't touched yet, so cancelling out of that modal
        // needs no special revert: a plain render() just redraws it from
        // t.status, which never changed. Any pending New/In Progress draft
        // is discarded — picking a terminal status supersedes it, and this
        // modal's own Submit is already an explicit confirm step.
        delete draftStatusCache[statusSelectId];
        rejectPrompt = { ticketId: statusSelectId, status: newStatusVal, text: "" };
        render();
        return;
      }
      // New/In Progress no longer commit immediately — held as a draft like
      // Assignee/Category/Client, only applied once Save Changes is clicked
      // (see "save-changes" below), so every status change always goes
      // through an explicit save/confirm step.
      draftStatusCache[statusSelectId] = newStatusVal;
      render();
      return;
    }
    if (action === "create-set-priority") { createForm.priority = el.value; render(); return; }
    if (action === "create-set-category") { createForm.category = el.value; render(); return; }
    if (action === "create-set-assignee") { createForm.assignee = el.value; render(); return; }
    if (action === "create-set-client") {
      createForm.client = el.value;
      if (createForm.client !== "NSOC") { createForm.agency = ""; createForm.agencyQuery = ""; }
      render();
      return;
    }
    if (action === "update-hours") {
      var parsed = Math.max(0.01, Number(el.value) || 0);
      var team = el.getAttribute("data-team"), pr = el.getAttribute("data-priority");
      state.slaDraft[team][pr] = { hours: parsed, color: state.slaDraft[team][pr].color, label: state.slaDraft[team][pr].label };
      render(); return;
    }
    if (action === "file-selected") {
      var id = el.getAttribute("data-id");
      var files = Array.prototype.slice.call(el.files || []);
      el.value = ""; // allow re-selecting the exact same file again later
      if (!files.length) return;
      var oversizedImages = files.filter(function (f) { return f.type.indexOf("image/") === 0 && f.size > MAX_IMAGE_ATTACHMENT_BYTES; });
      if (oversizedImages.length) {
        alert("Skipped (screenshots must be under 5MB): " + oversizedImages.map(function (f) { return f.name; }).join(", "));
      }
      var usableFiles = files.filter(function (f) { return oversizedImages.indexOf(f) === -1; });
      if (!usableFiles.length) return;
      // Images get their actual bytes read (as a base64 data URI) so they
      // can be viewed later — every other accepted type stays metadata-only,
      // same as before this feature. FileReader is async, so all files are
      // read in parallel and the ticket is only updated/rendered once every
      // one has resolved, to avoid clobbering each other's writes.
      Promise.all(usableFiles.map(function (f) {
        if (f.type.indexOf("image/") !== 0) {
          return Promise.resolve({ id: uid(), name: f.name, size: f.size, addedAt: Date.now() });
        }
        return new Promise(function (resolve) {
          var reader = new FileReader();
          reader.onload = function (ev) { resolve({ id: uid(), name: f.name, size: f.size, addedAt: Date.now(), dataUrl: ev.target.result }); };
          reader.readAsDataURL(f);
        });
      })).then(function (newAtts) {
        var t = findTicket(id);
        if (!t) return;
        updateTicket(id, { attachments: (t.attachments || []).concat(newAtts) });
        render();
      });
      return;
    }
    if (action === "restore-file-selected") {
      var restoreFile = el.files && el.files[0];
      el.value = ""; // allow re-selecting the same file again later
      if (!isSuperAdmin(state.currentUserId)) { showBackupToast("🔒 Superadmin Restricted: Only primary system administrators can export or restore database snapshots."); return; }
      if (restoreFile) restoreBackupFromFile(restoreFile);
      return;
    }
  }

  function changeStatus(ticketId, newStatus, rejectionReason) {
    var t = findTicket(ticketId);
    if (!t) return;
    newStatus = normalizeStatus(newStatus);
    if (t.status === newStatus) return;
    var changedAt = Date.now();
    var resolved = newStatus === "Resolved";
    // "Rejected", "Canceled", and "Resolved" all end a ticket's life one way
    // or another and all deserve a note on record for why/how — reusing the
    // one rejectionReason field/column for all three rather than adding
    // separate "cancellationReason"/"resolutionNotes" fields for what's the
    // same underlying "closing note" concept.
    var needsReason = newStatus === "Rejected" || newStatus === "Canceled" || resolved;
    var wasTerminal = TERMINAL_STATUSES.indexOf(t.status) !== -1;
    var isTerminal = TERMINAL_STATUSES.indexOf(newStatus) !== -1;
    var history = t.history.slice();
    var patch = { status: newStatus, dateTimeResolved: resolved ? changedAt : null, terminalSince: isTerminal ? changedAt : null };
    if (needsReason) patch.rejectionReason = rejectionReason || "";

    // The Status dropdown is reachable even on a paused ticket (only the
    // Pause/Resume buttons themselves are hidden once terminal) — closing a
    // still-paused ticket this way, bypassing Resume, must finalize the
    // pause exactly like clicking Resume would. Otherwise isPaused/pausedAt
    // are left stale, and reopening the ticket later (also allowed by this
    // same dropdown) computes the "frozen" countdown against a pausedAt from
    // whenever it happened to be force-closed, corrupting the SLA math.
    if (isTerminal && t.isPaused && t.pausedAt) {
      var pausedDuration = changedAt - t.pausedAt;
      history.push({
        id: uid(),
        action: "Resumed",
        time: changedAt,
        durationMs: pausedDuration,
        note: "Auto-resumed — SLA extended by " + Math.max(1, Math.round(pausedDuration / 60000)) + " min (ticket closed while paused)"
      });
      patch.isPaused = false;
      patch.pausedAt = null;
      patch.slaDate = t.slaDate + pausedDuration;
      patch.totalPausedMs = t.totalPausedMs + pausedDuration;
    }

    // A ticket sitting in a terminal status (Resolved/Rejected/Canceled)
    // shouldn't have that time count against its SLA if it's later reopened
    // — extend the deadline by however long it sat closed, the same way
    // Resume already extends slaDate by a paused duration. Skipped when the
    // clock never started (slaNotStarted) since there's no real deadline yet
    // to extend, and skipped for tickets that were already terminal before
    // this fix shipped (terminalSince is null for those — no retroactive
    // credit, same "frozen snapshot going forward" rule as SLA_GATE_CUTOVER).
    if (wasTerminal && !isTerminal && t.terminalSince != null && !slaNotStarted(t)) {
      var dwellMs = changedAt - t.terminalSince;
      history.push({
        id: uid(),
        action: "Reopened",
        time: changedAt,
        durationMs: dwellMs,
        note: "Reopened from " + t.status + " — SLA extended by " + Math.max(1, Math.round(dwellMs / 60000)) + " min (time spent closed doesn't count against the SLA)"
      });
      patch.slaDate = t.slaDate + dwellMs;
    }

    history.push({
      id: uid(),
      action: resolved ? "Resolved" : needsReason ? newStatus : "Status Changed",
      time: changedAt,
      note: resolved
        ? "Marked Resolved (was " + t.status + ") — " + (rejectionReason || "No resolution notes provided")
        : needsReason ? newStatus + " — " + (rejectionReason || "No reason provided") : (t.status + " → " + newStatus)
    });
    patch.history = history;
    updateTicket(ticketId, patch);
  }

  // ---------- lightweight input handlers (no full re-render, preserves focus) ----------
  function onInput(e) {
    var el = e.target;
    var role = el.getAttribute("data-role");
    if (el.classList && el.classList.contains("details-area")) autoGrowTextarea(el);
    if (role === "details-input") {
      var id = el.getAttribute("data-id");
      draftDetailsCache[id] = el.value;
      var t = findTicket(id);
      var saveBtn = document.querySelector('[data-action="save-changes"][data-id="' + id + '"]');
      var assigneeDraftNow = draftAssigneeCache[id] != null ? draftAssigneeCache[id] : (t.assignee || "");
      var categoryDraftNow = draftCategoryCache[id] != null ? draftCategoryCache[id] : t.category;
      var clientDraftNow = draftClientCache[id] != null ? draftClientCache[id] : (t.client || DEFAULT_CLIENT);
      var agencyDraftNow = draftAgencyCache[id] != null ? draftAgencyCache[id] : (t.agency || "");
      var statusDraftNow = draftStatusCache[id] != null ? draftStatusCache[id] : t.status;
      var dirty = (el.value !== t.details) || (assigneeDraftNow !== (t.assignee || "")) || (categoryDraftNow !== t.category) ||
        (clientDraftNow !== (t.client || DEFAULT_CLIENT)) || (clientDraftNow === "NSOC" && agencyDraftNow !== (t.agency || "")) ||
        (statusDraftNow !== t.status);
      var detailsValid = el.value.trim().length > 0;
      if (saveBtn) saveBtn.disabled = !(dirty && detailsValid);
      var row = el.previousElementSibling;
      if (row && row.classList.contains("section-label-row")) {
        var existingFlag = row.querySelector("span:not(.section-label)");
        if (dirty && !existingFlag) {
          var span = document.createElement("span");
          span.style.fontSize = "10px"; span.style.color = "var(--warning)"; span.textContent = "Unsaved changes";
          row.appendChild(span);
        } else if (!dirty && existingFlag) {
          existingFlag.remove();
        }
      }
      var linksBox = document.querySelector('[data-role="details-links"][data-id="' + id + '"]');
      if (linksBox) linksBox.innerHTML = detectedLinksHtml(el.value);
      return;
    }
    if (role === "comment-input") {
      var ticketId = el.getAttribute("data-id");
      commentDraftCache = { ticketId: ticketId, text: el.value };
      var postBtn = document.querySelector('[data-action="post-comment"][data-id="' + ticketId + '"]');
      if (postBtn) postBtn.disabled = !el.value.trim();

      var cursorPos = el.selectionStart;
      var upToCursor = el.value.slice(0, cursorPos);
      var match = upToCursor.match(/@([A-Za-z]*)$/);
      var dropdown = el.parentElement.querySelector('[data-role="mention-dropdown"]');
      if (match && dropdown) {
        var q = match[1].toLowerCase();
        var suggestions = getAllUsers().filter(function (u) { return u.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 6);
        if (suggestions.length) {
          dropdown.className = "mention-dropdown";
          dropdown.innerHTML = suggestions.map(function (u) {
            return '<button type="button" class="mention-option" data-mention-user="' + u.id + '" data-ticket="' + ticketId + '">' + avatarHtml(u.name) + escapeHtml(u.name) + "</button>";
          }).join("");
        } else { dropdown.className = ""; dropdown.innerHTML = ""; }
      } else if (dropdown) { dropdown.className = ""; dropdown.innerHTML = ""; }
      return;
    }
    if (role === "edit-comment-input") { editingCommentDraft = el.value; return; }
    if (role === "roster-edit-name") { if (editingUserDraft) editingUserDraft.name = el.value; return; }
    if (role === "roster-edit-role") { if (editingUserDraft) editingUserDraft.role = el.value; return; }
    if (role === "roster-edit-email") { if (editingUserDraft) editingUserDraft.email = el.value; return; }
    if (role === "roster-add-name") { if (addUserDraft) addUserDraft.name = el.value; return; }
    if (role === "roster-add-role") { if (addUserDraft) addUserDraft.role = el.value; return; }
    if (role === "roster-add-email") { if (addUserDraft) addUserDraft.email = el.value; return; }
    if (role === "create-title") { createForm.title = el.value; syncCreateSubmitState(); return; }
    if (role === "create-details") {
      createForm.details = el.value;
      syncCreateSubmitState();
      var createLinksBox = document.querySelector('[data-role="details-links"][data-id="create"]');
      if (createLinksBox) createLinksBox.innerHTML = detectedLinksHtml(el.value);
      return;
    }
    if (role === "create-requestedby") { createForm.requestedBy = el.value; return; }
    if (role === "agency-search-input") {
      var agencyScope = el.getAttribute("data-agency-scope");
      var agencyId = el.getAttribute("data-id") || "";
      if (agencyScope === "create") { createForm.agencyQuery = el.value; }
      else if (agencyScope === "edit") { draftAgencyQueryCache[agencyId] = el.value; }
      else if (agencyScope === "filter") { state.agencyFilterQuery = el.value; }
      populateAgencyDropdown(el);
      return;
    }
    if (role === "board-search-input") {
      state.searchQuery = el.value;
      // A full render() is needed (unlike the other lightweight text-input
      // roles above) since the whole point is the board re-filtering live as
      // you type — render() itself preserves this input's focus/cursor
      // position across the resulting rebuild (see the searchInputFocused
      // snapshot/restore in render()).
      render();
      return;
    }
    if (role === "reject-reason-input") {
      if (rejectPrompt) rejectPrompt.text = el.value;
      var rejectBtn = document.querySelector('[data-action="submit-reject"]');
      if (rejectBtn) rejectBtn.disabled = !el.value.trim();
      return;
    }
  }
  function syncCreateSubmitState() {
    var btn = document.querySelector('[data-action="submit-create"]');
    if (btn) btn.disabled = !(createForm.title.trim() && createForm.details.trim());
  }

  document.addEventListener("click", function (e) {
    var mentionBtn = e.target.closest("[data-mention-user]");
    if (mentionBtn) {
      var user = getAllUsers().filter(function (u) { return u.id === mentionBtn.getAttribute("data-mention-user"); })[0];
      var ticketId = mentionBtn.getAttribute("data-ticket");
      var ta = document.querySelector('[data-role="comment-input"][data-id="' + ticketId + '"]');
      if (ta && user) {
        var cursorPos = ta.selectionStart;
        var before = ta.value.slice(0, cursorPos).replace(/@([A-Za-z]*)$/, "@" + user.name + " ");
        var after = ta.value.slice(cursorPos);
        ta.value = before + after;
        commentDraftCache = { ticketId: ticketId, text: ta.value };
        var dropdown = ta.parentElement.querySelector('[data-role="mention-dropdown"]');
        if (dropdown) { dropdown.className = ""; dropdown.innerHTML = ""; }
        var postBtn = document.querySelector('[data-action="post-comment"][data-id="' + ticketId + '"]');
        if (postBtn) postBtn.disabled = !ta.value.trim();
        ta.focus();
      }
      return;
    }
    var agencyOpt = e.target.closest("[data-agency-option]");
    if (agencyOpt) {
      applyAgencySelection(
        agencyOpt.getAttribute("data-agency-scope"),
        agencyOpt.getAttribute("data-id") || "",
        agencyOpt.getAttribute("data-agency-option")
      );
      return;
    }
    var agencyAddBtn = e.target.closest("[data-agency-add]");
    if (agencyAddBtn) {
      applyAgencyAddNew(
        agencyAddBtn.getAttribute("data-agency-scope"),
        agencyAddBtn.getAttribute("data-id") || "",
        agencyAddBtn.getAttribute("data-agency-add")
      );
      return;
    }
    // Outside-click cleanup for any open Agency dropdown — there's no
    // focusout-based close (see the comment on applyAgencySelection above),
    // so a click that lands neither on an option nor inside the combobox
    // itself just closes whatever's open.
    document.querySelectorAll(".agency-dropdown").forEach(function (dd) {
      var box = dd.closest(".mention-box");
      if (box && !box.contains(e.target)) { dd.className = ""; dd.innerHTML = ""; }
    });
    onClick(e);
  });
  document.addEventListener("focusin", function (e) {
    var el = e.target;
    if (el.matches && el.matches('[data-role="agency-search-input"]')) populateAgencyDropdown(el);
  });
  document.addEventListener("focusout", function (e) {
    var el = e.target;
    if (!el.matches || !el.matches('[data-role="agency-search-input"]')) return;
    // Revert the displayed text to the last committed value if the user
    // typed something and clicked/tabbed away without selecting an option —
    // doesn't touch the dropdown itself (see the outside-click cleanup
    // above), so there's no race with a click on an option that's still
    // mid-flight when this fires.
    var scope = el.getAttribute("data-agency-scope");
    var id = el.getAttribute("data-id") || "";
    var committed = scope === "create" ? (createForm ? createForm.agency : "")
      : scope === "edit" ? (draftAgencyCache[id] || "")
      : (state.agencyFilterQuery || "");
    if (el.value !== committed) el.value = committed;
  });
  document.addEventListener("change", onChange);
  document.addEventListener("input", onInput);

  // Paste-to-attach: pasting a screenshot directly into the Details textarea
  // (existing ticket) or the Reject/Cancel/Resolve reason textarea attaches
  // it to that ticket immediately, the same way "Click to attach files"
  // does — no separate upload step. Text pastes are left completely alone
  // (only intercepted when the clipboard actually contains image data).
  document.addEventListener("paste", function (e) {
    var el = e.target;
    var isDetails = el.matches && el.matches('[data-role="details-input"]');
    var isRejectReason = el.matches && el.matches('[data-role="reject-reason-input"]');
    if (!isDetails && !isRejectReason) return;
    var clipboard = e.clipboardData || window.clipboardData;
    var items = clipboard ? clipboard.items : null;
    if (!items) return;
    var imageItem = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].type && items[i].type.indexOf("image/") === 0) { imageItem = items[i]; break; }
    }
    if (!imageItem) return; // no image in the clipboard — let normal text paste happen
    var file = imageItem.getAsFile();
    if (!file) return;
    e.preventDefault();
    if (file.size > MAX_IMAGE_ATTACHMENT_BYTES) { alert("Screenshot too large (max 5MB)."); return; }
    var ticketId = isDetails ? el.getAttribute("data-id") : (rejectPrompt ? rejectPrompt.ticketId : null);
    if (!ticketId) return;
    var reader = new FileReader();
    reader.onload = function (ev) {
      var t = findTicket(ticketId);
      if (!t) return;
      var newAttachment = { id: uid(), name: "Pasted screenshot " + formatClock(Date.now()), size: file.size, addedAt: Date.now(), dataUrl: ev.target.result };
      updateTicket(ticketId, { attachments: (t.attachments || []).concat([newAttachment]) });
      showBackupToast("📎 Screenshot attached to " + ticketId);
    };
    reader.readAsDataURL(file);
  });

  // Ticket card hover-to-preview — mouseover/mouseout (which bubble, unlike
  // mouseenter/mouseleave) delegated from document, filtered on relatedTarget
  // so moving between child elements within the same card (badges, footer,
  // etc.) doesn't flicker the tooltip closed and immediately reopen it; only
  // a transition across the card's own boundary shows/hides it. Purely
  // additive to open-ticket's click handling — nothing here calls
  // preventDefault/stopPropagation, so clicking the card still opens it.
  //
  // The tooltip itself is a hover target too (not just the card) — a long
  // Details/Hunt Notes section scrolls internally and its links are
  // clickable (see .ticket-tooltip-details), which needs the mouse to
  // actually be able to travel from the card onto the tooltip. But the
  // tooltip is positioned NEXT TO the card, not touching it pixel-for-pixel
  // (there's a small margin gap so it doesn't look glued on) — the instant
  // the mouse leaves the card, relatedTarget is that gap (or another card,
  // or empty board space), not the tooltip, so an immediate hide-on-mouseout
  // closes it before the cursor ever finishes crossing to reach it. The fix
  // is a short grace period: schedule the hide instead of firing it right
  // away, and cancel that timer if the mouse lands on the card or tooltip
  // again within the window — same "hover intent" delay pattern used
  // elsewhere in this file (the agency dropdown, the old card preview).
  var currentTooltipCard = null;
  var tooltipHideTimer = null;
  function cancelTooltipHide() {
    if (tooltipHideTimer) { clearTimeout(tooltipHideTimer); tooltipHideTimer = null; }
  }
  function scheduleTooltipHide() {
    cancelTooltipHide();
    tooltipHideTimer = setTimeout(function () {
      tooltipHideTimer = null;
      currentTooltipCard = null;
      hideTicketTooltip();
    }, 250);
  }
  document.addEventListener("mouseover", function (e) {
    var tip = document.getElementById("ticket-tooltip");
    if (tip && (e.target === tip || tip.contains(e.target))) { cancelTooltipHide(); return; }
    var card = e.target.closest(".ticket-card");
    if (card && !card.contains(e.relatedTarget)) {
      cancelTooltipHide();
      currentTooltipCard = card;
      showTicketTooltip(card, card.getAttribute("data-id"));
    }
  });
  document.addEventListener("mouseout", function (e) {
    var card = e.target.closest(".ticket-card");
    var tip = document.getElementById("ticket-tooltip");
    var leavingCard = card && !card.contains(e.relatedTarget);
    var leavingTooltip = tip && (e.target === tip || tip.contains(e.target)) && !tip.contains(e.relatedTarget);
    if (!leavingCard && !leavingTooltip) return;
    var enteringTooltip = tip && (e.relatedTarget === tip || tip.contains(e.relatedTarget));
    var enteringOwnCard = currentTooltipCard && (e.relatedTarget === currentTooltipCard || currentTooltipCard.contains(e.relatedTarget));
    if (enteringTooltip || enteringOwnCard) return;
    scheduleTooltipHide();
  });
  // Scrolling (the board area, or the page) invalidates the tooltip's
  // position relative to the card it was anchored to — simplest correct fix
  // is just hiding it rather than trying to track the card's new position.
  // Capture phase so this also catches scrolling inside a nested container.
  window.addEventListener("scroll", hideTicketTooltip, true);

  // =====================================================================
  // LIVE TICKER — updates timers/clock every second WITHOUT a full render,
  // so an open textarea (details/comment) never loses focus or cursor.
  // =====================================================================
  setInterval(function () {
    state.now = Date.now();
    var clockEl = document.querySelector('[data-role="header-clock"]');
    if (clockEl) clockEl.textContent = "live · " + new Date(state.now).toLocaleTimeString();

    document.querySelectorAll('[data-role="card-timer"]').forEach(function (elx) {
      var t = findTicket(elx.getAttribute("data-ticket"));
      if (!t) return;
      var rem = remainingMs(t, state.now);
      var overdue = isOverdue(t, state.now);
      var textPart = elx.querySelector('[data-part="text"]');
      if (textPart) textPart.textContent = slaFrozen(t) ? "frozen" : overdue ? "Overdue by " + formatOverdueBy(rem) : formatDuration(rem);
    });

    var modalTimer = document.querySelector('[data-role="modal-timer"]');
    if (modalTimer) {
      var t2 = findTicket(modalTimer.getAttribute("data-ticket"));
      if (t2) {
        var rem2 = remainingMs(t2, state.now);
        var overdue2 = isOverdue(t2, state.now);
        modalTimer.textContent = overdue2 ? formatDuration(Math.abs(rem2)) : formatDuration(rem2);
        var note = document.querySelector('[data-role="modal-overdue-note"]');
        if (note && overdue2) note.textContent = "Overdue by " + formatOverdueBy(rem2) + " past the SLA window";
        var track = document.querySelector('[data-role="modal-track"]');
        if (track) {
          // Same fix as ticketModalHtml()'s totalSlaMs — no "+ t2.totalPausedMs",
          // slaDate already has every past pause baked in.
          var totalSlaMs = t2.slaDate - t2.createdAt;
          var pct = Math.max(0, Math.min(100, (rem2 / totalSlaMs) * 100));
          track.style.width = Math.max(pct, 2) + "%";
        }
      }
    }
  }, 1000);

  // =====================================================================
  // BOOTSTRAP
  // =====================================================================
  checkAuth();
  render();
})();
</script>
