     from-scratch hue would touch too much — every badge/shadow/glow below
     is token-driven) but are less saturated/more graphite; the two brand
     hues (accent, purple) are pulled back from "glowing neon" to a muted
     steel-teal / soft indigo; text-dimmer/text-faint are both raised a
     step for real readability instead of decorative fade. Cards (panel)
     still sit a shade darker than their surrounding column (panel-alt) on
     purpose, like an inlaid tile — a deliberate look, not an elevation
     mistake.
     Also supports a real light theme: the app defaults to dark (:root),
     and toggling calls document.documentElement.setAttribute('data-theme',
     'light'|'dark') to swap every token below via the two data-theme
     blocks further down. Structural chrome (backgrounds/borders/text/
     buttons) is 100% token-driven so it flips cleanly; the SLA priority
     badges (Critical/High/Medium/Low) are colored from ticket data
     (DEFAULT_SLA_CONFIG), not these tokens, and were left untouched per
     the "don't touch existing logic" rule — their self-blended
     background+text formula already reads fine on both light and dark
     grounds, so no change was needed there either. */
  :root {
    /* Palette v6: rebranded to match maroonstudios.com's own mark (a
       maroon/red-orange faceted "M" hexagon) instead of the prior
       steel-teal/indigo pairing. Neutrals moved from cool blue-slate to a
       warm charcoal-brown family so the brand's warm reds sit on a ground
       that actually agrees with them — a warm accent on a cool-blue
       neutral is exactly the "doesn't feel intentional" mismatch this pass
       fixes. --accent is the brand's brighter red-orange (the logo's top
       facet) since it needs to work as button/link/focus color, which the
       deeper maroon is too dark and low-contrast for on its own; --purple
       is repurposed (not renamed, to avoid touching every call site) to
       carry that deeper maroon (the logo's other facets) as the secondary/
       Threat-Hunt-differentiating hue — together they reproduce the logo's
       own two-tone red gradient rather than picking an arbitrary pairing.
       --danger is pushed rose/pink rather than orange-red specifically so
       it stays visually distinct from --accent now that accent itself
       lives in the red family — otherwise "this is the brand color" and
       "this is broken/overdue" would read as the same color. */
    /* v8: neutrals pulled back to genuinely neutral gray (barely any warm
       tint) instead of the fully warm-brown scale — the brand's red now
       carries 100% of the color identity via --accent/--purple alone,
       rather than also tinting every background/border/panel warm, which
       read as murkier than a plain "white/gray theme with a red accent"
       (closer to how the app looked before this reskin, minus the color). */
    /* v9: pulled the last of the warm brown/olive tint out of the
       neutrals — genuinely neutral gray now (R≈G≈B), not just lighter.
       The brand's red carries all the color; the neutrals just sit
       behind it, the way the light theme's neutrals already did. */
    --bg: #2a2a2a;
    --panel: #3c3c3c;
    --panel-soft: #1c1c1c;
    --panel-alt: #585858;
    --border: #757575;
    --border-soft: #585858;
    --text: #f2f2f2;
    --text-dim: #c8c8c8;
    --text-dimmer: #9f9f9f;
    --text-faint: #7c7c7c;
    /* v7: swapped which brand hue is "everywhere" vs. "occasional" — the
       vivid red-orange plastered across every button/tab/border read as
       fatiguing over real use ("sakit sa mata"), so the calmer, more
       muted maroon (the logo's other facet) is now --accent (the
       omnipresent one) and the red-orange moves to --purple, used only
       sparingly (Threat Hunt differentiation, a couple of gradients) —
       same two brand hues, just swapped which one you stare at all day. */
    --accent: #a8434a;
    --accent-strong: #c96259;
    --accent-soft: rgba(168, 67, 74, 0.14);
    --accent-glow: rgba(168, 67, 74, 0.18);
    --purple: #e2582f;
    --purple-soft: rgba(168, 67, 74, 0.13);
    --danger: #e6516b;
    --danger-soft: rgba(230, 81, 107, 0.14);
    --success: #3fb897;
    --success-soft: rgba(63, 184, 151, 0.14);
    --warning: #dba53f;
    --warning-soft: rgba(219, 165, 63, 0.14);
    --overlay-scrim: rgba(10, 6, 5, 0.72);
    --glass: rgba(24, 19, 15, 0.86);
    --font-sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
  }

  /* Light theme — a considered, non-inverted palette (not just "flip the
     dark one"): warm-neutral slate paper tones, and every accent darkened
     a step from its dark-mode value (e.g. cyan-400→cyan-700) since a hue
     tuned to pop on near-black reads as washed-out on a light ground.
     Given a second pass per direct feedback that it still read as too
     plain/washed-out: --bg carries a touch more blue-slate tint instead of
     a near-neutral gray, and the accent/purple hues are a step more
     saturated (still darkened enough for contrast on white, just less
     timid) — see the shadow-strength override further down too, since flat
     white-on-white shadows are a second, separate cause of the same
     "flat" read. */
  :root[data-theme="light"] {
    --bg: #f7f7f6;
    --panel: #ffffff;
    --panel-soft: #fbfbfa;
    --panel-alt: #eeeeec;
    --border: #dcdad7;
    --border-soft: #eeeeec;
    --text: #1e1c1a;
    --text-dim: #58534e;
    --text-dimmer: #79746e;
    --text-faint: #98938c;
    --accent: #7a2530;
    --accent-strong: #5c1c24;
    --accent-soft: rgba(122, 37, 48, 0.09);
    --accent-glow: rgba(122, 37, 48, 0.16);
    --purple: #c23f1f;
    --purple-soft: rgba(194, 63, 31, 0.1);
    --danger: #b93250;
    --danger-soft: rgba(185, 50, 80, 0.1);
    --success: #148066;
    --success-soft: rgba(20, 128, 102, 0.1);
    --warning: #96650f;
    --warning-soft: rgba(150, 101, 15, 0.1);
    --overlay-scrim: rgba(30, 15, 10, 0.4);
    --glass: rgba(255, 255, 255, 0.9);
  }

  /* Every box-shadow above (.ticket-card, .kpi-card, .analytics-card,
     .modal-panel, the tooltip) was tuned as a black shadow against a dark
     panel, where it reads clearly — the exact same rgba(0,0,0,0.1-ish)
     values go almost invisible on a white panel over a barely-darker-white
     page, which was the other half of light mode reading "flat." These
     don't touch color (still plain black, just stronger/wider) or dark
     mode at all — only the shadow depth, and only in light mode, restoring
     the same sense of elevation dark mode gets for free from its tonal
     contrast. */
  :root[data-theme="light"] .ticket-card { box-shadow: 0 1px 3px rgba(30,41,59,0.1), 0 1px 2px rgba(30,41,59,0.08); }
  :root[data-theme="light"] .ticket-card:hover { box-shadow: 0 0 0 1px var(--accent-soft), 0 14px 28px -14px rgba(30,41,59,0.22); }
  :root[data-theme="light"] .kpi-card { box-shadow: 0 1px 2px rgba(30,41,59,0.06), 0 12px 28px -20px rgba(30,41,59,0.18); }
  :root[data-theme="light"] .analytics-card { box-shadow: 0 1px 2px rgba(30,41,59,0.06), 0 12px 28px -20px rgba(30,41,59,0.18); }
  :root[data-theme="light"] .modal-panel { box-shadow: 0 30px 70px rgba(30,41,59,0.22), 0 0 0 1px rgba(30,41,59,0.05); }
  :root[data-theme="light"] .ticket-tooltip { box-shadow: 0 20px 48px rgba(30,41,59,0.2), 0 0 0 1px var(--accent-soft); }

  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  #app {
    font-family: var(--font-sans);
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    width: 100%;
    font-size: 14px;
    line-height: 1.45;
  }
  #app :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #app * { scrollbar-color: var(--border) transparent; scrollbar-width: thin; }
  #app *::-webkit-scrollbar { width: 10px; height: 10px; }
  #app *::-webkit-scrollbar-track { background: transparent; }
  #app *::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  #app *::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
  /* color:inherit is intentionally NOT here for button: an #app+type
     selector like "#app button" (specificity 1,0,1, an ID beats any number
     of classes) silently outranks every bare ".btn-primary/.icon-btn/
     .tab-btn/etc { color: ... }" rule in this file, which is exactly the
     bug the #app .btn-pause / #app .btn-resume comment below documents and
     works around — the difference is those two rules got the same
     specificity bump to win the fight, but nothing else did, so every
     other button's intended text color was silently discarded in favor of
     the inherited (near-white) --text color. select/input/textarea keep
     color:inherit — they aren't affected the same way since .field-input's
     own color already happens to equal the inherited --text. */
  #app select, #app input, #app textarea { font: inherit; color: inherit; }
  #app button { font: inherit; }
  #app button { cursor: pointer; }
  #app button:disabled { cursor: not-allowed; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---------- top bar ---------- */
  .topbar {
    border-bottom: 1px solid var(--border);
    background: var(--glass);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 24px;
  }
  .topbar-row { display: flex; align-items: center; gap: 12px; }
  .icon-btn {
    height: 32px; width: 32px; border-radius: var(--radius-sm);
    border: 1px solid var(--border-soft); background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-dim); transition: color .15s, border-color .15s; flex-shrink: 0;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .icon-btn.active { background: var(--accent-soft); border-color: rgba(168,67,74,0.4); color: var(--accent-strong); }
  /* Real MaroonStudios mark (embedded below as a data: URI in each call
     site) rather than the generic shield glyph — it's already a
     self-contained faceted hexagon with its own dark ground, so the badge
     itself stays borderless/transparent instead of wrapping it in a second
     colored box. */
  .brand-badge {
    height: 32px; width: 32px; border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .brand-badge img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .brand-text { min-width: 0; }
  .brand-title { font-size: 20px; font-weight: 800; letter-spacing: -.01em; color: var(--text); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand-sub { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dimmer); margin: 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .live-clock { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dimmer); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(168,67,74,.6); animation: pulse-dot 1.6s infinite; }
  @keyframes pulse-dot { 0% { box-shadow: 0 0 0 0 rgba(168,67,74,.55);} 70% { box-shadow: 0 0 0 7px rgba(168,67,74,0);} 100% { box-shadow: 0 0 0 0 rgba(168,67,74,0);} }
  .user-select-wrap { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-soft); background: var(--panel); border-radius: var(--radius-sm); padding: 6px 6px 6px 8px; }
  .current-user-name { font-size: 12px; color: var(--text); }
  .role-pill { font-size: 10px; font-family: var(--font-mono); padding: 2px 6px; border-radius: 4px; background: var(--panel-alt); color: var(--text-dim); }

  /* ---------- team tabs ---------- */
  .tabs-row { padding: 18px 24px 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tab-btn {
    /* --text-dim, not --text-dimmer — at the same font-weight, the lower-
       contrast dimmer tone was reading as visually "thinner" than the
       active tab even though the weight was identical; bumping the resting
       color up a step (plus 800 weight) is what actually reads as bold
       at a glance, not just technically bold. */
    display: flex; align-items: center; padding: 8px 16px; border-radius: 10px 10px 0 0;
    font-size: 13px; font-weight: 800; background: transparent; border: none; border-bottom: 2px solid transparent;
    color: var(--text-dim); transition: color .15s, border-color .15s;
  }
  /* Neutral border on hover (not var(--accent)) so a hovered, still-inactive
     tab reads as "hoverable" without visually competing with the one tab
     that's actually active — that one keeps sole claim to the accent-
     colored underline. */
  .tab-btn:hover { color: var(--text-dim); border-bottom-color: var(--border); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(148, 163, 184, 0.06); text-shadow: 0 0 18px rgba(168,67,74,0.35); }
  .tab-btn:disabled { color: var(--text-faint); cursor: not-allowed; opacity: 0.55; }
  .tab-btn:disabled:hover { color: var(--text-faint); }
  .tab-count { margin-left: 8px; font-size: 11px; font-family: var(--font-mono); color: var(--text-dimmer); }
  .tab-overdue { margin-left: 6px; display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; background: var(--danger-soft); border: 1px solid rgba(239,68,68,0.5); padding: 2px 6px; font-size: 10px; font-weight: 700; color: var(--danger); animation: pulse-soft 1.8s infinite; }
  @keyframes pulse-soft { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  .tabs-actions { margin-left: auto; margin-bottom: 4px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  /* ---------- board toolbar: search + sort ---------- */
  /* Its own slim strip above the sidebar/board — deliberately not folded
     into .tabs-actions above, so nothing already there shifts position.
     Pill-shaped icon-inside search + a compact labeled sort control is its
     own distinct visual language (not reused from anywhere else in the
     app), styled entirely from the existing theme tokens. */
  .board-toolbar { display: flex; align-items: center; gap: 12px; padding: 0 24px 14px; flex-wrap: wrap; }
  .board-search-box { position: relative; width: 300px; flex-shrink: 0; }
  .board-search-box .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-faint); pointer-events: none; display: flex; }
  .board-search-input {
    /* --panel/--border, not the -soft pair — in light mode specifically,
       --panel-soft and --border-soft both sit too close to the page's own
       --bg to read as a distinct field at rest, only really showing up
       once focused. */
    width: 100%; padding: 7px 28px 7px 32px; border-radius: var(--radius-sm);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    font-size: 12.5px; transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
  }
  .board-search-input::placeholder { color: var(--text-faint); }
  .board-search-input:focus { outline: none; border-color: var(--accent); background: var(--panel); box-shadow: 0 0 0 3px var(--accent-soft); }
  .board-search-clear {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: var(--text-faint); cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 4px; border-radius: 50%;
  }
  .board-search-clear:hover { color: var(--text); background: var(--panel-alt); }
  .board-search-count { font-size: 11px; color: var(--text-dimmer); white-space: nowrap; }
  .board-sort-box { display: flex; align-items: center; gap: 7px; color: var(--text-dimmer); flex-shrink: 0; margin-left: auto; padding-left: 14px; border-left: 1px solid var(--border-soft); }
  .board-sort-box .sort-lbl { font-size: 11px; white-space: nowrap; display: flex; align-items: center; gap: 5px; }
  .board-sort-select { padding: 6px 8px; border-radius: var(--radius-sm); background: var(--panel-soft); border: 1px solid var(--border-soft); color: var(--text); font-size: 12px; }
  .board-sort-select:focus { outline: none; border-color: var(--accent); }
  /* color-scheme tells the browser to render this input's native pieces
     (the mm/dd/yyyy placeholder segments, the calendar-icon glyph, and the
     popup calendar itself) in a dark- or light-appropriate palette — without
     it the browser guesses "light" regardless of theme, which is why the
     icon/placeholder looked washed-out and mismatched on the dark board. */
  input.board-sort-select[type="date"] { color-scheme: dark; }
  :root[data-theme="light"] input.board-sort-select[type="date"] { color-scheme: light; }
  .overdue-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none; }
  .overdue-toggle input { accent-color: var(--accent); cursor: pointer; }
  .btn-primary {
    border-radius: var(--radius-sm); background: var(--accent); color: #fff8f5; border: none;
    font-size: 13px; font-weight: 700; padding: 8px 16px; transition: background .15s;
  }
  /* brightness filter, not a background swap — guarantees "hover always
     lightens" in both themes without needing a separate token, since
     --accent-strong points opposite directions per theme (brighter in
     dark mode for text-on-tint legibility, darker in light mode for
     text-on-white contrast) and swapping to it here would darken this
     button on hover in light mode specifically. */
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { border-radius: var(--radius-sm); background: transparent; border: none; font-size: 13px; font-weight: 600; color: var(--text-dim); padding: 8px 16px; }
  .btn-ghost:hover { color: var(--text); }
  .btn-secondary { border-radius: var(--radius-sm); background: var(--panel-alt); border: 1px solid var(--border-soft); color: var(--text); font-size: 12px; font-weight: 600; padding: 6px 12px; }
  .btn-secondary:hover { border-color: var(--text-faint); }
  .btn-secondary.active { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }
  .btn-danger { border-radius: var(--radius-sm); background: var(--danger); color: #fff; border: none; font-size: 12px; font-weight: 700; padding: 6px 12px; transition: filter .15s; }
  .btn-danger:hover { filter: brightness(1.1); }

  /* ---------- layout: sidebar + board ---------- */
  .layout-row { position: relative; display: flex; align-items: flex-start; }
  .sidebar { flex-shrink: 0; overflow: hidden; transition: width .28s ease; border-right: 1px solid var(--border); background: var(--panel-alt); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); width: 224px; }
  .sidebar.closed { width: 0; border-right-color: transparent; }
  .sidebar-inner { width: 224px; padding: 16px 12px; }
  .sidebar-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dimmer); font-weight: 700; padding: 0 8px; margin: 0 0 8px; }
  .sidebar-list { display: flex; flex-direction: column; gap: 4px; }
  .sidebar-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 500; color: var(--text-dim); border: 1px solid transparent; background: transparent; text-align: left; width: 100%;
    transition: background .15s, border-color .15s, color .15s;
  }
  /* Same "neutral border/underline on hover, accent reserved for the truly
     active row" language as .tab-btn — here as an outline (border, not
     underline) since these are vertical list rows, not baseline-anchored
     tabs. */
  /* .sidebar itself is already var(--panel-alt) — using that same token
     here would make the hover wash invisible (identical to its own
     container), not just subtle. var(--border) is a genuinely different
     shade from panel-alt in both themes. */
  .sidebar-item:not(.active):hover { background: var(--border); border-color: var(--border-soft); color: var(--text); }
  /* Simplified from a full tinted-background + glow treatment (read as
     muddy in dark mode) down to a plain left accent bar — cleaner, and
     the 2px border-left swap needs 2px trimmed off the left padding so
     the label doesn't visibly jump sideways when a row becomes active. */
  .sidebar-item.active { background: var(--panel); border-color: var(--border-soft); border-left: 2px solid var(--accent); padding-left: 8px; color: var(--accent-strong); }
  .sidebar-item .lbl { flex: 1; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sidebar-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .sidebar-count { font-family: var(--font-mono); font-size: 10px; border-radius: 999px; padding: 2px 6px; background: var(--panel-alt); color: var(--text-dimmer); }
  .sidebar-item.active .sidebar-count { background: var(--panel-alt); color: var(--accent-strong); }

  .board-area { flex: 1; min-width: 0; padding: 20px 24px 32px; overflow-x: auto; }
  .board-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .column {
    /* A faint brand-red wash layered over --panel-alt, not flat gray — a
       plain neutral block read as boring, but --panel-alt alone is also
       what .ticket-card's own background needs to contrast AGAINST (the
       "card sits a shade darker than its column" hierarchy), so the fix
       is a tint on top of that same base rather than swapping to a
       different neutral token, which would collide with the card color
       instead of just looking flat. */
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, var(--accent-soft), transparent 56px), var(--panel-alt);
    border: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 200px;
  }
  .column-head { display: flex; align-items: center; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); color: var(--text-dimmer); }
  .column-head .title { font-size: 12px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .column-head .count { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .column-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .column-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px 12px; color: var(--text-faint); }
  .column-empty svg { opacity: .5; }
  .column-empty span { font-size: 11px; }

  /* ---------- ticket card ---------- */
  .ticket-card {
    position: relative; width: 100%; text-align: left; border-radius: var(--radius-md);
    background: var(--panel); border: 1px solid var(--border); overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
    transition: background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  .ticket-card:hover {
    background: var(--panel); border-color: rgba(168,67,74,0.5);
    box-shadow: 0 0 0 1px rgba(168,67,74,0.1), 0 10px 24px -12px rgba(0,0,0,0.45);
    transform: translateY(-1px);
  }
  .ticket-card.overdue { border-color: rgba(248,113,113,0.55); }
  .ticket-card.overdue:hover { border-color: var(--danger); box-shadow: 0 0 0 1px rgba(248,113,113,0.12), 0 10px 24px -12px rgba(0,0,0,0.5); }
  .ticket-card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(168,67,74,0.35); }
  .ticket-card.selectable .ticket-body { padding-left: 34px; }
  .ticket-select-checkbox { position: absolute; top: 12px; left: 12px; z-index: 2; width: 16px; height: 16px; cursor: pointer; accent-color: var(--accent); }
  .ticket-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .ticket-body { padding: 12px 12px 12px 14px; }
  .ticket-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 6px; }
  .ticket-id { font-family: var(--font-mono); font-size: 11px; color: var(--text-dimmer); letter-spacing: .02em; }
  .ticket-title { font-size: 13.5px; color: var(--text); font-weight: 600; line-height: 1.35; margin: 0 0 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  .ticket-badges { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .ticket-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

  /* Hover-to-preview: a single shared tooltip (see ensureTicketTooltipEl()
     in the script below), appended to <body> — NOT per-card — and
     repositioned/refilled on each hover via JS, since deciding which side
     of the card it opens on (to avoid clipping at a screen edge) needs the
     card's actual on-screen position, which plain CSS :hover can't see.
     pointer-events: auto — it's interactive (a long Details section scrolls,
     and its links are clickable), with a hover-bridge in the mouseover/
     mouseout listeners below so moving the mouse from the card onto the
     tooltip itself doesn't close it.
     A subtle gradient + glowing top edge instead of a flat panel color —
     reads as its own floating "popover" component rather than just another
     rectangle the same flat color as the card sitting behind it. */
  .ticket-tooltip {
    position: fixed; z-index: 100; display: none; pointer-events: auto; overflow-y: auto; overflow-x: hidden;
    width: 320px; max-width: calc(100vw - 20px); max-height: min(85vh, 640px);
    background: linear-gradient(165deg, var(--panel) 0%, var(--panel-soft) 100%);
    border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: 0 24px 60px rgba(0,0,0,0.55), 0 0 0 1px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,0.04);
    padding: 14px 16px;
  }
  .ticket-tooltip::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
  }
  .ticket-tooltip-header { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .ticket-tooltip-id { font-family: var(--font-mono); font-size: 11px; color: var(--text-dimmer); letter-spacing: .02em; }
  .ticket-tooltip-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 0 0 8px; line-height: 1.35; overflow-wrap: anywhere; }
  .ticket-tooltip-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dimmer); margin: 0 0 4px; }
  /* No max-height/scroll of its own — the whole tooltip (.ticket-tooltip)
     scrolls as one unit now, so a long Details/Hunt Notes section just
     flows naturally instead of nesting a second scrollbar inside the
     first. pointer-events: auto up on .ticket-tooltip (plus the hover-
     bridge in the mouseover/mouseout listeners below) lets the mouse
     actually move onto the tooltip to reach that outer scrollbar without
     the tooltip closing first. */
  .ticket-tooltip-details { font-size: 12.5px; color: var(--text-dim); line-height: 1.5; white-space: pre-wrap; margin: 0 0 12px; overflow-wrap: anywhere; }
  .ticket-tooltip-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; border-top: 1px solid var(--border-soft); padding-top: 10px; }
  .ticket-tooltip-meta-item { display: flex; flex-direction: column; gap: 2px; }
  .ticket-tooltip-meta-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--text-dimmer); }
  .ticket-tooltip-meta-value { font-size: 12.5px; color: var(--text); }

  /* ---------- badges ---------- */
  .badge-priority { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .badge-priority .dot { width: 6px; height: 6px; border-radius: 50%; }
  .badge-category { display: inline-flex; align-items: center; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-soft); padding: 2px 8px; font-size: 10px; font-weight: 500; color: var(--text-dim); }
  .badge-overdue { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--danger-soft); border: 1px solid rgba(239,68,68,0.6); color: var(--danger); font-weight: 700; text-transform: uppercase; letter-spacing: .03em; padding: 2px 8px; font-size: 10px; animation: pulse-soft 1.8s infinite; }
  .badge-frozen { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: var(--panel-alt); border: 1px solid var(--border-soft); color: var(--text-dim); font-weight: 600; padding: 2px 8px; font-size: 10px; }

  /* ---------- assignee ---------- */
  /* min-width:0 lets this shrink in the .ticket-footer flex row instead of
     forcing .timer-line (flex-shrink:0, must always stay fully visible) past
     the card's edge, where .ticket-card's overflow:hidden would clip it —
     e.g. "05:23:11" rendering as just "05:". */
  .assignee { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .avatar { display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(255,255,255,0.06); border: 1px solid var(--border-soft); font-family: var(--font-mono); font-weight: 700; color: var(--text); flex-shrink: 0; }
  .avatar.sm { width: 24px; height: 24px; font-size: 10px; }
  .avatar.md { width: 36px; height: 36px; font-size: 12px; }
  .avatar-unassigned { display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid rgba(239,68,68,0.6); background: var(--danger-soft); color: var(--danger); font-weight: 700; flex-shrink: 0; }
  .assignee-name { font-size: 11px; color: var(--text-dim); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .assignee-name.md { font-size: 13px; max-width: none; }
  .unassigned-label { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--danger); max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .timer-line { display: flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 11px; flex-shrink: 0; white-space: nowrap; }
  .timer-line svg { flex-shrink: 0; }

  /* ---------- modals ---------- */
  /* align-items:flex-start (never "center") anchors the panel's TOP edge at
     a fixed offset from the viewport top — the overlay's own 16px padding —
     that never recomputes based on the panel's height. align-items:center
     would keep re-centering as content grows, dragging the top edge upward;
     flex-start + no auto margin on the panel means the top is simply fixed,
     full stop, regardless of viewport height or how much content grows. */
  .modal-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 16px; background: var(--overlay-scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; }
  /* Belt-and-suspenders structural fix on top of the fixed top anchor above:
     the panel is a flex column with a hard max-height and overflow:hidden.
     The header is flex-shrink:0 (never compresses, is never part of any
     scroll region) and .modal-body is the ONLY flex:1 + overflow-y:auto
     child — so growing content (e.g. expanding history) can only ever add
     scroll height inside modal-body. The panel's own box never resizes past
     its cap, so there's nothing for the header's position to react to. */
  .modal-panel { width: 100%; max-width: 640px; max-height: 88vh; margin: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: var(--radius-lg); background: var(--panel); border: 1px solid var(--border-soft); box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(148,163,184,0.06); }
  .modal-panel.narrow { max-width: 520px; }
  .modal-head { flex-shrink: 0; background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 18px 24px; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  /* min-width: 0 lets this flex child actually shrink below its content's
     natural width — without it, a long unbroken title (no spaces, e.g. an
     underscore-separated filename-style title) forces the flex item wide
     enough to push past the modal edge / crowd the close button, no matter
     what overflow-wrap says on the title itself. */
  .modal-head > div:first-child { min-width: 0; flex: 1 1 auto; }
  .modal-head-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--text); margin: 0; line-height: 1.35; overflow-wrap: anywhere; }
  .modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 20px 24px; display: flex; flex-direction: column; gap: 22px; }
  .section-label { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dimmer); font-weight: 700; margin: 0 0 8px; }
  .section-label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }

  /* Shrunk from a much larger version (18px padding, 34px timer digits) so
     the SLA panel reads as a compact status strip rather than the visual
     anchor of the modal — Details/Hunt Notes is the thing worth the most
     room, not the countdown. */
  .sla-panel { border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--panel-soft); padding: 12px 14px; }
  .sla-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .sla-panel-head .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dimmer); font-weight: 700; }
  .sla-panel-head .due { font-size: 10px; color: var(--text-dimmer); font-family: var(--font-mono); }
  .sla-timer { font-family: var(--font-mono); font-size: 22px; font-weight: 800; }
  .sla-track { margin-top: 8px; height: 4px; width: 100%; border-radius: 999px; background: var(--border); overflow: hidden; }
  .sla-track-fill { height: 100%; border-radius: 999px; transition: width .5s; }
  .sla-meta-row { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 10.5px; color: var(--text-dimmer); }
  .sla-actions { margin-top: 8px; display: flex; gap: 8px; }
  /* #app .btn-pause / #app .btn-resume still carries the #app prefix from
     when the old global "#app button { color: inherit }" reset (an ID+type
     selector) silently outranked every bare ".btn-x { color: ... }" rule in
     this file — that reset has since been narrowed to no longer touch
     button color at all (see the comment above "#app button { font: inherit; }"
     near the top of this stylesheet), so a plain ".btn-pause"/".btn-resume"
     would work fine today too. Left as-is since it's still correct either
     way and every other button class was the one that needed fixing. */
  .btn-pause, .btn-resume { display: inline-flex; align-items: center; gap: 6px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; padding: 8px 16px; transition: background .15s, border-color .15s; }
  #app .btn-pause { background: rgba(245, 158, 11, 0.16); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.5); }
  #app .btn-pause:hover { background: rgba(245, 158, 11, 0.28); border-color: rgba(245, 158, 11, 0.7); }
  #app .btn-resume { background: rgba(16, 185, 129, 0.16); color: #6ee7b7; border: 1px solid rgba(16, 185, 129, 0.5); }
  #app .btn-resume:hover { background: rgba(16, 185, 129, 0.28); border-color: rgba(16, 185, 129, 0.7); }

  .status-panel { border-radius: var(--radius-md); border: 1px solid; padding: 18px; display: flex; align-items: center; gap: 12px; }
  .status-panel .emoji { font-size: 30px; line-height: 1; }
  .status-panel h4 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .02em; }
  .status-panel p { margin: 3px 0 0; font-size: 12px; color: var(--text-dim); }

  /* --panel/--border, not the -soft pair — see .board-search-input for
     why: in light mode, panel-soft/border-soft sit too close to the
     page's own background to read as a distinct field until focused. */
  textarea, .field-input {
    width: 100%; border-radius: var(--radius-sm); background: var(--panel); border: 1px solid var(--border);
    color: var(--text); padding: 9px 11px; font-size: 13px;
  }
  textarea::placeholder, .field-input::placeholder { color: var(--text-faint); }
  textarea:focus, .field-input:focus { outline: none; border-color: var(--accent); }
  textarea.details-area { min-height: 220px; resize: vertical; line-height: 1.5; }
  .detected-links { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .detected-link { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--accent); text-decoration: none; min-width: 0; }
  .detected-link .icon { flex-shrink: 0; }
  .detected-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detected-link:hover { text-decoration: underline; color: var(--accent-strong); }
  .inline-link { color: var(--accent); text-decoration: underline; }
  .inline-link:hover { color: var(--accent-strong); }
  textarea.comment-area { min-height: 72px; resize: vertical; }

  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .meta-grid .value { color: var(--text); }
  .meta-row-user { display: flex; align-items: center; gap: 6px; color: var(--text); }

  .dropzone {
    width: 100%; border-radius: var(--radius-md); border: 2px dashed var(--border-soft); background: var(--panel-soft);
    padding: 22px 0; display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text-dimmer);
    transition: color .15s, border-color .15s;
  }
  .dropzone:hover { color: var(--accent); border-color: rgba(168,67,74,0.5); }
  .attachment-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); background: var(--panel-alt); border-radius: var(--radius-sm); padding: 7px 10px; }
  .attachment-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attachment-size { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); flex-shrink: 0; }
  .attachment-thumb { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; cursor: zoom-in; flex-shrink: 0; border: 1px solid var(--border-soft); }
  .image-lightbox-overlay { background: rgba(0,0,0,0.85); }
  .image-lightbox-close { position: fixed; top: 20px; right: 20px; border: none; background: rgba(255,255,255,0.12); color: #fff; }
  .format-note { font-size: 10px; color: var(--text-faint); margin-top: 8px; }

  .history-row { display: flex; gap: 10px; font-size: 12px; }
  .history-dot-col { display: flex; flex-direction: column; align-items: center; padding-top: 2px; }
  .history-dot { height: 20px; width: 20px; border-radius: 50%; background: var(--panel-alt); border: 1px solid var(--border-soft); display: flex; align-items: center; justify-content: center; color: var(--accent); flex-shrink: 0; }
  .history-line { width: 1px; flex: 1; background: var(--border); margin-top: 4px; }
  .history-content { padding-bottom: 12px; flex: 1; }
  .history-head { display: flex; align-items: baseline; gap: 8px; }
  .history-action { color: var(--text); font-weight: 700; }
  .history-time { color: var(--text-dimmer); font-family: var(--font-mono); font-size: 10px; }
  .history-note { color: var(--text-dim); margin: 3px 0 0; }
  .history-delete { margin-left: auto; display: flex; align-items: center; gap: 4px; border-radius: 5px; border: 1px solid var(--border-soft); background: var(--panel-alt); color: var(--text-dim); padding: 3px 6px; flex-shrink: 0; }
  .history-delete:hover { border-color: rgba(239,68,68,0.6); background: var(--danger-soft); color: var(--danger); }

  .comment-item { display: flex; gap: 10px; }
  .comment-head { display: flex; align-items: baseline; gap: 8px; }
  .comment-author { font-weight: 700; font-size: 12px; color: var(--text); }
  .comment-time { color: var(--text-dimmer); font-family: var(--font-mono); font-size: 10px; }
  .comment-text { font-size: 13px; color: var(--text-dim); margin: 3px 0 0; line-height: 1.5; }
  .mention { color: var(--accent-strong); font-weight: 700; }
  .mention-box { position: relative; }
  .mention-dropdown { position: absolute; z-index: 10; bottom: 100%; margin-bottom: 4px; width: 260px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft); background: var(--panel); box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 190px; overflow-y: auto; }
  .mention-option { width: 100%; text-align: left; padding: 8px 10px; font-size: 12px; color: var(--text); display: flex; align-items: center; gap: 8px; background: transparent; border: none; }
  .mention-option:hover { background: var(--panel-alt); }

  /* Single "⋮" trigger per row (Roster/Categories/Agencies/Clients),
     replacing a pair of always-visible pencil+trash icons. */
  .row-menu-wrap { display: inline-block; }
  /* #row-action-menu is a single shared element appended once at the end
     of #app (see render()) — position: fixed and top/left set inline by
     positionFloatingRowMenu(), not CSS-anchored to any particular row's
     wrapper. This is deliberate: a table wrapper with overflow-x:auto
     (.table-scroll-wrap) implicitly computes overflow-y as auto too (a
     CSS quirk — setting one axis to non-visible forces the other off
     "visible"), which was silently clipping/scrolling this dropdown
     whenever it opened near the bottom of a long list. Living outside
     every scrollable ancestor sidesteps that entirely — same reasoning
     as #ticket-tooltip's own fixed positioning. */
  .row-menu-dropdown { position: fixed; z-index: 60; display: none; min-width: 130px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft); background: var(--panel); box-shadow: 0 16px 36px rgba(0,0,0,0.4); overflow: hidden; }
  .row-menu-option { width: 100%; text-align: left; padding: 8px 12px; font-size: 12.5px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; background: transparent; border: none; cursor: pointer; }
  .row-menu-option:hover { background: var(--panel-alt); }
  .row-menu-option.danger { color: var(--danger); }

  /* Agency combobox — same box/option visuals as the @mention dropdown
     above, but opens DOWNWARD (top:100%) instead of upward: the mention
     dropdown opens up because the comment box it belongs to sits near the
     bottom of the ticket modal, but this combobox also appears in the
     board filter bar near the TOP of the page, where opening upward would
     run off-screen. Reuses .mention-box for the positioning context and
     .mention-option for each row so the two pickers look identical. */
  .agency-dropdown { position: absolute; z-index: 15; top: 100%; left: 0; right: 0; margin-top: 4px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft); background: var(--panel); box-shadow: 0 20px 50px rgba(0,0,0,0.5); max-height: 220px; overflow-y: auto; }

  /* ---------- create ticket form ---------- */
  .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .team-toggle { display: flex; gap: 8px; }
  .team-toggle button { flex: 1; border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; font-weight: 700; border: 1px solid var(--border-soft); background: rgba(4,7,14,0.5); color: var(--text-dim); transition: color .15s, border-color .15s; }
  .team-toggle button:not(.active):hover { color: var(--text); border-color: var(--border); }
  .team-toggle button.active { background: var(--accent-soft); border-color: rgba(168,67,74,0.55); color: var(--accent-strong); }
  .hint { font-size: 10px; color: var(--text-faint); margin-top: 5px; }
  .modal-footer { flex-shrink: 0; border-top: 1px solid var(--border); padding: 14px 24px; display: flex; justify-content: flex-end; gap: 8px; }

  /* ---------- Admin / SLA Settings — enterprise console shell ---------- */
  .settings-shell { display: flex; align-items: flex-start; min-height: calc(100vh - 160px); }
  .settings-nav { flex-shrink: 0; width: 248px; padding: 24px 14px; border-right: 1px solid var(--border); }
  .settings-nav-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); font-weight: 700; padding: 0 10px; margin: 0 0 12px; }
  .settings-nav-list { display: flex; flex-direction: column; gap: 2px; }
  .settings-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid transparent; background: transparent; color: var(--text-dim); font-size: 13px; font-weight: 600; transition: background .15s, border-color .15s, color .15s; }
  .settings-nav-item:not(.active):hover { background: var(--panel-alt); border-color: var(--border-soft); color: var(--text); }
  .settings-nav-item.active { background: var(--accent-soft); border-color: rgba(168,67,74,0.4); color: var(--accent-strong); box-shadow: 0 0 0 1px rgba(168,67,74,0.12), 0 4px 14px -4px var(--accent-glow); }
  .settings-nav-item svg { flex-shrink: 0; }

  .settings-content { flex: 1; min-width: 0; padding: 28px 32px 48px; max-width: 860px; }
  .settings-panel-head { margin-bottom: 22px; }
  .settings-panel-head h2 { font-size: 18px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 10px; margin: 0; text-wrap: balance; }
  .settings-panel-head p { font-size: 12.5px; color: var(--text-dimmer); margin: 6px 0 0; line-height: 1.6; max-width: 62ch; }
  .settings-panel-head code { font-family: var(--font-mono); color: var(--text-dim); }

  .settings-card { border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--panel-soft); padding: 20px 22px; }
  .settings-card + .settings-card { margin-top: 16px; }
  .settings-card-title { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dimmer); font-weight: 700; margin: 0 0 14px; }

  .sla-priority-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 4px; }
  .sla-priority-card + .sla-priority-card { border-top: 1px solid var(--border-soft); }
  .sla-priority-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .sla-priority-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .sla-priority-name { font-size: 13.5px; font-weight: 700; color: var(--text); }
  .sla-priority-sub { font-size: 11.5px; color: var(--text-dimmer); margin-top: 1px; }

  /* ---------- Analytics PDF export (via the browser's own Print dialog) ---------- */
  /* Hidden on screen always — only ever shown by the @media print block

  #analytics-print-report { display: none; }
  @media print {
    /* display:none (not visibility:hidden) on every OTHER direct child of

    body > *:not(#analytics-print-report) { display: none !important; }

<div id="app"></div>
<script>
(function () {
  "use strict";

  // Single point of configuration for the backend this build talks to —
  // change this one value (e.g. to a Google Cloud URL) and every fetch()
  // call below follows it. Nothing else in this file references a host.
  const API_BASE_URL = "/api";

  // Google Sign-In status check — runs once at bootstrap, in parallel with
  // loadTickets()/loadSlaConfig()/etc. below (same "kick it off, re-render
  // when it resolves" pattern every other loader already uses). credentials:
  // "same-origin" is required for the httpOnly session cookie to actually
  // be sent/received by fetch() — without it, a signed-in session would
  // never be recognized on subsequent loads.
  function checkAuth() {
    fetch("/auth/me", { credentials: "same-origin" })
      .then(function (res) { return res.json().then(function (data) { return { status: res.status, data: data }; }); })
      .then(function (result) {
        var data = result.data || {};
        state.authConfigured = !!data.configured;
        state.authUser = data.user || null;
        if (state.authConfigured && state.authUser) state.currentUserId = state.authUser.id;
        render();
      })
      .catch(function (err) {
        console.error("Could not check sign-in status:", err);
        // Same "never block the app over a side-channel failure" rule as
        // every other loader's catch handler — treat an unreachable /auth/me
        // as "not configured yet" rather than locking the whole app out.
        state.authConfigured = false;
        render();
      });
  }

  function signOut() {
    fetch("/auth/logout", { method: "POST", credentials: "same-origin" }).finally(function () {
      state.authUser = null;
      render();
    });
  }

  // =====================================================================
  // DATA
  // =====================================================================
  var TEAMS = { SOC: "SOC Team", TI: "Threat Hunt Team" };
  // The roster is live, mutable data (edited from Admin / SLA Settings →
  // Team Roster & Roles), not a fixed constant — every read site below
  // re-reads these arrays fresh (via getAllUsers()/usersForTeam()) rather
  // than caching a snapshot, so a name/team/role/admin edit here is
  // reflected everywhere (assignee dropdowns, the active-user selector,
  // @mentions, the admin gate) the moment it's saved.
  // `role` is the one display label for a person's title/level (e.g. "L1",
  // "Sr. SE", "Practice Head") — `isAdmin` is a fully separate boolean that
  // only controls SUPERADMIN-style access, so promoting someone to admin
  // never overwrites what their role/title says.
  var USERS = {
    SOC: [
      { id: "u1", name: "Noreen Jade Lozano", role: "SE", isAdmin: true, email: "noreen.lozano@maroonstudios.com" },
      { id: "u2", name: "Alvin Jarek Gonzales", role: "L2", isAdmin: false, email: "agonzales@company.com" },
      { id: "u3", name: "Andre Val Consorte", role: "Sr. SE", isAdmin: true, email: "aconsorte@company.com" },
      { id: "u4", name: "Rhea Lorenzana", role: "L1", isAdmin: false, email: "rlorenzana@company.com" },
      { id: "u5", name: "Gabriel Jethro Anunciacion", role: "L1", isAdmin: false, email: "ganunciacion@company.com" }
    ],
    TI: [
      { id: "u6", name: "Miguel Luayon", role: "L1", isAdmin: false, email: "mluayon@company.com" },
      { id: "u7", name: "Rod Valdez", role: "SE", isAdmin: true, email: "rvaldez@company.com" },
      { id: "u8", name: "Jeshrine Zoe Nogar", role: "SE", isAdmin: false, email: "jnogar@company.com" },
      { id: "u9", name: "Alessander Vill Mondero", role: "L1", isAdmin: false, email: "amondero@company.com" }
    ]
  };
  // Practice Head sits above both teams, not inside either one — kept as its
  // own roster group so he's assignable on SOC *and* Threat Hunt tickets
  // (see usersForTeam) without duplicating his identity into two ids.
  var LEADERSHIP = [
    { id: "u10", name: "Jason Obrero", role: "Practice Head", isAdmin: true, email: "jobrero@company.com" }
  ];
  var UNASSIGNED = "unassigned";
  // SLA countdown only starts once a ticket actually has an assignee — a
  // ticket sitting unassigned used to count down (and could even show as
  // "Overdue") from the moment it was created, which was misleading (nobody
  // had even started the clock on it yet). slaDate is sentinel 0 while
  // unassigned; a real slaDate is always a huge epoch-ms timestamp, so 0 can
  // never collide with a genuine deadline. Once set (by the first
  // assignment — see updateTicket()), it keeps running even if the ticket is
  // later unassigned again; it never resets back to "not started."
  var SLA_NOT_STARTED = 0;
  function slaNotStarted(t) { return t.slaDate === SLA_NOT_STARTED; }
  var userIdSeq = 10;
  function nextUserId() { userIdSeq += 1; return "u" + userIdSeq; }
  // Always re-derived from the live arrays — never cache this as a snapshot,
  // or roster edits would silently stop showing up in mentions/dropdowns.
  // Was `USERS.SOC.concat(USERS.TI).concat(LEADERSHIP)` — hardcoded to
  // exactly two team keys, which made every 3rd team's members invisible to
  // @mentions, the admin roster list, and the current-user lookup. Deriving
  // the team keys from TEAMS itself means a new team is picked up here for
  // free.
  function getAllUsers() {
    return Object.keys(TEAMS).reduce(function (acc, key) { return acc.concat(USERS[key]); }, []).concat(LEADERSHIP);
  }
  // The pool of people assignable to a given team's tickets — that team's
  // own roster plus leadership, who can pick up work on either team.
  function usersForTeam(team) { return USERS[team].concat(LEADERSHIP); }
  // Which array (and index) a user id currently lives in — needed to move a
  // person between teams when their Team is edited, and to delete them from
  // wherever they currently are. Same TEAMS-derived generalization as
  // getAllUsers() above — was a hardcoded 3-entry list.
  function findUserLocation(id) {
    var groups = Object.keys(TEAMS).map(function (key) { return [key, USERS[key]]; }).concat([["LEADERSHIP", LEADERSHIP]]);
    for (var i = 0; i < groups.length; i++) {

  // fetch that overwrites state.slaConfig + re-renders once the real config

  function loadSlaConfig() {

      .then(function (res) { return res.json(); })
      .then(function (data) {

  function persistSlaConfig(config) {

    var body = Object.keys(TEAMS).reduce(function (acc, team) { acc[team] = config[team]; return acc; }, { updatedBy: state.currentUserId });

  // instead of localStorage. persistTickets()/persistRoster() are still

  // fetch itself fails, INITIAL_TICKETS is used as the same "keep the app

        // no automatic retry) — persistTickets() must never bulk-PUT this
        // unconfirmed fallback list back to the server: with

        // would otherwise look "new" and overwrite whatever real tickets

    if (current === lastSyncedRosterJson) return true; // nothing changed since the last successful sync
    fetch(API_BASE_URL + "/roster", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: current
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      lastSyncedRosterJson = current;
    }).catch(function (err) {
      console.error("Could not persist roster to server:", err);

    return true;
  }

    notificationPrefs: {

    clientFilter: "", // "" = All Clients, else a value from CLIENTS
    priorityFilter: "", // "" = All Priorities, else "Critical" | "High" | "Medium" | "Low" — sidebar Priority Filters
    specificDateFilter: "", // "" = no filter, else a "YYYY-MM-DD" string from the board's date picker — filters tickets to that exact creation date
    agencyFilter: "", // "" = All Agencies (also matches tickets with no agency set), else an agency name — only meaningful when clientFilter === "NSOC"
    agencyFilterQuery: "", // raw text currently typed in the Agency filter combobox, may not be committed yet

    sortOrder: "newest", // "newest" | "oldest" — orders tickets within each status column by createdAt

  function findTicket(id) {
    return state.tickets.filter(function (t) { return t.id === id; })[0] || null;
  }
  function updateTicket(id, patch) {
    state.tickets = state.tickets.map(function (t) {
      if (t.id !== id) return t;
      var next = {};
      for (var k in t) next[k] = t[k];
      // Single chokepoint for every assignee change made through the UI
      // (Save Changes' assignee draft is the only place this happens today,
      // but this covers any future one too) — starts the SLA clock the
      // moment a ticket gets its first real assignee. Only fires while
      // slaDate is still the "not started" sentinel, so unassigning and
      // reassigning later never restarts it (see SLA_NOT_STARTED above).
      // Mirrors the equivalent server-side logic in POST/PATCH
      // /api/tickets, which handles ticket creation and any direct API
      // client — this is what the app's own bulk-sync (persistTickets())
      // path actually goes through.
      if (patch.assignee != null && patch.assignee && !t.assignee && slaNotStarted(t)) {
        next.slaDate = Date.now() + (t.priorityConfig ? t.priorityConfig.hours : 8) * 3600 * 1000;
      }
      // Once the clock has actually started (not the sentinel above), losing
      // the assignee again freezes it — same idea as Pause, but automatic.
      // Reassigning later credits the frozen duration back into slaDate,
      // same as Resume does. Tracked in unassignedSince, a separate field
      // from isPaused, so an analyst's own deliberate pause is never
      // confused with (or cleared by) this automatic one. Mirrors the
      // equivalent server-side logic in PATCH /api/tickets/:id.
      var wasReallyAssigned = !!t.assignee && t.assignee !== UNASSIGNED;
      var patchUnassigns = patch.assignee != null && (!patch.assignee || patch.assignee === UNASSIGNED);
      var patchAssigns = patch.assignee != null && patch.assignee && patch.assignee !== UNASSIGNED;
      if (patchUnassigns && wasReallyAssigned && !slaNotStarted(t)) {
        next.unassignedSince = Date.now();
      }
      if (patchAssigns && !wasReallyAssigned && !slaNotStarted(t) && t.unassignedSince != null) {
        next.slaDate = t.slaDate + (Date.now() - t.unassignedSince);
        next.unassignedSince = null;
      }
      for (var k2 in patch) next[k2] = patch[k2];
      return next;
    });
  }

  // =====================================================================
  // RENDER — PRESENTATIONAL HELPERS
  // =====================================================================
  // Takes the ticket's own frozen priorityConfig snapshot — never a live
  // state.slaConfig lookup — so an existing ticket's badge color/label can
  // never shift out from under it when the admin edits SLA settings later.
  function priorityBadge(priority, cfg) {
    return '<span class="badge-priority" style="background:' + cfg.color + '22;color:' + cfg.color + ';border:1px solid ' + cfg.color + '55">' +
      '<span class="dot" style="background:' + cfg.color + '"></span>' + escapeHtml(priority) + "</span>";
  }
  function categoryBadge(category) {
    if (!category) return "";
    return '<span class="badge-category">' + escapeHtml(category) + "</span>";
  }
  function overdueBadge() {
    return '<span class="badge-overdue">⚠ OVERDUE</span>';
  }
  function avatarHtml(name, size) {
    size = size || "sm";
    return '<div class="avatar ' + size + '" title="' + escapeHtml(name) + '">' + escapeHtml(initials(name)) + "</div>";
  }
  function assigneeTag(assignee, size) {
    size = size || "sm";
    var isUnassigned = !assignee || assignee === UNASSIGNED;
    if (isUnassigned) {
      var dim = size === "sm" ? "24px" : "36px";
      return '<div class="assignee"><div class="avatar-unassigned" style="width:' + dim + ";height:" + dim + ';border-radius:50%;font-size:' + (size === "sm" ? "11px" : "14px") + '">?</div>' +
        '<span class="unassigned-label">Unassigned</span></div>';
    }
    var name = userName(assignee);
    return '<div class="assignee">' + avatarHtml(name, size) + '<span class="assignee-name' + (size === "md" ? " md" : "") + '">' + escapeHtml(name) + "</span></div>";
  }

  function ticketCardHtml(t) {
    var cfg = t.priorityConfig || state.slaConfig[t.team][t.priority];
    var rem = remainingMs(t, state.now);
    var overdue = isOverdue(t, state.now);
    var isPaused = slaFrozen(t);
    var isResolved = t.status === "Resolved";
    var isClosedOther = t.status === "Canceled" || t.status === "Rejected";
    var notStarted = slaNotStarted(t);
    var breached = isResolved && !notStarted && t.dateTimeResolved != null && t.dateTimeResolved > t.slaDate;
    var stripeColor = overdue ? "#EF4444" : cfg.color;

    var badges = categoryBadge(t.category) + clientBadge(t.client, t.agency);
    if (isPaused && !overdue) badges += '<span class="badge-frozen">' + I("pause", 9) + " Frozen</span>";
    if (overdue) badges += overdueBadge();

    var footer;
    if (isResolved) {
      var resolvedTitle = "Resolution Notes: " + (t.rejectionReason || "No resolution notes provided");
      footer = '<div class="timer-line" style="font-weight:700;color:' + (breached ? "var(--danger)" : "var(--success)") + '" title="' + escapeHtml(resolvedTitle) + '">' + (breached ? "⚠ Breached" : "✅ On time") + "</div>";
    } else if (isClosedOther) {
      var closedTitle = (t.status === "Rejected" || t.status === "Canceled") ? "Reason: " + (t.rejectionReason || "No reason provided") : "";
      footer = '<div class="timer-line" style="color:var(--text-faint)"' + (closedTitle ? ' title="' + escapeHtml(closedTitle) + '"' : "") + ">" + escapeHtml(t.status) + "</div>";
    } else if (notStarted) {
      // Short on purpose — .timer-line never shrinks or wraps (by design, so
      // a running countdown like "03:27:13" always renders intact), so this
      // has to fit in the same fixed-width slot those short strings do. The
      // Unassigned badge already sits right next to it saying why there's no
      // countdown; the fuller "Awaiting assignment — SLA hasn't started yet"
      // phrasing lives in the ticket modal/tooltip instead, where there's
      // actually room for it.
      footer = '<div class="timer-line" style="color:var(--text-faint)" title="Awaiting assignment — SLA hasn\'t started yet">' + I("clock", 11) + '<span>Not started</span></div>';
    } else {
      var timerColorInline = isPaused ? "var(--text-dimmer)" : overdue ? "var(--danger)" : "var(--text-dim)";
      footer = '<div class="timer-line" data-role="card-timer" data-ticket="' + t.id + '" style="color:' + timerColorInline + (overdue ? ";font-weight:700" : "") + '">' +
        (isPaused ? I("pause", 11) : overdue ? I("alertTriangle", 11) : I("clock", 11)) +
        '<span data-part="text">' + (isPaused ? "frozen" : overdue ? "Overdue by " + formatOverdueBy(rem) : formatDuration(rem)) + "</span></div>";
    }

    var selected = state.selectMode && state.selectedTicketIds.indexOf(t.id) !== -1;
    // A checkbox nested inside this <button> only ever resolves to its own
    // data-action when clicked directly (the click dispatcher stops at the
    // nearest [data-action] ancestor-or-self), so it toggles selection
    // without also triggering open-ticket — clicking anywhere else on the
    // card still opens the ticket as normal, select mode or not.
    var checkboxHtml = state.selectMode
      ? '<input type="checkbox" class="ticket-select-checkbox" data-action="toggle-ticket-select" data-id="' + t.id + '"' + (selected ? " checked" : "") + ' aria-label="Select ticket ' + escapeHtml(t.id) + '">'
      : "";

    return '<button type="button" class="ticket-card' + (overdue ? " overdue" : "") + (state.selectMode ? " selectable" : "") + (selected ? " selected" : "") + '" data-action="open-ticket" data-id="' + t.id + '">' +
      checkboxHtml +
      '<div class="ticket-stripe" style="background:' + stripeColor + '"></div>' +
      '<div class="ticket-body">' +
      '<div class="ticket-top"><span class="ticket-id mono">' + escapeHtml(t.id) + "</span>" + priorityBadge(t.priority, cfg) + "</div>" +
      '<p class="ticket-title">' + escapeHtml(t.title) + "</p>" +
      '<div class="ticket-badges">' + badges + "</div>" +
      '<div class="ticket-footer">' + assigneeTag(t.assignee) + footer + "</div>" +
      "</div></button>";
  }

  // =====================================================================
  // HOVER-TO-PREVIEW TOOLTIP — a single shared element (not one per card)
  // appended directly to <body>, so it survives render()'s #app.innerHTML
  // replacement and never needs to be part of the render tree at all. Shown/
  // hidden/positioned entirely via direct DOM manipulation from the
  // mouseover/mouseout listeners wired near the other document-level
  // listeners further down.
  // =====================================================================
  function ensureTicketTooltipEl() {
    var el = document.getElementById("ticket-tooltip");
    if (!el) {
      el = document.createElement("div");
      el.id = "ticket-tooltip";
      el.className = "ticket-tooltip";
      document.body.appendChild(el);
    }
    return el;
  }
  function ticketTooltipContentHtml(t) {
    var cfg = t.priorityConfig || state.slaConfig[t.team][t.priority];
    var rem = remainingMs(t, state.now);
    var overdue = isOverdue(t, state.now);
    var isResolved = t.status === "Resolved";
    var isTerminal = TERMINAL_STATUSES.indexOf(t.status) !== -1;
    var notStarted = slaNotStarted(t);
    var breached = isResolved && !notStarted && t.dateTimeResolved != null && t.dateTimeResolved > t.slaDate;

    var slaText;
    if (isTerminal) {
      slaText = isResolved
        ? (notStarted ? "Resolved (SLA never started — was unassigned)" : breached ? "Resolved past SLA (breached)" : "Resolved within SLA") + " — " + (t.rejectionReason || "No resolution notes provided")
        : ((t.status === "Rejected" || t.status === "Canceled") ? t.status + " — " + (t.rejectionReason || "No reason provided") : t.status);
    } else if (notStarted) {
      slaText = "Awaiting assignment — SLA hasn't started yet";
    } else if (t.isPaused) {
      slaText = "Frozen (paused) — " + formatDuration(rem) + " left when resumed";
    } else if (t.unassignedSince != null) {
      slaText = "Frozen (unassigned) — " + formatDuration(rem) + " left once reassigned";
    } else {
      slaText = overdue ? "Overdue by " + formatOverdueBy(rem) : formatDuration(rem) + " remaining (due " + formatClock(t.slaDate) + ")";
    }

    var detailsLabel = t.team === "TI" ? "Hunt Notes" : "Details";
    var badges = priorityBadge(t.priority, cfg) + categoryBadge(t.category) + clientBadge(t.client, t.agency);

    return '<div class="ticket-tooltip-header"><span class="ticket-tooltip-id">' + escapeHtml(t.id) + "</span>" + badges + "</div>" +
      '<p class="ticket-tooltip-title">' + escapeHtml(t.title) + "</p>" +
      '<p class="ticket-tooltip-label">' + escapeHtml(detailsLabel) + "</p>" +
      '<p class="ticket-tooltip-details">' + linkifyText(t.details) + "</p>" +
      '<div class="ticket-tooltip-meta">' +
      '<div class="ticket-tooltip-meta-item"><span class="ticket-tooltip-meta-label">Requested By</span><span class="ticket-tooltip-meta-value">' + escapeHtml(t.requestedBy) + "</span></div>" +
      '<div class="ticket-tooltip-meta-item"><span class="ticket-tooltip-meta-label">Assignee</span><span class="ticket-tooltip-meta-value">' + escapeHtml(t.assignee ? userName(t.assignee) : "Unassigned") + "</span></div>" +
      '<div class="ticket-tooltip-meta-item"><span class="ticket-tooltip-meta-label">Status</span><span class="ticket-tooltip-meta-value">' + escapeHtml(t.status) + (t.isPaused ? " (Paused)" : "") + "</span></div>" +
      '<div class="ticket-tooltip-meta-item"><span class="ticket-tooltip-meta-label">SLA</span><span class="ticket-tooltip-meta-value">' + escapeHtml(slaText) + "</span></div>" +
      "</div>";
  }
  // Fills + centers the shared tooltip over the board area. Previously this
  // anchored next to cardEl (flipping left/right based on available room),
  // but that could land it awkwardly over unrelated cards in a different
  // status column — centered is simpler and always predictable regardless
  // of where on the board the hovered card sits. Rendered off-screen-safe
  // but visibility:hidden first, measured, then placed and revealed in one
  // go so there's no visible jump. cardEl is unused now but kept as a
  // parameter so call sites (and a future "anchor near cursor" tweak, if
  // ever wanted) don't need to change.
  function showTicketTooltip(cardEl, ticketId) {
    var t = findTicket(ticketId);
    if (!t) return;
    var tip = ensureTicketTooltipEl();
    tip.innerHTML = ticketTooltipContentHtml(t);
    tip.style.visibility = "hidden";
    tip.style.display = "block";
    tip.style.left = "0px";
    tip.style.top = "0px";

    var margin = 10;
    var tipRect = tip.getBoundingClientRect();

    // Centered over the visible board area (excluding the sidebar), not
    // the raw viewport — otherwise the sidebar's width would visibly skew
    // the tooltip off-center relative to what's actually on screen.
    var sidebarEl = document.querySelector(".sidebar:not(.closed)");
    var boardLeft = sidebarEl ? sidebarEl.getBoundingClientRect().right : 0;
    var boardWidth = window.innerWidth - boardLeft;

    var left = boardLeft + (boardWidth - tipRect.width) / 2;
    left = Math.max(boardLeft + margin, Math.min(left, window.innerWidth - tipRect.width - margin));

    // max-height on .ticket-tooltip itself (min(85vh, 640px), see CSS)
    // already guarantees tipRect.height can never exceed the viewport, so
    // vertical centering can never push it off-screen at either edge —
    // still clamped defensively in case a future style change removes that.
    var top = (window.innerHeight - tipRect.height) / 2;
    top = Math.max(margin, Math.min(top, window.innerHeight - tipRect.height - margin));

    tip.style.left = left + "px";
    tip.style.top = top + "px";
    tip.style.visibility = "visible";
  }
  function hideTicketTooltip() {
    currentTooltipCard = null;
    var tip = document.getElementById("ticket-tooltip");
    if (tip) tip.style.display = "none";
  }
