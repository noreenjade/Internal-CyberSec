  function renderTeamTabs() {
    // Both objects derived from TEAMS (was a hardcoded {SOC,TI} literal
    // each) so a new team's tab renders with real counts instead of never
    // appearing in the tab row at all.
    var counts = {};
    Object.keys(TEAMS).forEach(function (key) {
      counts[key] = state.tickets.filter(function (t) { return t.team === key; }).length;
    });
    var overdueCounts = {};
    Object.keys(TEAMS).forEach(function (key) { overdueCounts[key] = 0; });
    state.tickets.forEach(function (t) { if (isOverdue(t, state.now)) overdueCounts[t.team] += 1; });

    var tabs = Object.keys(TEAMS).map(function (key) {
      var active = state.view === "board" && state.team === key;
      var od = overdueCounts[key];
      return '<button type="button" class="tab-btn' + (active ? " active" : "") + '" data-action="select-team" data-team="' + key + '">' +
        I("layoutGrid", 13) + '<span style="margin-left:6px">' + escapeHtml(TEAMS[key]) + "</span>" +
        '<span class="tab-count mono">' + counts[key] + "</span>" +
        (od > 0 ? '<span class="tab-overdue">🔴 ' + od + "</span>" : "") +
        "</button>";
    }).join("");

    // Superadmin-only — visible to everyone (so it isn't a mystery
    // disappearing feature) but disabled/grayed out for anyone else,
    // matching the "visible but locked, not hidden" preference. Uses the
    // same isSuperAdmin() flag as bulk-delete and Data Backup & Restore.
    var analyticsAllowed = isSuperAdmin(state.currentUserId);
    var analyticsTab = '<button type="button" class="tab-btn' + (state.view === "analytics" ? " active" : "") + '" data-action="open-analytics"' +
      (analyticsAllowed ? "" : " disabled") +
      ' title="' + (analyticsAllowed ? "SOC Analytics &amp; Metrics" : "Superadmin access only — ask a superadmin to give you access") + '">' +
      '<span style="margin-right:6px">📊</span>Dashboard / Analytics' +
      (analyticsAllowed ? "" : " " + I("lock", 11)) +
      "</button>";

    // Superadmin-only, same "visible but locked, not hidden" treatment as
    // the Analytics tab above — was role-gated (SE/Sr. SE/Leadership)
    // before; now gated the same way everywhere else "admin" means
    // something in this app (isSuperAdmin, same flag bulk-delete/Data
    // Backup & Restore already use).
    var adminAllowed = isSuperAdmin(state.currentUserId);
    var activeSettings = state.view === "settings";
    var adminTab = '<button type="button" class="tab-btn' + (activeSettings ? " active" : "") + '" data-action="open-settings"' +
      (adminAllowed ? "" : " disabled") +
      ' title="' + (adminAllowed ? "Settings" : "Superadmin access only — ask a superadmin to give you access") + '">' +
      I("settings", 14) + '<span style="margin-left:6px">Settings</span>' +
      (adminAllowed ? "" : " " + I("lock", 11)) +
      "</button>";

    var actions = "";
    if (state.view === "board") {
      var odTeam = overdueCounts[state.team];
      var myTicketCount = state.tickets.filter(function (t) { return t.team === state.team && t.assignee === state.currentUserId; }).length;
      // "Only My Tickets" and the Assignee dropdown share one underlying
      // filter (effectively assigneeFilter) so they can never disagree —
      // checking the box is equivalent to picking the current user in the
      // dropdown (and the dropdown reflects that, just disabled); picking
      // a different analyst in the dropdown clears the checkbox.
      var effectiveAssigneeValue = state.onlyMyTickets ? state.currentUserId : state.assigneeFilter;
      var assigneeFilterOptions = '<option value=""' + (effectiveAssigneeValue === "" ? " selected" : "") + ">All Assignees</option>" +
        '<option value="unassigned"' + (effectiveAssigneeValue === "unassigned" ? " selected" : "") + ">Unassigned</option>" +
        usersForTeam(state.team).map(function (u) {
          return '<option value="' + u.id + '"' + (effectiveAssigneeValue === u.id ? " selected" : "") + ">" + escapeHtml(u.name) + "</option>";
        }).join("");
      var clientFilterOptions = '<option value=""' + (state.clientFilter === "" ? " selected" : "") + ">All Clients</option>" +
        CLIENTS.map(function (c) {
          return '<option value="' + escapeHtml(c) + '"' + (state.clientFilter === c ? " selected" : "") + ">" + escapeHtml(c) + "</option>";
        }).join("");
      actions = '<div class="tabs-actions">' +
        '<select class="field-input" style="width:auto;padding:6px 10px;font-size:12px" data-action="filter-assignee" title="Filter board by assignee"' + (state.onlyMyTickets ? " disabled" : "") + ">" + assigneeFilterOptions + "</select>" +
        '<select class="field-input" style="width:auto;padding:6px 10px;font-size:12px" data-action="filter-client" title="Filter board by client">' + clientFilterOptions + "</select>" +
        (state.clientFilter === "NSOC"
          ? '<div style="width:180px">' + agencyComboboxHtml("filter", "", state.agencyFilterQuery, "All Agencies") + "</div>"
          : "") +
        '<label class="overdue-toggle"><input type="checkbox" data-action="toggle-my-tickets"' + (state.onlyMyTickets ? " checked" : "") + "> Only My Tickets" +
        (state.onlyMyTickets && myTicketCount > 0 ? '<span class="mono" style="color:var(--accent)">(' + myTicketCount + ")</span>" : "") +
        "</label>" +
        '<label class="overdue-toggle"><input type="checkbox" data-action="toggle-overdue-only"' + (state.showOverdueOnly ? " checked" : "") + "> Show Overdue Only" +
        (state.showOverdueOnly && odTeam > 0 ? '<span class="mono" style="color:var(--danger)">(' + odTeam + ")</span>" : "") +
        "</label>" +
        // Bulk delete (Select mode + Delete Selected) is superadmin-only —
        // deleting tickets one at a time is still open to everyone (see
        // delete-ticket in the modal), but selecting many at once and
        // wiping them in one click is exactly the kind of action a single
        // misclick could turn into "the whole board is gone," so it's
        // gated the same way Data Backup & Restore already is.
        (hasDeleteAccess(state.currentUserId)
          ? (function () {
              var visibleForSelect = filteredTeamTickets();
              if (state.statusFilter !== "All") visibleForSelect = visibleForSelect.filter(function (t) { return t.status === state.statusFilter; });
              var allVisibleSelected = state.selectMode && visibleForSelect.length > 0 && visibleForSelect.every(function (t) { return state.selectedTicketIds.indexOf(t.id) !== -1; });
              return '<button type="button" class="btn-secondary' + (state.selectMode ? " active" : "") + '" data-action="toggle-select-mode">' + (state.selectMode ? "Cancel Select" : "Select") + "</button>" +
                (state.selectMode
                  ? '<label class="overdue-toggle"><input type="checkbox" data-action="toggle-select-all"' + (allVisibleSelected ? " checked" : "") + "> Select All (" + visibleForSelect.length + ")</label>"
                  : "") +
                (state.selectMode && state.selectedTicketIds.length > 0
                  ? '<button type="button" class="btn-danger" data-action="delete-selected-tickets">Delete Selected (' + state.selectedTicketIds.length + ")</button>"
                  : "");
            })()
          : "") +
        '<button type="button" class="btn-primary" data-action="open-create">+ New Ticket</button>' +
        "</div>";
    }

    return '<div class="tabs-row">' + tabs + analyticsTab + adminTab + actions + "</div>";
  }

  // Every filter that narrows the board (team + assignee/overdue/client/
  // agency — everything except statusFilter itself) lives here, shared by
  // renderBoard() and renderSidebar(). Previously renderSidebar() counted by
  // team alone, so its per-status counts (and "All Tickets") disagreed with
  // whatever the board was actually showing the moment any other filter was
  // active — e.g. filtering the board to Client=QC still showed the whole
  // team's "New: 1" in the sidebar even though zero QC tickets were New,
  // making the New column look buggy/empty when it was just correctly
  // filtered. Both functions now derive from the same filtered set, so the
  // sidebar counts and the board can never disagree again.
  // Matches the board's date-picker (a native <input type="date">, value
  // always "YYYY-MM-DD" in local time) against a ticket's createdAt by
  // calendar day — not a Today/This Week/etc. preset, since the picker lets
  // the user land on any exact date directly via its calendar popup.
  function ticketCreatedOnDate(t, isoDateStr) {
    var d = new Date(t.createdAt);
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, "0"), day = String(d.getDate()).padStart(2, "0");
    return (y + "-" + m + "-" + day) === isoDateStr;
  }
  function filteredTeamTickets() {
    var tickets = state.tickets.filter(function (t) { return t.team === state.team; });
    if (state.showOverdueOnly) tickets = tickets.filter(function (t) { return isOverdue(t, state.now); });
    if (state.onlyMyTickets) {
      tickets = tickets.filter(function (t) { return t.assignee === state.currentUserId; });
    } else if (state.assigneeFilter === "unassigned") {
      tickets = tickets.filter(function (t) { return !t.assignee || t.assignee === UNASSIGNED; });
    } else if (state.assigneeFilter) {
      tickets = tickets.filter(function (t) { return t.assignee === state.assigneeFilter; });
    }
    if (state.clientFilter) {
      tickets = tickets.filter(function (t) { return (t.client || DEFAULT_CLIENT) === state.clientFilter; });
    }
    if (state.clientFilter === "NSOC" && state.agencyFilter) {
      if (state.agencyFilter === AGENCY_FILTER_GENERAL) {
        tickets = tickets.filter(function (t) { return !t.agency; });
      } else {
        tickets = tickets.filter(function (t) { return (t.agency || "") === state.agencyFilter; });
      }
    }
    if (state.specificDateFilter) {
      tickets = tickets.filter(function (t) { return ticketCreatedOnDate(t, state.specificDateFilter); });
    }
    var q = state.searchQuery.trim().toLowerCase();
    if (q) {
      tickets = tickets.filter(function (t) {
        return t.id.toLowerCase().indexOf(q) !== -1 ||
          t.title.toLowerCase().indexOf(q) !== -1 ||
          t.details.toLowerCase().indexOf(q) !== -1 ||
          t.requestedBy.toLowerCase().indexOf(q) !== -1;
      });
    }
    // Sorted last, after every filter above has already narrowed the set —
    // sorting first would just waste cycles ordering tickets that get
    // filtered back out anyway. .slice() first since .sort() mutates in
    // place and this array may still be the same reference as state.tickets
    // when no filter above matched anything (filter() always returns a new
    // array, but the very first assignment does too, so this is technically
    // always already a copy — kept explicit rather than relying on that).
    tickets = tickets.slice().sort(function (a, b) {
      return state.sortOrder === "oldest" ? a.createdAt - b.createdAt : b.createdAt - a.createdAt;
    });
    return tickets;
  }

  function renderSidebar() {
    var counts = { All: 0 };
    STATUSES.forEach(function (s) { counts[s] = 0; });
    filteredTeamTickets().forEach(function (t) {
      counts.All += 1;
      counts[t.status] = (counts[t.status] || 0) + 1;
    });
    var items = [{ key: "All", label: "All Tickets", icon: "listChecks" }].concat(
      STATUSES.map(function (s) { return { key: s, label: s, icon: STATUS_ICON[s] }; })
    );
    var rows = items.map(function (it) {
      var active = state.statusFilter === it.key;
      return '<button type="button" class="sidebar-item' + (active ? " active" : "") + '" data-action="select-status" data-status="' + it.key + '">' +
        I(it.icon, 13) + '<span class="lbl">' + escapeHtml(it.label) + "</span>" +
        '<span class="sidebar-count mono">' + (counts[it.key] || 0) + "</span></button>";
    }).join("");

    // Priority Filters — same shared filteredTeamTickets() the Status
    // Filters counts above and the board itself both derive from.
    // priorityFilter is deliberately NOT one of the filters inside
    // filteredTeamTickets() (same reason statusFilter isn't): picking a
    // priority narrows the board to just that priority, but the sidebar
    // itself keeps showing the full Critical/High/Medium/Low breakdown so
    // it stays useful as an at-a-glance comparison, not just a mirror of
    // whichever one is currently selected.
    var priorityOrder = ["Critical", "High", "Medium", "Low"];
    var teamPriorityCfg = state.slaConfig[state.team] || {};
    var ticketsForPriorityCounts = filteredTeamTickets();
    var priorityCounts = { All: ticketsForPriorityCounts.length };
    priorityOrder.forEach(function (p) { priorityCounts[p] = 0; });
    ticketsForPriorityCounts.forEach(function (t) { priorityCounts[t.priority] = (priorityCounts[t.priority] || 0) + 1; });
    var priorityRows = [{ key: "", label: "All Priorities" }].concat(
      priorityOrder.map(function (p) { return { key: p, label: p, color: teamPriorityCfg[p] ? teamPriorityCfg[p].color : "var(--text-faint)" }; })
    ).map(function (it) {
      var active = state.priorityFilter === it.key;
      var dot = it.key ? '<span class="dot" style="background:' + it.color + ';flex-shrink:0"></span>' : I("listChecks", 13);
      var count = it.key ? priorityCounts[it.key] : priorityCounts.All;
      return '<button type="button" class="sidebar-item' + (active ? " active" : "") + '" data-action="select-priority" data-priority="' + it.key + '">' +
        dot + '<span class="lbl">' + escapeHtml(it.label) + "</span>" +
        '<span class="sidebar-count mono">' + (count || 0) + "</span></button>";
    }).join("");

    return '<div class="sidebar' + (state.sidebarOpen ? "" : " closed") + '"><div class="sidebar-inner">' +
      '<p class="sidebar-label">Status Filters</p><div class="sidebar-list">' + rows + "</div>" +
      '<p class="sidebar-label" style="margin-top:18px">Priority Filters</p><div class="sidebar-list">' + priorityRows + "</div>" +
      "</div></div>";
  }

  function renderBoard() {
    var visibleColumns = state.statusFilter === "All" ? STATUSES : [state.statusFilter];
    var visibleTickets = filteredTeamTickets();
    if (state.statusFilter !== "All") visibleTickets = visibleTickets.filter(function (t) { return t.status === state.statusFilter; });
    if (state.priorityFilter) visibleTickets = visibleTickets.filter(function (t) { return t.priority === state.priorityFilter; });

    var grouped = {};
    visibleColumns.forEach(function (c) { grouped[c] = []; });
    visibleTickets.forEach(function (t) {
      // Normalize defensively at render time too — guarantees a ticket is
      // always placed in a real column instead of silently disappearing
      // (which is what a corrupted/unexpected status string would cause).
      var bucketStatus = normalizeStatus(t.status);
      var bucket = grouped[bucketStatus] || grouped[STATUSES[0]];
      if (bucket) bucket.push(t);
    });

    var cols = visibleColumns.map(function (col) {
      var list = grouped[col];
      var cards = list.length === 0
        ? '<div class="column-empty">' + I(STATUS_ICON[col], 22) + "<span>Empty</span></div>"
        : list.map(ticketCardHtml).join("");
      return '<div class="column"><div class="column-head">' + I(STATUS_ICON[col], 13) +
        '<span class="title">' + escapeHtml(col) + "</span><span class=\"count mono\">" + list.length + "</span></div>" +
        '<div class="column-body">' + cards + "</div></div>";
    }).join("");

    var sortOptions = [{ key: "newest", label: "Newest First" }, { key: "oldest", label: "Oldest First" }].map(function (o) {
      return '<option value="' + o.key + '"' + (state.sortOrder === o.key ? " selected" : "") + ">" + o.label + "</option>";
    }).join("");
    var toolbar = '<div class="board-toolbar">' +
      '<div class="board-search-box">' +
      '<span class="search-icon">' + I("search", 14) + "</span>" +
      '<input type="text" class="board-search-input" data-role="board-search-input" placeholder="Search by ID, title, details, or requester..." value="' + escapeHtml(state.searchQuery) + '">' +
      (state.searchQuery
        ? '<button type="button" class="board-search-clear" data-action="clear-board-search" title="Clear search">' + I("x", 13) + "</button>"
        : "") +
      "</div>" +
      (state.searchQuery ? '<span class="board-search-count mono">' + visibleTickets.length + " match" + (visibleTickets.length === 1 ? "" : "es") + "</span>" : "") +
      '<div class="board-sort-box">' +
      '<span class="sort-lbl">' + I("arrowUpDown", 12) + " Sort</span>" +
      '<select class="board-sort-select" data-action="sort-order">' + sortOptions + "</select>" +
      '<span class="sort-lbl" style="margin-left:8px">📅 Date</span>' +
      '<input type="date" class="board-sort-select" data-action="filter-specific-date" value="' + state.specificDateFilter + '" title="Show only tickets created on this date">' +
      (state.specificDateFilter
        ? '<button type="button" class="icon-btn" style="height:26px;width:26px;border:none" data-action="clear-specific-date" title="Clear date filter">' + I("x", 12) + "</button>"
        : "") +
      "</div>" +
      "</div>";

    return toolbar + '<div class="layout-row">' + renderSidebar() +
      '<div class="board-area"><div class="board-grid">' + cols + "</div></div></div>";
  }

  // =====================================================================
  // RENDER — ANALYTICS DASHBOARD
  // =====================================================================
  // accentVar/glowVar are theme-aware CSS var() references (e.g. "var(--accent)" /
  // "var(--accent-soft)") — never a raw hex/rgba — so the accent bar and the
  // ambient glow both automatically re-tint correctly when light/dark theme
  // is toggled, the same way every other color in this app is theme-driven.
  function kpiCardHtml(icon, label, value, sub, accentVar, glowVar, badgeHtml, extraHtml) {
    return '<div class="kpi-card" style="box-shadow:0 0 32px -18px ' + glowVar + ', 0 10px 24px -18px rgba(0,0,0,0.4);">' +
      '<div class="kpi-accent-bar" style="background:' + accentVar + ';"></div>' +
      '<p class="kpi-label">' + I(icon, 13) + " " + escapeHtml(label) + (badgeHtml || "") + "</p>" +
      '<p class="kpi-value">' + escapeHtml(value) + "</p>" +
      (extraHtml || "") +
      '<p class="kpi-sub">' + escapeHtml(sub) + "</p>" +
    "</div>";
  }

  function kpiChipHtml(color, label, count) {
    return '<span class="kpi-chip"><span class="dot" style="background:' + color + ';"></span>' + escapeHtml(label) + ' <span class="mono">' + count + "</span></span>";
  }

  // 90%+ is the generally-accepted "healthy" SOC SLA compliance bar; below
  // that but still majority-compliant is a soft warning, and under 70% is a
  // real problem worth calling out in red — matches the thresholds the user
  // asked for (emerald / amber / red).
  function complianceTier(rate) {
    if (rate >= 90) return { cls: "good", label: "On Target", accentVar: "var(--success)", glowVar: "var(--success-soft)" };
    if (rate >= 70) return { cls: "warn", label: "Needs Attention", accentVar: "var(--warning)", glowVar: "var(--warning-soft)" };
    return { cls: "bad", label: "At Risk", accentVar: "var(--danger)", glowVar: "var(--danger-soft)" };
  }

  // Every category (across both teams) gets one fixed color from this
  // palette, assigned by its index in CATEGORY_COLOR_ORDER — not by sort
  // rank within a render — so a category's color never shifts between
  // renders just because its relative count changed. Reuses the app's own
  // accent tokens first (cyan/violet/emerald/amber/red) and extends with a
  // few more distinct hues for teams whose category list runs longer.
  var CATEGORY_COLOR_ORDER = CATEGORIES.SOC.concat(CATEGORIES.TI.filter(function (c) { return CATEGORIES.SOC.indexOf(c) === -1; }));
  var CATEGORY_COLOR_PALETTE = [
    "linear-gradient(90deg, var(--accent), var(--accent-strong))",
    "linear-gradient(90deg, var(--purple), #6d28d9)",
    "linear-gradient(90deg, var(--success), #059669)",
    "linear-gradient(90deg, var(--warning), #d97706)",
    "linear-gradient(90deg, var(--danger), #b91c1c)",
    "linear-gradient(90deg, #38bdf8, #0369a1)",
    "linear-gradient(90deg, #f472b6, #be185d)",
    "linear-gradient(90deg, #a3e635, #4d7c0f)"
  ];
  function categoryColor(category) {
    var idx = CATEGORY_COLOR_ORDER.indexOf(category);
    return CATEGORY_COLOR_PALETTE[(idx === -1 ? 0 : idx) % CATEGORY_COLOR_PALETTE.length];
  }

  function barRowHtml(label, count, max, color) {
    // Width is always relative to the max count within THIS group (workload
    // or category), never a fixed/global scale — so the busiest entry in a
    // small group still reads as "the most", not as an absolute overflow.
    // (This means the single largest bar in a group legitimately renders at
    // 100% even when its raw count is small, e.g. 2 — that's correct
    // relative scaling, not a bug: with only 1-2 tickets in the group there
    // is nothing bigger to compare against.) A floor of 8% keeps a nonzero
    // bar visibly present even for small counts against a much larger max —
    // 0% would render as an unreadable sliver indistinguishable from "no
    // data" for the shortest bar in the list.
    var pct = count === 0 ? 0 : Math.max(8, Math.round((count / max) * 100));
    return '<div class="bar-row"><span class="bar-row-label" title="' + escapeHtml(label) + '">' + escapeHtml(label) + '</span>' +
      '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%;background:' + color + ';"></span></span>' +
      '<span class="bar-row-count mono">' + count + "</span></div>";
  }

  // A ring gauge built from three stacked SVG arcs (stroke-dasharray +
  // stroke-dashoffset driven) rather than a canvas/chart library — the
  // Artifact CSP blocks CDN scripts, so every visual in this dashboard is
  // hand-rolled SVG/CSS. The three counts are mutually exclusive buckets
  // (isOverdue() already excludes paused tickets, so "paused" and "breached"
  // never double up) and always sum to `total`, so the three arc lengths
  // always tile the full circle with no gap or overlap.
  function slaGaugeHtml(total, onTimeCount, breachedCount, pausedCount) {
    var r = 46, circumference = 2 * Math.PI * r;
    var onTimeLen = total > 0 ? (onTimeCount / total) * circumference : 0;
    var breachedLen = total > 0 ? (breachedCount / total) * circumference : 0;
    var pausedLen = total > 0 ? (pausedCount / total) * circumference : 0;
    var onTimePct = total > 0 ? Math.round((onTimeCount / total) * 100) : 0;
    return '<div class="gauge-wrap">' +
      '<div class="gauge-svg-wrap"><svg width="120" height="120" viewBox="0 0 120 120" style="transform:rotate(-90deg)">' +
        '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--border-soft)" stroke-width="12"/>' +
        (onTimeLen > 0
          ? '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--success)" stroke-width="12" stroke-dasharray="' + onTimeLen + " " + circumference + '" stroke-dashoffset="0"/>'
          : "") +
        (breachedLen > 0
          ? '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--danger)" stroke-width="12" stroke-dasharray="' + breachedLen + " " + circumference + '" stroke-dashoffset="-' + onTimeLen + '"/>'
          : "") +
        (pausedLen > 0
          ? '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--warning)" stroke-width="12" stroke-dasharray="' + pausedLen + " " + circumference + '" stroke-dashoffset="-' + (onTimeLen + breachedLen) + '"/>'
          : "") +
      "</svg>" +
      '<div class="gauge-center-text"><p class="gauge-center-value">' + (total > 0 ? onTimePct + "%" : "—") + '</p><p class="gauge-center-label">On-Time</p></div>' +
      "</div>" +
      '<div class="gauge-legend">' +
        '<div class="gauge-legend-item"><span class="gauge-dot" style="background:var(--success)"></span>On-Time<span class="mono">' + onTimeCount + "</span></div>" +
        '<div class="gauge-legend-item"><span class="gauge-dot" style="background:var(--danger)"></span>Breached<span class="mono">' + breachedCount + "</span></div>" +
        '<div class="gauge-legend-item"><span class="gauge-dot" style="background:var(--warning)"></span>Paused<span class="mono">' + pausedCount + "</span></div>" +
      "</div>" +
    "</div>";
  }

  function formatResolutionTime(ms) {
    if (ms <= 0) return "—";
    var totalMin = Math.round(ms / 60000);
    var h = Math.floor(totalMin / 60);
    var m = totalMin % 60;
    if (h === 0) return m + "m";
    return h + "h " + m + "m";
  }

  // Snapshot of the last-computed dashboard numbers, refreshed on every
  // renderAnalytics() call — "Export Summary" reads this rather than
  // recomputing the filters/aggregates itself, so the exported JSON is
  // always exactly what's on screen at the moment of the click.
  var lastAnalyticsSnapshot = null;

  // =====================================================================
  // PDF EXPORT — via the browser's own Print dialog (Save as PDF), not a
  // bundled PDF library. A dedicated print-only report, built fresh from
  // lastAnalyticsSnapshot at export time, sits hidden in the DOM at all
  // times; @media print hides everything else and shows only this report,
  // in plain light-on-white print styling instead of the app's dark theme.
  // =====================================================================
  function ensureAnalyticsPrintEl() {
    var el = document.getElementById("analytics-print-report");
    if (!el) {
      el = document.createElement("div");
      el.id = "analytics-print-report";
      document.body.appendChild(el);
    }
    return el;
  }
  function analyticsPrintReportHtml(snap) {
    var generated = new Date(snap.generatedAt).toLocaleString();
    var workloadRows = snap.workloadByAnalyst.length
      ? '<table class="print-table"><thead><tr><th>Analyst</th><th>Active Tickets</th></tr></thead><tbody>' +
        snap.workloadByAnalyst.map(function (w) { return "<tr><td>" + escapeHtml(w.analyst) + "</td><td>" + w.activeTickets + "</td></tr>"; }).join("") +
        "</tbody></table>"
      : "<p>No active tickets in range.</p>";
    var resolvedByAnalystRows = (snap.resolvedByAnalyst && snap.resolvedByAnalyst.length)
      ? '<table class="print-table"><thead><tr><th>Analyst</th><th>Resolved Tickets</th><th>Avg. Resolution Time</th></tr></thead><tbody>' +
        snap.resolvedByAnalyst.map(function (r) { return "<tr><td>" + escapeHtml(r.analyst) + "</td><td>" + r.resolvedCount + "</td><td>" + escapeHtml(r.avgResolutionTime) + "</td></tr>"; }).join("") +
        "</tbody></table>"
      : "<p>No resolved tickets in range.</p>";
    var categoryRows = snap.categoryBreakdown.length
      ? '<table class="print-table"><thead><tr><th>Category</th><th>Tickets</th></tr></thead><tbody>' +
        snap.categoryBreakdown.map(function (c) { return "<tr><td>" + escapeHtml(c.category) + "</td><td>" + c.ticketCount + "</td></tr>"; }).join("") +
        "</tbody></table>"
      : "<p>No tickets in range.</p>";
    var ticketListRows = (snap.ticketList && snap.ticketList.length)
      ? '<table class="print-table"><thead><tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>SLA</th><th>Assignee</th><th>Created</th></tr></thead><tbody>' +
        snap.ticketList.map(function (t) {
          return "<tr><td>" + escapeHtml(t.id) + "</td><td>" + escapeHtml(t.title) + "</td><td>" + escapeHtml(t.priority) + "</td><td>" + escapeHtml(t.status) + "</td><td>" + escapeHtml(t.slaStatus) + "</td><td>" + escapeHtml(t.assignee) + "</td><td>" + escapeHtml(formatClock(t.createdAt)) + "</td></tr>";
        }).join("") +
        "</tbody></table>"
      : "<p>No tickets in range.</p>";

    return '<div class="print-header"><h1>Internal CyberSec Practice — Analytics Summary</h1>' +
      "<p>" + escapeHtml(snap.filters.team) + " · " + escapeHtml(snap.filters.dateRange) + " · Generated " + escapeHtml(generated) + "</p></div>" +
      '<table class="print-kpi-table"><tbody>' +
      "<tr><td>Total Active Tickets</td><td>" + snap.totals.activeTickets + " of " + snap.totals.ticketsInRange + "</td></tr>" +
      "<tr><td>New / In Progress / Resolved</td><td>" + snap.totals.newTickets + " / " + snap.totals.inProgressTickets + " / " + snap.totals.resolvedTickets + "</td></tr>" +
      "<tr><td>SLA Compliance Rate</td><td>" + snap.sla.complianceRatePct + "%</td></tr>" +
      "<tr><td>On-Time / Breached / Paused</td><td>" + snap.sla.onTimeCount + " / " + snap.sla.breachedCount + " / " + snap.sla.pausedCount + "</td></tr>" +
      "<tr><td>Avg. Resolution Time</td><td>" + escapeHtml(snap.sla.avgResolutionTime) + "</td></tr>" +
      "</tbody></table>" +
      "<h2>Workload by Analyst</h2>" + workloadRows +
      "<h2>Resolved by Analyst</h2>" + resolvedByAnalystRows +
      "<h2>Category Breakdown</h2>" + categoryRows +
      "<h2>Tickets in Range (" + (snap.ticketList ? snap.ticketList.length : 0) + ")</h2>" + ticketListRows;
  }

  function renderAnalytics() {
    var now = state.now;
    var teamFilter = state.analyticsTeamFilter; // "All" | "SOC" | "TI"
    var dateFilter = state.analyticsDateFilter; // "Today" | "This Week" | "All Time"

    function inDateRange(t) {
      if (dateFilter === "All Time") return true;
      if (dateFilter === "Today") {
        var d = new Date(t.createdAt), today = new Date(now);
        return d.getFullYear() === today.getFullYear() && d.getMonth() === today.getMonth() && d.getDate() === today.getDate();
      }
      return now - t.createdAt <= 7 * 24 * 3600 * 1000; // "This Week" = trailing 7 days
    }

    var tickets = state.tickets.filter(function (t) {
      if (teamFilter !== "All" && t.team !== teamFilter) return false;
      return inDateRange(t);
    });

    var total = tickets.length;
    var active = tickets.filter(function (t) { return TERMINAL_STATUSES.indexOf(t.status) === -1; });
    var overdueOpen = active.filter(function (t) { return isOverdue(t, now); });
    var breachedResolved = tickets.filter(function (t) { return !slaNotStarted(t) && t.dateTimeResolved != null && t.dateTimeResolved > t.slaDate; });
    var breachedTotal = overdueOpen.length + breachedResolved.length;
    // isOverdue() already treats a paused ticket as never-overdue (its clock
    // is frozen), so overdueOpen and pausedCount are mutually exclusive —
    // these three buckets always sum to `total` with no double-count.
    var pausedCount = active.filter(function (t) { return t.isPaused; }).length;
    var onTimeCount = Math.max(0, total - breachedTotal - pausedCount);
    // Compliance Rate and the SLA Performance gauge's "On-Time %" must be the
    // exact same number wherever they're both shown — both are onTimeCount /
    // total, full stop. (An earlier version counted a paused ticket as
    // "compliant" here while the gauge broke it out as its own slice, which
    // made the KPI and the gauge silently disagree — same input, different
    // formula. Never let two displays of "the same metric" diverge like that.)
    var complianceRate = total > 0 ? Math.round((onTimeCount / total) * 100) : 100;
    var tier = complianceTier(complianceRate);

    var newCount = tickets.filter(function (t) { return t.status === "New"; }).length;
    var inProgressCount = tickets.filter(function (t) { return t.status === "In Progress"; }).length;
    var resolvedCount = tickets.filter(function (t) { return t.status === "Resolved"; }).length;

    var resolvedWithTimes = tickets.filter(function (t) { return t.status === "Resolved" && t.dateTimeResolved != null; });
    var avgResolutionMs = resolvedWithTimes.length > 0
      ? resolvedWithTimes.reduce(function (sum, t) { return sum + (t.dateTimeResolved - t.createdAt); }, 0) / resolvedWithTimes.length
      : 0;

    // Same resolvedWithTimes set as the KPI card above, just broken out per
    // analyst instead of averaged across everyone — "who resolved what, and
    // how fast" rather than just the team-wide number.
    var resolutionByAnalystMap = {};
    resolvedWithTimes.forEach(function (t) {
      var key = t.assignee && t.assignee !== UNASSIGNED ? t.assignee : "unassigned";
      if (!resolutionByAnalystMap[key]) resolutionByAnalystMap[key] = { totalMs: 0, count: 0 };
      resolutionByAnalystMap[key].totalMs += (t.dateTimeResolved - t.createdAt);
      resolutionByAnalystMap[key].count += 1;
    });
    var resolutionByAnalystEntries = Object.keys(resolutionByAnalystMap).map(function (key) {
      var d = resolutionByAnalystMap[key];
      return { label: key === "unassigned" ? "Unassigned" : userName(key), resolvedCount: d.count, avgResolutionMs: d.totalMs / d.count };
    }).sort(function (a, b) { return b.resolvedCount - a.resolvedCount; });
    var maxResolvedByAnalyst = resolutionByAnalystEntries.reduce(function (m, e) { return Math.max(m, e.resolvedCount); }, 0) || 1;
    var resolutionByAnalystHtml = resolutionByAnalystEntries.length === 0
      ? '<p class="footnote">No resolved tickets in range.</p>'
      : '<div class="bar-list">' + resolutionByAnalystEntries.map(function (e) {
          var pct = Math.max(8, Math.round((e.resolvedCount / maxResolvedByAnalyst) * 100));
          return '<div class="bar-row"><span class="bar-row-label" title="' + escapeHtml(e.label) + '">' + escapeHtml(e.label) + '</span>' +
            '<span class="bar-track"><span class="bar-fill" style="width:' + pct + '%;background:linear-gradient(90deg, var(--success), #34D399);"></span></span>' +
            '<span class="bar-row-count bar-row-count--wide mono">' + e.resolvedCount + " · " + escapeHtml(formatResolutionTime(e.avgResolutionMs)) + " avg</span></div>";
        }).join("") + "</div>";

    // Only New + In Progress here — this card's own headline number
    // (active.length) is every ticket NOT in TERMINAL_STATUSES, so a
    // "Resolved" chip never belonged in this breakdown: it made the chips
    // sum to more than the headline they're supposedly breaking down
    // (e.g. "Total Active Tickets: 1" with chips reading 0+1+4=5).
    // Resolved has its own home in the Resolved-by-Analyst card below.
    var activeBreakdownHtml = '<div class="kpi-breakdown">' +
      kpiChipHtml("var(--accent)", "New", newCount) +
      kpiChipHtml("var(--warning)", "In Progress", inProgressCount) +
    "</div>";
    var complianceBadgeHtml = '<span class="compliance-badge compliance-badge--' + tier.cls + '">' + escapeHtml(tier.label) + "</span>";

    var kpiHtml = '<div class="kpi-grid">' +
      kpiCardHtml("listChecks", "Total Active Tickets", String(active.length), active.length + " of " + total + " ticket" + (total === 1 ? "" : "s") + " in range", "var(--accent)", "var(--accent-soft)", "", activeBreakdownHtml) +
      kpiCardHtml("checkCircle", "SLA Compliance Rate", complianceRate + "%", breachedTotal + " breached · " + pausedCount + " paused of " + total, tier.accentVar, tier.glowVar, complianceBadgeHtml) +
      kpiCardHtml("alertTriangle", "Overdue / Breached", String(breachedTotal), overdueOpen.length + " open overdue · " + breachedResolved.length + " resolved late", "var(--danger)", "var(--danger-soft)") +
      // Sub-label spells out "per ticket" explicitly — this average is
      // computed over every resolved ticket individually (an analyst who
      // resolved more tickets naturally pulls it further toward their own
      // number), NOT a plain average of each analyst's own average in the
      // Resolved by Analyst card below. The two numbers only look like they
      // "should" match with equal weighting, which they're never meant to.
      kpiCardHtml("clock", "Avg. Resolution Time", formatResolutionTime(avgResolutionMs), "Per ticket, across " + resolvedWithTimes.length + " resolved ticket" + (resolvedWithTimes.length === 1 ? "" : "s"), "var(--purple)", "var(--purple-soft)") +
      "</div>";

    var gaugeHtml = slaGaugeHtml(total, onTimeCount, breachedTotal, pausedCount);

    // Workload: active (non-terminal) tickets only — "currently handling",
    // not lifetime ticket volume, which is what the category chart is for.
    var workloadMap = {};
    active.forEach(function (t) {
      var key = t.assignee && t.assignee !== UNASSIGNED ? t.assignee : "unassigned";
      workloadMap[key] = (workloadMap[key] || 0) + 1;
    });
    var workloadEntries = Object.keys(workloadMap).map(function (key) {
      return { label: key === "unassigned" ? "Unassigned" : userName(key), count: workloadMap[key], unassigned: key === "unassigned" };
    }).sort(function (a, b) { return b.count - a.count; });
    var maxWorkload = workloadEntries.reduce(function (m, e) { return Math.max(m, e.count); }, 0) || 1;
    var workloadHtml = workloadEntries.length === 0
      ? '<p class="footnote">No active tickets in range.</p>'
      : '<div class="bar-list">' + workloadEntries.map(function (e) {
          // Unassigned gets a neutral slate tone, distinct from the cyan/blue
          // used for every analyst who actually owns their tickets — but not
          // red, since an unassigned ticket isn't itself an error/breach
          // state (that's what the overdue badge/SLA gauge are for).
          var grad = e.unassigned ? "linear-gradient(90deg, #64748B, #94A3B8)" : "linear-gradient(90deg, var(--accent), var(--accent-strong))";
          return barRowHtml(e.label, e.count, maxWorkload, grad);
        }).join("") + "</div>";

    // Category: every ticket in range (not just active) — a volume-of-work
    // view, so resolved/closed tickets still count toward their category.
    var categoryMap = {};
    tickets.forEach(function (t) { categoryMap[t.category] = (categoryMap[t.category] || 0) + 1; });
    var categoryEntries = Object.keys(categoryMap).map(function (key) {
      return { label: key, count: categoryMap[key] };
    }).sort(function (a, b) { return b.count - a.count; });
    var maxCategory = categoryEntries.reduce(function (m, e) { return Math.max(m, e.count); }, 0) || 1;
    var categoryHtml = categoryEntries.length === 0
      ? '<p class="footnote">No tickets in range.</p>'
      : '<div class="bar-list">' + categoryEntries.map(function (e) {
          return barRowHtml(e.label, e.count, maxCategory, categoryColor(e.label));
        }).join("") + "</div>";

    var teamOptions = ["All"].concat(Object.keys(TEAMS)).map(function (key) {

  // =====================================================================

  // =====================================================================
  // RENDER — SLA SETTINGS PANEL
  // =====================================================================
  // =====================================================================
  // ADMIN / SLA SETTINGS — enterprise console shell
  // Sidebar-navigated: SLA Configurations / Team Roster & Roles / Access
  // Control & Permissions / System & SLA Notifications. Only this view's
  // rendering changed — the underlying SLA data flow (state.slaConfig,
  // state.slaDraft, the update-hours/save-sla actions, localStorage
  // persistence, per-ticket priorityConfig snapshotting) is untouched.
  // =====================================================================
  // "backup" is flagged superadminOnly as an explicit, defense-in-depth
  // guard: the whole Admin / SLA Settings console already requires
  // SUPERADMIN to reach at all (see the check at the top of settingsHtml),
  // so this can never currently be bypassed — but Data Backup & Restore
  // (export/restore of the entire dataset) gets its own named, separately
  // enforced restriction rather than quietly relying on the outer gate,
  // so it stays locked even if the outer gate is ever loosened later.
  var SETTINGS_NAV_ITEMS = [
    { key: "sla", label: "SLA Configurations", icon: "settings" },
    { key: "roster", label: "Team Roster & Roles", icon: "users" },
    { key: "categories", label: "Manage Categories", icon: "listChecks" },
    { key: "agencies", label: "Manage Agencies", icon: "listChecks" },
    { key: "clients", label: "Manage Clients", icon: "listChecks" },
    { key: "access", label: "Access Control & Permissions", icon: "lock" },
    { key: "notifications", label: "System & SLA Notifications", icon: "bell" },
    { key: "backup", label: "Data Backup & Restore", icon: "download", superadminOnly: true }
  ];

  function settingsHtml() {
    if (!isSuperAdmin(state.currentUserId)) {
      return '<div class="access-denied">' + I("lock", 34) + '<p style="margin-top:10px;font-size:13px">Settings requires Superadmin access. Ask a superadmin to give you access.</p></div>';
    }
    var panel = state.settingsPanel;
    var backupAllowed = isSuperAdmin(state.currentUserId);
    var panelHtml =
      panel === "roster" ? rosterPanelHtml() :
      panel === "categories" ? categoriesPanelHtml() :
      panel === "agencies" ? agenciesPanelHtml() :
      panel === "clients" ? clientsPanelHtml() :
      panel === "access" ? accessControlPanelHtml() :
      panel === "notifications" ? notificationsPanelHtml() :
      panel === "backup" ? (backupAllowed ? backupPanelHtml() : backupLockedHtml()) :
      slaConfigPanelHtml();

    return '<div class="settings-shell">' + settingsNavHtml() + '<div class="settings-content">' + panelHtml + "</div></div>";
  }

  function backupLockedHtml() {
    return '<div class="access-denied">' + I("lock", 34) +
      '<p style="margin-top:10px;font-size:13px">🔒 Superadmin Restricted: Only primary system administrators can export or restore database snapshots.</p></div>';
  }

  function settingsNavHtml() {
    var items = SETTINGS_NAV_ITEMS.filter(function (it) {
      return !it.superadminOnly || isSuperAdmin(state.currentUserId);
    }).map(function (it) {
      var active = state.settingsPanel === it.key;
      return '<button type="button" class="settings-nav-item' + (active ? " active" : "") + '" data-action="settings-nav" data-panel="' + it.key + '">' +
        I(it.icon, 15) + "<span>" + escapeHtml(it.label) + "</span></button>";
    }).join("");
    return '<div class="settings-nav"><p class="settings-nav-eyebrow">Admin Console</p><div class="settings-nav-list">' + items + "</div></div>";
  }

    if (!state.slaDraft) state.slaDraft = JSON.parse(JSON.stringify(state.slaConfig));

      return '<div class="sla-priority-card">' +
        '<div class="sla-priority-left"><span class="sla-priority-dot" style="background:' + cfg.color + '"></span><div>' +
        '<div class="sla-priority-name">' + priority + '</div>' +

        '<div class="sla-priority-right">' +

        priorityBadge(priority, cfg) +
        "</div></div>";
    }).join("");

    return '<div class="settings-panel-head"><h2>' + I("settings", 17) + " SLA Configurations</h2>" +

          '<td style="text-align:center"><input type="checkbox" class="roster-admin-check" style="cursor:pointer" data-action="roster-edit-can-delete" data-user="' + u.id + '"' + (d.canDeleteTickets ? " checked" : "") + "></td>" +
          '<td style="text-align:right;white-space:nowrap">' +

        '<td style="text-align:center"><input type="checkbox" class="roster-admin-check" disabled' + (u.isAdmin ? " checked" : "") + ' title="Click Edit to change"></td>' +

  function showBackupToast(message) {
    state.toast = message;
    render();
    setTimeout(function () { state.toast = null; render(); }, 3200);
  }

  function exportBackup() {
    // Re-checked here, not just hidden in the UI — same defense-in-depth
    // pattern as comment edit/delete elsewhere in this app.
    if (!isSuperAdmin(state.currentUserId)) {
      showBackupToast("🔒 Superadmin Restricted: Only primary system administrators can export or restore database snapshots.");
      return;
    }
    try {
      var backup = {
        format: "cyberops-task-tracker-backup",
        version: 1,
        exportedAt: Date.now(),
        tickets: state.tickets,
        slaConfig: state.slaConfig,
        categories: { SOC: CATEGORIES.SOC, TI: CATEGORIES.TI },
        agencies: { NSOC: AGENCIES.NSOC },
        users: { SOC: USERS.SOC, TI: USERS.TI, LEADERSHIP: LEADERSHIP }
      };
      var blob = new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var stamp = new Date(backup.exportedAt).toISOString().slice(0, 10);
      var a = document.createElement("a");
      a.href = url;
      a.download = "cyberops-backup-" + stamp + ".json";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showBackupToast("Backup downloaded — cyberops-backup-" + stamp + ".json");
    } catch (err) {
      console.error("Export failed:", err);
      showBackupToast("Export failed — see console for details.");
    }
  }

  function restoreBackupFromFile(file) {
    var reader = new FileReader();
    reader.onload = function (ev) {
      try {
        var parsed = JSON.parse(ev.target.result);
        var validShape = parsed && Array.isArray(parsed.tickets) && parsed.slaConfig && parsed.users &&
          Array.isArray(parsed.users.SOC) && Array.isArray(parsed.users.TI) && Array.isArray(parsed.users.LEADERSHIP);
        if (!validShape) {
          showBackupToast("That file doesn't look like a CyberOps backup — restore canceled.");
          return;
        }
        // categories/agencies are both optional so a backup exported before
        // category/agency export+restore existed can still restore cleanly
        // — each just leaves its own current value alone instead of failing
        // the whole restore over a field that didn't exist yet when the
        // file was made.
        var hasCategories = parsed.categories && Array.isArray(parsed.categories.SOC) && Array.isArray(parsed.categories.TI);
        var hasAgencies = parsed.agencies && Array.isArray(parsed.agencies.NSOC);
        var ticketCount = parsed.tickets.length;
        var userCount = parsed.users.SOC.length + parsed.users.TI.length + parsed.users.LEADERSHIP.length;
        var confirmed = window.confirm(
          "Restore this backup?\n\n" + ticketCount + " tickets and " + userCount + " roster members will REPLACE everything currently in the app — tickets, SLA config, and roster. This can't be undone.\n\nContinue?"
        );
        if (!confirmed) return;

        state.tickets = parsed.tickets;
        state.slaConfig = parsed.slaConfig;
        state.slaDraft = null; // stale draft would otherwise fight the just-restored config
        USERS.SOC = parsed.users.SOC;
        USERS.TI = parsed.users.TI;
        LEADERSHIP = parsed.users.LEADERSHIP;
        if (hasCategories) {
          CATEGORIES.SOC = parsed.categories.SOC;
          CATEGORIES.TI = parsed.categories.TI;
        }
        if (hasAgencies) AGENCIES.NSOC = parsed.agencies.NSOC;

        // Clear any UI state that might reference a ticket/user/comment that
        // no longer exists after the swap.
        state.selectedId = null;
        state.createOpen = false;
        editingUserId = null; editingUserDraft = null;
        addingUser = false; addUserDraft = null;
        editingCommentId = null; editingCommentDraft = null;
        if (!getAllUsers().some(function (u) { return u.id === state.currentUserId; })) {
          var fallback = getAllUsers();
          state.currentUserId = fallback.length ? fallback[0].id : "";
        }

        persistTickets();
        persistSlaConfig(state.slaConfig);
        persistRoster();
        if (hasCategories) persistCategories();
        if (hasAgencies) persistAgencies();
        showBackupToast(
          "Backup restored — " + ticketCount + " tickets and " + userCount + " roster members loaded" +
          (hasCategories ? "" : " (categories unchanged — this backup predates category export)") +
          (hasAgencies ? "" : " (agencies unchanged — this backup predates agency export)") +
          "."
        );
      } catch (err) {
        console.error("Restore failed:", err);
        showBackupToast("Restore failed — the file may be corrupted. See console for details.");
      }
    };
    reader.onerror = function () {
      console.error("Restore failed: could not read the file.");
      showBackupToast("Restore failed — could not read the file.");
    };
    reader.readAsText(file);
  }

  // =====================================================================
  // MASTER RENDER
  // =====================================================================
  function render() {
    // Google Sign-In is configured but nobody's signed in — show the login
    // screen instead of the app entirely (not just hide pieces of it). The
    // real gate is server-side (requireAuth on every /api/* route returns
    // 401 with no session cookie); this is just the matching frontend state.
    if (state.authConfigured && !state.authUser) {
      document.getElementById("app").innerHTML = loginScreenHtml();
      return;
    }
    // A card's hover tooltip is anchored to a specific, currently-hovered
    // card element — any render() can reshuffle/remove/relabel that exact
    // element (status change, filter, delete, etc.), so the safest fix is
    // just closing it rather than trying to keep it in sync with a DOM node
    // that's about to be torn down and rebuilt.
    hideTicketTooltip();
    // Reset before this render's panel HTML gets built below —
    // rowActionMenuHtml() (called while building whichever table is on
    // screen) repopulates this only if the row it's rendering matches
    // openRowMenu, so stale content from a previous render must not survive.
    pendingRowMenuHtml = "";
    // render() replaces #app's entire innerHTML on every action, which
    // destroys and recreates the modal's scrollable elements from scratch —
    // and a freshly created scrollable element always starts at scrollTop 0.
    // Without this, expanding history (or any other in-modal action, like
    // Save Changes or Pause) while scrolled down would silently snap the
    // view back to the top of the modal on every single re-render, which
    // looks exactly like "the modal jumped" even though its outer position
    // never actually moves. Snapshot each scrollable container's position
    // before the DOM is torn down, then restore it on the new element.
    // Only one modal (ticket or create) is ever open at a time in this app,
    // so a plain index-based snapshot is enough — no need to distinguish
    // which modal a given .modal-body belongs to.
    var scrollSnapshots = Array.prototype.map.call(document.querySelectorAll(".modal-body"), function (el) {
      return el.scrollTop;
    });
    // Same problem, same fix, for the horizontally-scrollable Roster/
    // Categories/Agencies/Access-Control tables — opening a row's "⋮"
    // action menu (toggle-row-menu) re-renders to show the dropdown,
    // which was silently snapping a scrolled-right table back to its left
    // edge every time, since a freshly rebuilt scroll container always
    // starts at scrollLeft 0.
    var tableScrollSnapshots = Array.prototype.map.call(document.querySelectorAll(".table-scroll-wrap"), function (el) {
      return el.scrollLeft;
    });
    // Same problem, same fix, for the board search box: typing a search
    // query needs the board to re-filter on every keystroke, which means a
    // full render() per character — but render() tearing down and rebuilding
    // #app.innerHTML destroys the very input the user is typing into, which
    // would otherwise drop focus and cursor position after every character.
    // Snapshot it before teardown, restore it on the freshly built input.
    var searchInputFocused = document.activeElement && document.activeElement.matches && document.activeElement.matches('[data-role="board-search-input"]');
    var searchSelection = searchInputFocused ? { start: document.activeElement.selectionStart, end: document.activeElement.selectionEnd } : null;
    // A render-time exception must never leave the screen silently frozen —
    // surface it and recover to a safe board view instead of a blank #app.
    try {
      var html = renderTopBar() + renderTeamTabs();
      if (state.view === "board") html += renderBoard();
      else if (state.view === "analytics") html += renderAnalytics();
      else html += settingsHtml();
      html += ticketModalHtml();
      html += createModalHtml();
      html += rejectReasonModalHtml();
      html += imagePreviewModalHtml();
      // Was previously appended only inside settingsHtml(), so
      // showBackupToast() (called from delete-ticket, post-comment,
      // bulk-delete, export-analytics-summary, submitCreateTicket, and
      // more — none of which are Admin/SLA Settings actions) silently
      // rendered nothing at all unless state.view already happened to be
      // "settings" when the toast fired. Appending it here, unconditional
      // on view, is what actually makes every one of those call sites work.
      html += (state.toast ? '<div class="toast">' + I("checkCircle", 16) + escapeHtml(state.toast) + "</div>" : "");
      // Always present in the DOM (even with empty content/hidden) so
      // positionFloatingRowMenu() below always has an element to measure
      // and show/hide, rather than conditionally existing based on
      // openRowMenu — placed at the very end of #app, outside every
      // table/card, so no ancestor's overflow can ever clip it.
      html += '<div id="row-action-menu" class="row-menu-dropdown">' + pendingRowMenuHtml + "</div>";
      document.getElementById("app").innerHTML = html;
      shieldTextInputsFromOutsideKeyHandlers();
      autoGrowAllDetailsAreas();
      positionFloatingRowMenu();
      var newModalBodies = document.querySelectorAll(".modal-body");
      for (var i = 0; i < newModalBodies.length && i < scrollSnapshots.length; i++) {
        newModalBodies[i].scrollTop = scrollSnapshots[i];
      }
      var newTableScrollWraps = document.querySelectorAll(".table-scroll-wrap");
      for (var ti = 0; ti < newTableScrollWraps.length && ti < tableScrollSnapshots.length; ti++) {
        newTableScrollWraps[ti].scrollLeft = tableScrollSnapshots[ti];
      }
      if (searchInputFocused) {
        var newSearchInput = document.querySelector('[data-role="board-search-input"]');
        if (newSearchInput) {
          newSearchInput.focus();
          newSearchInput.setSelectionRange(searchSelection.start, searchSelection.end);
        }
      }
      // Every action in this app funnels through render() — persisting here,
      // rather than in each individual action handler, guarantees tickets,
      // roster, category, and agency edits are saved to localStorage without
      // relying on remembering to add a persist call at every call site.
      persistTickets();
      persistRoster();
      persistCategories();
      persistAgencies();
      persistClients();
    } catch (err) {
      console.error("Render failed:", err);
      document.getElementById("app").innerHTML =
        '<div style="padding:40px;color:var(--danger);font-family:' + "ui-monospace,monospace" + '">' +
        "Something went wrong rendering the dashboard (see console). Recovering…</div>";
      state.selectedId = null;
      state.createOpen = false;
      state.view = "board";
    }
  }

  // Stops every keyboard event on text inputs/textareas from bubbling past
  // the field itself. This is defensive against anything OUTSIDE this
  // script — a host page's own keyboard-shortcut listener, or a browser
  // extension (Vimium-style keyboard nav is a common culprit) — reacting to
  // a keystroke that was meant to go into a text field and closing/dismissing
  // something as a side effect. It does NOT touch the 'input' event our own
  // state logic listens for, so normal typing/state updates are unaffected.
  function shieldTextInputsFromOutsideKeyHandlers() {
    var fields = document.querySelectorAll("#app input[type=text], #app textarea");
    for (var i = 0; i < fields.length; i++) {
      var el = fields[i];
      if (el.__keyShieldAttached) continue;
      el.__keyShieldAttached = true;
      ["keydown", "keyup", "keypress"].forEach(function (evt) {
        el.addEventListener(evt, function (e) { e.stopPropagation(); });
      });
    }
  }

  // Grows a .details-area textarea to fit its full content instead of
  // showing a fixed-height box the user has to scroll inside or manually
  // drag-resize to read everything — opening a ticket (or the reject/
  // cancel reason prompt, or the create-ticket form) should show the whole
  // Details/Hunt Notes text immediately. No upper cap here: .modal-body
  // already scrolls as a whole (see its CSS), so an extremely long Details
  // field just makes the modal's own scroll region taller instead of
  // fighting it with a second, nested scrollbar — same reasoning already
  // applied to .ticket-tooltip's single-scroll-region fix.
  function autoGrowTextarea(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  function autoGrowAllDetailsAreas() {
    document.querySelectorAll("#app .details-area").forEach(autoGrowTextarea);
  }

  // =====================================================================
  // EVENT HANDLING
  // =====================================================================
  function onClick(e) {
    // Closes an open row-action dropdown on any click outside it — doesn't
    // return early, since the click itself might be a totally unrelated
    // button that still needs its own handling below in the same pass.
    var stopBoundary = e.target.closest("[data-stop-close]");
    var el = e.target.closest("[data-action]");
    // A click on a plain element inside the modal panel (the Title input, a
    // label, empty padding...) has no data-action of its own, so closest()
    // would otherwise keep walking UP PAST the panel and land on the outer
    // overlay's data-action="overlay-close-*" — closing the modal on any
    // click inside it that isn't itself a button. The panel boundary must
    // win: only accept a found data-action element if it's inside (or is)
    // the stop-close boundary, not an ancestor of it.
    if (stopBoundary && el && !stopBoundary.contains(el)) el = null;
    var clickedAction = el ? el.getAttribute("data-action") : null;
    // Any click that isn't specifically toggling the row-menu itself closes
    // an already-open one — whether that click is a real button elsewhere
    // on the page (Edit/Delete inside the dropdown included) or empty
    // space. Centralizing it here means every one of the menu's Edit/
    // Delete targets (roster/category/agency, x6) gets this for free
    // instead of needing the same reset repeated in each handler.
    var closedRowMenu = false;
    if (openRowMenu && clickedAction !== "toggle-row-menu") { openRowMenu = null; closedRowMenu = true; }
    if (!el) {
      if (stopBoundary) { if (closedRowMenu) render(); return; }
      if (e.target.closest(".modal-overlay")) {
        var overlay = e.target.closest(".modal-overlay");
        if (overlay.getAttribute("data-action") === "overlay-close-ticket") { state.selectedId = null; render(); }
        else if (overlay.getAttribute("data-action") === "overlay-close-create") { state.createOpen = false; render(); }
        else if (overlay.getAttribute("data-action") === "overlay-close-reject") { rejectPrompt = null; render(); }
        else if (overlay.getAttribute("data-action") === "overlay-close-imgpreview") { state.imagePreviewUrl = null; render(); }
        return;
      }
      if (closedRowMenu) render();
      return;
    }
    var action = el.getAttribute("data-action");
    var id = el.getAttribute("data-id");

    if (action === "toggle-row-menu") {
      var menuKey = el.getAttribute("data-menu-key");
      openRowMenu = openRowMenu === menuKey ? null : menuKey;
      render(); return;
    }

    if (action === "toggle-sidebar") { state.sidebarOpen = !state.sidebarOpen; render(); return; }
    if (action === "toggle-theme") { state.theme = state.theme === "dark" ? "light" : "dark"; applyTheme(state.theme); persistTheme(state.theme); render(); return; }
    if (action === "sign-out") { signOut(); return; }
    if (action === "select-team") { state.team = el.getAttribute("data-team"); state.view = "board"; state.statusFilter = "All"; state.assigneeFilter = ""; render(); return; }
    if (action === "clear-board-search") { state.searchQuery = ""; render(); return; }
    if (action === "clear-specific-date") { state.specificDateFilter = ""; render(); return; }
    if (action === "open-settings") {
      // Defense-in-depth to match the tab itself being disabled for a
      // non-superadmin — see renderTeamTabs().
      if (!isSuperAdmin(state.currentUserId)) return;
      state.view = "settings"; render(); return;
    }
    if (action === "open-analytics") {
      // Defense-in-depth to match the tab itself being disabled for a
      // non-superadmin — see renderTeamTabs().
      if (!isSuperAdmin(state.currentUserId)) return;
      state.view = "analytics"; render(); return;
    }
    if (action === "analytics-team-filter") { state.analyticsTeamFilter = el.getAttribute("data-team"); render(); return; }
    if (action === "analytics-date-filter") { state.analyticsDateFilter = el.getAttribute("data-range"); render(); return; }
    if (action === "export-analytics-summary") {
      if (!lastAnalyticsSnapshot) return;
      // Mirrors exportBackup()'s try/catch + toast pattern below — a silent
      // download with no on-screen confirmation reads as "the button did
      // nothing" even when the file landed fine, and any Blob/anchor failure
      // here would otherwise fail silently with no visible error.
      try {
        var stamp = new Date(lastAnalyticsSnapshot.generatedAt).toISOString().slice(0, 10);
        var snapshotJson = JSON.stringify(lastAnalyticsSnapshot, null, 2);
        var blob = new Blob([snapshotJson], { type: "application/json" });
        var blobUrl = URL.createObjectURL(blob);
        var downloadLink = document.createElement("a");
        downloadLink.href = blobUrl;
        downloadLink.download = "cyberops-analytics-summary-" + stamp + ".json";
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
        URL.revokeObjectURL(blobUrl);
        showBackupToast("Analytics summary downloaded — cyberops-analytics-summary-" + stamp + ".json");
      } catch (err) {
        console.error("Analytics export failed:", err);
        showBackupToast("Export failed — see console for details.");
      }
      return;
    }
    if (action === "export-analytics-pdf") {
      if (!lastAnalyticsSnapshot) return;
      var printEl = ensureAnalyticsPrintEl();
      printEl.innerHTML = analyticsPrintReportHtml(lastAnalyticsSnapshot);
      // Give the browser a beat to actually paint the freshly-filled report
      // before opening the print dialog — calling window.print() in the
      // same tick occasionally caught the element still empty in testing.
      setTimeout(function () { window.print(); }, 60);
      return;
    }
    if (action === "settings-nav") { state.settingsPanel = el.getAttribute("data-panel"); render(); return; }
    if (action === "toggle-overdue-only") { return; } // handled in change listener
    if (action === "open-create") { createForm = freshCreateForm(state.team); state.createOpen = true; render(); return; }
    if (action === "toggle-select-mode") {
      // Defense-in-depth to match the button itself not rendering at all
      // for someone without delete access — see renderTeamTabs().
      if (!hasDeleteAccess(state.currentUserId)) { showBackupToast("🔒 Restricted: You don't have permission to delete tickets."); return; }
      state.selectMode = !state.selectMode;
      if (!state.selectMode) state.selectedTicketIds = []; // leaving select mode always clears selections
      render(); return;
    }
    if (action === "delete-selected-tickets") {
      if (!hasDeleteAccess(state.currentUserId)) { showBackupToast("🔒 Restricted: You don't have permission to delete tickets."); return; }
      var idsToDelete = state.selectedTicketIds.slice();
      if (!idsToDelete.length) return;
      var confirmedBulkDelete = window.confirm(
        "Delete " + idsToDelete.length + " selected ticket" + (idsToDelete.length === 1 ? "" : "s") + "? This cannot be undone."
      );
      if (!confirmedBulkDelete) return;

      Promise.all(idsToDelete.map(function (ticketId) {
        return fetch(API_BASE_URL + "/tickets/" + encodeURIComponent(ticketId), { method: "DELETE" })
          .then(function (res) { return { id: ticketId, ok: res.ok }; })
          .catch(function () { return { id: ticketId, ok: false }; });
      })).then(function (results) {
        var deletedIds = results.filter(function (r) { return r.ok; }).map(function (r) { return r.id; });
        var failedIds = results.filter(function (r) { return !r.ok; }).map(function (r) { return r.id; });
        state.tickets = state.tickets.filter(function (t) { return deletedIds.indexOf(t.id) === -1; });
        deletedIds.forEach(function (deletedId) { delete lastSyncedTicketsById[deletedId]; });
        // Failures stay selected so the user can see what's left and retry —
        // a silent partial failure would otherwise look like "it all worked."
        state.selectedTicketIds = failedIds;
        if (failedIds.length) {
          console.error("Bulk delete failed for:", failedIds);
          showBackupToast("Deleted " + deletedIds.length + " ticket(s) — " + failedIds.length + " failed, see console.");
        }
        render();
      });
      return;
    }
    if (action === "open-ticket") { state.selectedId = id; state.historyExpanded = false; draftDetailsCache = {}; draftAssigneeCache = {}; draftCategoryCache = {}; draftClientCache = {}; draftAgencyCache = {}; draftAgencyQueryCache = {}; draftStatusCache = {}; commentDraftCache = { ticketId: null, text: "" }; editingCommentId = null; editingCommentDraft = null; render(); return; }
    if (action === "toggle-history") { state.historyExpanded = !state.historyExpanded; render(); return; }
    if (action === "close-ticket" || action === "overlay-close-ticket") { state.selectedId = null; render(); return; }

    if (action === "delete-ticket") {
      // Defense-in-depth, same as delete-selected-tickets — the button
      // itself is already hidden for non-Superadmins, but this blocks the
      // action even if it's somehow triggered another way.
      if (!hasDeleteAccess(state.currentUserId)) { showBackupToast("🔒 Restricted: You don't have permission to delete tickets."); return; }
      var ticketToDelete = findTicket(id);
      if (!ticketToDelete) return;
      var confirmedDelete = window.confirm(
        "Are you sure you want to delete this ticket?\n\n" + id + " — " + ticketToDelete.title + "\n\nThis can't be undone."
      );
      if (!confirmedDelete) return;

      fetch(API_BASE_URL + "/tickets/" + encodeURIComponent(id), { method: "DELETE" })
        .then(function (res) {
          if (!res.ok) throw new Error("HTTP " + res.status);
          state.tickets = state.tickets.filter(function (t) { return t.id !== id; });
          delete lastSyncedTicketsById[id];
          state.selectedId = null;
          render();
        })
        .catch(function (err) {
          console.error("Could not delete ticket:", err);
          showBackupToast("Could not delete " + id + " — see console for details.");
        });
      return;
    }
    if (action === "close-create" || action === "overlay-close-create") { state.createOpen = false; createForm = null; render(); return; }
    if (action === "close-reject" || action === "overlay-close-reject") { rejectPrompt = null; render(); return; }
    if (action === "preview-attachment") { state.imagePreviewUrl = el.getAttribute("src"); render(); return; }
    if (action === "close-imgpreview" || action === "overlay-close-imgpreview") { state.imagePreviewUrl = null; render(); return; }
    if (action === "submit-reject") {
      if (!rejectPrompt || !rejectPrompt.text.trim()) return; // defense-in-depth — the button is already disabled for this
      changeStatus(rejectPrompt.ticketId, rejectPrompt.status, rejectPrompt.text.trim());
      rejectPrompt = null;
      render();
      return;
    }
    if (action === "select-status") { state.statusFilter = el.getAttribute("data-status"); render(); return; }
    if (action === "select-priority") { state.priorityFilter = el.getAttribute("data-priority"); render(); return; }

    if (action === "pause-ticket") {
      var t1 = findTicket(id);
      if (t1 && !t1.isPaused) {
        var pausedAt = Date.now();
        var h1 = t1.history.concat([{ id: uid(), action: "Paused", time: pausedAt, note: "Paused by analyst" }]);
        updateTicket(id, { isPaused: true, pausedAt: pausedAt, history: h1 });
      }
      render(); return;
    }
    if (action === "resume-ticket") {
      var t2 = findTicket(id);
      if (t2 && t2.isPaused) {
        var resumedAt = Date.now();
        var pausedDuration = resumedAt - t2.pausedAt;
        var h2 = t2.history.concat([{ id: uid(), action: "Resumed", time: resumedAt, durationMs: pausedDuration, note: "SLA extended by " + Math.max(1, Math.round(pausedDuration / 60000)) + " min" }]);
        updateTicket(id, { isPaused: false, pausedAt: null, slaDate: t2.slaDate + pausedDuration, totalPausedMs: t2.totalPausedMs + pausedDuration, history: h2 });
      }
      render(); return;
    }
    if (action === "delete-pause-log") {
      deletePauseLog(id, el.getAttribute("data-entry"));
      render(); return;
    }
    if (action === "save-changes") {
      // One Save Changes button commits every pending draft together:
      // Details/Hunt Notes (read live from the textarea), Assignee/Category/
      // Client/Agency, and now Status too (from their draft caches, since a
      // <select> doesn't need per-keystroke draft tracking).
      var t = findTicket(id);
      if (!t) return;
      var ta = document.querySelector('[data-role="details-input"][data-id="' + id + '"]');
      var newDetails = ta ? ta.value.trim() : t.details;
      if (!newDetails) return; // Details/Hunt Notes can't be saved blank — the button is already disabled for this, this is the same defense-in-depth re-check other handlers in this file use
      // Status goes through changeStatus() first, not a plain field patch —
      // it has its own history-logging/dateTimeResolved/terminalSince rules
      // that a generic patch doesn't replicate. Reads fresh off t.status, so
      // this is a no-op unless a New/In Progress draft is actually pending.
      var statusDraftToSave = draftStatusCache[id];
      if (statusDraftToSave != null && statusDraftToSave !== t.status) {
        changeStatus(id, statusDraftToSave);
      }
      var patch = {};
      patch.details = newDetails;
      patch.assignee = draftAssigneeCache[id] != null ? draftAssigneeCache[id] : (t.assignee || "");
      patch.category = draftCategoryCache[id] != null ? draftCategoryCache[id] : t.category;
      patch.client = draftClientCache[id] != null ? draftClientCache[id] : (t.client || DEFAULT_CLIENT);
      patch.agency = patch.client === "NSOC" ? (draftAgencyCache[id] != null ? draftAgencyCache[id] : (t.agency || "")) : "";
      updateTicket(id, patch);
      delete draftDetailsCache[id];
      delete draftAssigneeCache[id];
      delete draftCategoryCache[id];
      delete draftClientCache[id];
      delete draftAgencyCache[id];
      delete draftAgencyQueryCache[id];
      delete draftStatusCache[id];
      render(); return;
    }
    if (action === "trigger-file") {
      var input = document.getElementById("file-input-" + id);
      if (input) input.click();
      return;
    }
    if (action === "delete-attachment") {
      var attId = el.getAttribute("data-attachment");
      var tAtt = findTicket(id);
      if (!tAtt) return;
      // Commits immediately (same as adding an attachment already does) —
      // no separate Save Changes step for attachments, so delete matches
      // that existing behavior rather than introducing a second, different
      // save flow just for removal. render() persists it to localStorage
      // automatically, same as every other ticket update.
      updateTicket(id, { attachments: (tAtt.attachments || []).filter(function (a) { return a.id !== attId; }) });
      render(); return;
    }
    if (action === "post-comment") {
      var ca = document.querySelector('[data-role="comment-input"][data-id="' + id + '"]');
      var text = ca ? ca.value.trim() : "";
      if (!text) return;
      commentDraftCache = { ticketId: id, text: "" };
      state.mentionQuery = null;
      render();

      // Posted through the dedicated comments endpoint (not the local-state +
      // full-array PUT every other ticket edit uses) so the server can run
      // @mention detection and fire the mention notification at creation
      // time — persistTickets()'s bulk PUT has no "this just happened" event
      // to hook a one-time side effect like that onto.
      fetch(API_BASE_URL + "/tickets/" + encodeURIComponent(id) + "/comments", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ authorId: state.currentUserId, text: text })
      }).then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);

      }).then(function (newComment) {

        var updated = findTicket(id);
        if (updated) lastSyncedTicketsById[id] = JSON.stringify(updated);
        render();

      });
